# This is the human-maintained source for the independent frontend's stock
# Caddy configuration. The image build converts its Caddyfile value to Caddy's
# native JSON, so runtime needs no adapter or custom server binary.
caddyfile: |
  :8080 {
    # The entry proxy owns API dispatch. A separate handler prevents a proxy
    # routing fault from converting an API error into a successful SPA document.
    handle /api {
      respond 404
    }
    handle /api/* {
      respond 404
    }

    # Hashed build assets are immutable but never SPA fallbacks: a missing
    # file is a stale deployment reference from an open pre-update tab, not a
    # client route. It must 404 uncached — the SPA document would both poison
    # the immutable cache and fail module loading as a 200 HTML response.
    handle /assets/* {
      root * /srv
      header {
        Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
        Referrer-Policy "no-referrer"
        X-Content-Type-Options "nosniff"
      }
      @found file {path}
      header @found Cache-Control "public, max-age=31536000, immutable"
      @missing not file {path}
      header @missing Cache-Control "no-store"
      file_server
    }

    handle {
      root * /srv
      header {
        Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
        Referrer-Policy "no-referrer"
        X-Content-Type-Options "nosniff"
      }

      # SPA fallbacks are documents and must always revalidate.
      header Cache-Control "no-cache"

      # A pathname without a static file is a client route and must survive a
      # direct navigation or refresh.
      try_files {path} /index.html
      file_server
    }
  }
