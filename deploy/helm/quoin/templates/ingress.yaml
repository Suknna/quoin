{{- if .Values.input.publicIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-quoin
  labels: {{- include "quoin.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.input.publicIngress.className }}
  tls:
    - hosts: [{{ .Values.input.publicIngress.host | quote }}]
      secretName: {{ .Values.input.publicIngress.tlsSecretName }}
  rules:
    - host: {{ .Values.input.publicIngress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-quoin-public, port: { name: public } } }
{{- end }}
{{- if .Values.input.steleIngress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-stele
  labels: {{- include "quoin.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.input.steleIngress.className }}
  tls:
    - hosts: [{{ .Values.input.steleIngress.host | quote }}]
      secretName: {{ .Values.input.steleIngress.tlsSecretName }}
  rules:
    - host: {{ .Values.input.steleIngress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-stele-webhook, port: { name: webhook } } }
{{- end }}
