          livenessProbe: { httpGet: { path: /livez, port: ops }, initialDelaySeconds: 5, periodSeconds: 10, failureThreshold: 6 }
          volumeMounts:
            - { name: config, mountPath: /etc/quoin/component.yaml, subPath: component.yaml, readOnly: true }
            - { name: state, mountPath: /var/lib/lintel }
            - { name: runtime-ca, mountPath: /run/quoin-secrets/runtime-ca.pem, subPath: runtime-ca.pem, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: config
          configMap: { name: {{ .Release.Name }}-component-lintel }
        - name: state
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-lintel-state }
        - name: runtime-ca
          secret:
            secretName: {{ include "quoin.secretName" . }}
            items: [{ key: runtime-ca.pem, path: runtime-ca.pem }]
        - { name: tmp, emptyDir: {} }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: {{ include "quoin.shmBytes" . }} }
---
