# Set publicOrigin to the exact externally visible HTTPS origin before first start.
component: quoin
# Enabled plugins (ADR 0004): the deployment YAML selects the enabled set.
# The mainline enables exactly the three source plugins; the browser and
# kubernetes plugins are retired (listing them fails startup). IDs must match
# the well-known IDs in internal/plugins.
enabledPlugins: [alertmanager, prometheus, thanos]
publicOrigin: https://quoin.example.com
# Exact public Alertmanager receiver; never an internal container endpoint.
stelePublicURL: https://quoin.example.com/stele/alerts
dataDirectory: /var/lib/quoin/data
backupDirectory: /var/lib/quoin/backups
rootKeyFile: /run/quoin-secrets/root-key
runtimeTlsCertificateFile: /run/quoin-secrets/runtime-tls.crt
runtimeTlsPrivateKeyFile: /run/quoin-secrets/runtime-tls.key
steleServiceTokenFile: /run/quoin-secrets/stele-service-token
