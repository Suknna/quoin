# Set publicOrigin to the exact externally visible HTTPS origin before first start.
component: quoin
# Enabled plugins (ADR 0004): the deployment YAML selects the enabled set.
# The mainline enables exactly the three source plugins (unknown IDs fail
# startup). IDs must match
# the well-known IDs in internal/plugins.
enabledPlugins: [alertmanager, prometheus, thanos]
publicOrigin: https://quoin.example.com
# Exact public Alertmanager receiver; never an internal container endpoint.
stelePublicURL: https://quoin.example.com/stele/webhook/alertmanager
dataDirectory: /var/lib/quoin/data
backupDirectory: /var/lib/quoin/backups
rootKeyFile: /run/quoin-secrets/root-key
runtimeTlsCertificateFile: /run/quoin-secrets/runtime-tls.crt
runtimeTlsPrivateKeyFile: /run/quoin-secrets/runtime-tls.key
# Deployment CA that signed the Stele/Plinth client certificates (ADR-0009):
# the Runtime gRPC listener verifies mTLS client certificates against it.
runtimeClientCaFile: /run/quoin-secrets/runtime-ca.pem
# Audit retention (ADR-0006): default and minimum is six calendar months;
# deployments may only extend it. Omit the whole section to keep the default.
audit:
  retentionMonths: 6
# Login channels (ADR-0010). Omit the whole section for the default: the
# local emergency channel enabled and visible. Enabling OIDC requires the
# three endpoint fields plus secretsFile, a read-only secret reference file
# (reference name -> value, JSON or YAML) providing oidcClientSecret; the
# secret value never belongs in this YAML. local.enabled=false together with
# oidc.enabled=false is rejected at startup.
# authentication:
#   local:
#     enabled: true
#     visible: true
#   oidc:
#     enabled: true
#     issuer: https://sso.example.com
#     clientId: quoin
#     redirectUrl: https://quoin.example.com/api/v1/auth/oidc/callback
#     label: 统一身份登录
#   secretsFile: /run/quoin-secrets/auth-secrets.yaml
