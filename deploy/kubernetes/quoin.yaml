# Apply this manifest to an isolated namespace. It intentionally has no
# namespace field so the deployer, rather than this repository, selects it.
# Before applying, create `gateway-tls` (tls.crt/tls.key) and `quoin-secrets`
# (root-key, runtime-ca.pem, runtime-tls.crt, runtime-tls.key,
# stele-service-token) in that namespace. See docs/deployment.md.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  caddy.json: |
    {
      "apps": {
        "http": {
          "servers": {
            "https": {
              "listen": [":8443"],
              "automatic_https": {"disable": true, "disable_redirects": true},
              "routes": [
                {
                  "match": [{"path": ["/api"]}],
                  "handle": [{"handler": "headers", "response": {"set": {"Strict-Transport-Security": ["max-age=31536000; includeSubDomains"]}}}, {"handler": "static_response", "status_code": 404}],
                  "terminal": true
                },
                {
                  "match": [{"path": ["/api/*"]}],
                  "handle": [{"handler": "headers", "response": {"set": {"Strict-Transport-Security": ["max-age=31536000; includeSubDomains"]}}}, {"handler": "reverse_proxy", "upstreams": [{"dial": "quoin:8080"}]}],
                  "terminal": true
                },
                {
                  "match": [{"path": ["/stele", "/stele/*"]}],
                  "handle": [{"handler": "headers", "response": {"set": {"Strict-Transport-Security": ["max-age=31536000; includeSubDomains"]}}}, {"handler": "rewrite", "strip_path_prefix": "/stele"}, {"handler": "reverse_proxy", "upstreams": [{"dial": "stele:8080"}]}],
                  "terminal": true
                },
                {
                  "handle": [{"handler": "headers", "response": {"set": {"Strict-Transport-Security": ["max-age=31536000; includeSubDomains"]}}}, {"handler": "reverse_proxy", "upstreams": [{"dial": "frontend:8080"}]}]
                }
              ],
              "tls_connection_policies": [{}]
            }
          }
        },
        "tls": {
          "certificates": {
            "load_files": [{"certificate": "/etc/caddy/tls/tls.crt", "key": "/etc/caddy/tls/tls.key"}]
          }
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quoin-config
data:
  component.yaml: |
    component: quoin
    publicOrigin: https://quoin.example.com
    dataDirectory: /var/lib/quoin/data
    backupDirectory: /var/lib/quoin/backups
    rootKeyFile: /run/quoin-secrets/root-key
    runtimeTlsCertificateFile: /run/quoin-secrets/runtime-tls.crt
    runtimeTlsPrivateKeyFile: /run/quoin-secrets/runtime-tls.key
    steleServiceTokenFile: /run/quoin-secrets/stele-service-token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: plinth-config
data:
  component.yaml: |
    component: plinth
    stateDirectory: /var/lib/plinth
    workspaceDirectory: /var/lib/plinth/workspaces
    quoinRuntimeEndpoint: https://quoin:8443
    quoinRuntimeCaFile: /run/quoin-secrets/runtime-ca.pem
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lintel-config
data:
  component.yaml: |
    component: lintel
    stateDirectory: /var/lib/lintel
    quoinRuntimeEndpoint: https://quoin:8443
    quoinRuntimeCaFile: /run/quoin-secrets/runtime-ca.pem
    browserSlots: 1
    minimumShmBytes: 1073741824
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stele-config
data:
  component.yaml: |
    component: stele
    quoinRuntimeEndpoint: https://quoin:8443
    quoinRuntimeCaFile: /run/quoin-secrets/runtime-ca.pem
    serviceTokenFile: /run/quoin-secrets/stele-service-token
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quoin-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quoin-backups
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plinth-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lintel-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: gateway}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: caddy:2.10.2-alpine
          command: [caddy]
          args: [run, --config, /etc/caddy/caddy.json]
          ports: [{name: https, containerPort: 8443}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}}
          readinessProbe: {tcpSocket: {port: https}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: https}, periodSeconds: 10}
          volumeMounts:
            - {name: config, mountPath: /etc/caddy/caddy.json, subPath: caddy.json, readOnly: true}
            - {name: tls, mountPath: /etc/caddy/tls, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: config-data, mountPath: /config}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: gateway-config}}
        - {name: tls, secret: {secretName: gateway-tls}}
        - {name: data, emptyDir: {}}
        - {name: config-data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: frontend}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: frontend}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: quoin/frontend:v0.1.0-dev
          ports: [{name: http, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quoin
  labels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: quoin}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: quoin}
  template:
    metadata:
      labels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: quoin}
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: quoin
          image: quoin/quoin:v0.1.0-dev
          args: [serve, --config, /etc/quoin/component.yaml]
          ports: [{name: public, containerPort: 8080}, {name: runtime, containerPort: 8443}, {name: ops, containerPort: 9090}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe: {httpGet: {path: /livez, port: ops}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {httpGet: {path: /readyz, port: ops}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /livez, port: ops}, periodSeconds: 10}
          volumeMounts:
            - {name: config, mountPath: /etc/quoin/component.yaml, subPath: component.yaml, readOnly: true}
            - {name: data, mountPath: /var/lib/quoin/data}
            - {name: backups, mountPath: /var/lib/quoin/backups}
            - {name: secrets, mountPath: /run/quoin-secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: quoin-config}}
        - {name: data, persistentVolumeClaim: {claimName: quoin-data}}
        - {name: backups, persistentVolumeClaim: {claimName: quoin-backups}}
        - {name: secrets, secret: {secretName: quoin-secrets}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plinth
  labels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: plinth}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: plinth}
  template:
    metadata:
      labels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: plinth}
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: plinth
          image: quoin/plinth:v0.1.0-dev
          args: [--config, /etc/quoin/component.yaml]
          ports: [{name: ops, containerPort: 9090}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe: {httpGet: {path: /livez, port: ops}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {httpGet: {path: /readyz, port: ops}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /livez, port: ops}, periodSeconds: 10}
          volumeMounts:
            - {name: config, mountPath: /etc/quoin/component.yaml, subPath: component.yaml, readOnly: true}
            - {name: state, mountPath: /var/lib/plinth}
            - {name: runtime-ca, mountPath: /run/quoin-secrets/runtime-ca.pem, subPath: runtime-ca.pem, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: plinth-config}}
        - {name: state, persistentVolumeClaim: {claimName: plinth-state}}
        - {name: runtime-ca, secret: {secretName: quoin-secrets, items: [{key: runtime-ca.pem, path: runtime-ca.pem}]}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lintel
  labels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: lintel}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: lintel}
  template:
    metadata:
      labels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: lintel}
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: lintel
          image: quoin/lintel:v0.1.0-dev
          args: [--config, /etc/quoin/component.yaml]
          ports: [{name: ops, containerPort: 9090}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe: {httpGet: {path: /livez, port: ops}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {httpGet: {path: /readyz, port: ops}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /livez, port: ops}, periodSeconds: 10}
          volumeMounts:
            - {name: config, mountPath: /etc/quoin/component.yaml, subPath: component.yaml, readOnly: true}
            - {name: state, mountPath: /var/lib/lintel}
            - {name: runtime-ca, mountPath: /run/quoin-secrets/runtime-ca.pem, subPath: runtime-ca.pem, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - {name: config, configMap: {name: lintel-config}}
        - {name: state, persistentVolumeClaim: {claimName: lintel-state}}
        - {name: runtime-ca, secret: {secretName: quoin-secrets, items: [{key: runtime-ca.pem, path: runtime-ca.pem}]}}
        - {name: tmp, emptyDir: {}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stele
  labels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: stele}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: stele}
  template:
    metadata:
      labels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: stele}
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: stele
          image: quoin/stele:v0.1.0-dev
          args: [--config, /etc/quoin/component.yaml]
          ports: [{name: webhook, containerPort: 8080}, {name: ops, containerPort: 9090}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe: {httpGet: {path: /livez, port: ops}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {httpGet: {path: /readyz, port: ops}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /livez, port: ops}, periodSeconds: 10}
          volumeMounts:
            - {name: config, mountPath: /etc/quoin/component.yaml, subPath: component.yaml, readOnly: true}
            - {name: runtime-ca, mountPath: /run/quoin-secrets/runtime-ca.pem, subPath: runtime-ca.pem, readOnly: true}
            - {name: stele-token, mountPath: /run/quoin-secrets/stele-service-token, subPath: stele-service-token, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: stele-config}}
        - {name: runtime-ca, secret: {secretName: quoin-secrets, items: [{key: runtime-ca.pem, path: runtime-ca.pem}]}}
        - {name: stele-token, secret: {secretName: quoin-secrets, items: [{key: stele-service-token, path: stele-service-token}]}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: gateway}
  ports: [{name: https, port: 443, targetPort: https}]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: frontend}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# This fixed service alias matches the SAN issued for internal Runtime TLS.
apiVersion: v1
kind: Service
metadata:
  name: quoin
spec:
  selector: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: quoin}
  ports:
    - {name: public, port: 8080, targetPort: public}
    - {name: runtime, port: 8443, targetPort: runtime}
---
apiVersion: v1
kind: Service
metadata:
  name: stele
spec:
  selector: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: stele}
  ports: [{name: webhook, port: 8080, targetPort: webhook}]
