# One-off first-install resources. Apply after quoin.yaml has created the
# ConfigMaps and PVCs, then wait for quoin-bootstrap to complete. This document
# deliberately contains no generated credentials and has no namespace field.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quoin-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: quoin-bootstrap
rules:
  # Bootstrap replaces the data of this pre-created, fixed-name Secret only.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [quoin-secrets]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quoin-bootstrap
subjects:
  - kind: ServiceAccount
    name: quoin-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: quoin-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: quoin-bootstrap
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: quoin-bootstrap
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      # The product container itself remains non-root. The bounded init step
      # gives the generated secret directory the ownership and mode that the
      # existing bootstrap command validates before it writes credentials.
      initContainers:
        - name: prepare-secret-directory
          image: busybox:1.37
          command: [sh, -c, "chown 65532:65532 /run/quoin-secrets && chmod 0700 /run/quoin-secrets"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [CHOWN, FOWNER]}
          volumeMounts:
            - {name: generated-secrets, mountPath: /run/quoin-secrets}
      containers:
        - name: quoin-bootstrap
          image: quoin/quoin:v0.1.0-dev
          args: [secrets, bootstrap, --config, /etc/quoin/component.yaml, --kubernetes-secret, quoin-secrets]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/quoin/component.yaml, subPath: component.yaml, readOnly: true}
            - {name: data, mountPath: /var/lib/quoin/data}
            - {name: backups, mountPath: /var/lib/quoin/backups}
            - {name: generated-secrets, mountPath: /run/quoin-secrets}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: quoin-config}}
        - {name: data, persistentVolumeClaim: {claimName: quoin-data}}
        - {name: backups, persistentVolumeClaim: {claimName: quoin-backups}}
        - {name: generated-secrets, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
