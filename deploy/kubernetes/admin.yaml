# One-off first administrator Pod. Apply only after quoin-bootstrap succeeded,
# then attach a terminal and enter its prompts. It reuses the retained Quoin PVCs
# and the generated Secret; it must never be automated through command arguments.
apiVersion: v1
kind: Pod
metadata:
  name: quoin-admin
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: quoin-admin
      image: quoin/quoin:v0.1.0-dev
      command: [/quoin, admin, create, --config, /etc/quoin/component.yaml]
      stdin: true
      tty: true
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: config, mountPath: /etc/quoin/component.yaml, subPath: component.yaml, readOnly: true}
        - {name: data, mountPath: /var/lib/quoin/data}
        - {name: backups, mountPath: /var/lib/quoin/backups}
        - {name: secrets, mountPath: /run/quoin-secrets, readOnly: true}
        - {name: tmp, mountPath: /tmp}
  volumes:
    - {name: config, configMap: {name: quoin-config}}
    - {name: data, persistentVolumeClaim: {claimName: quoin-data}}
    - {name: backups, persistentVolumeClaim: {claimName: quoin-backups}}
    - {name: secrets, secret: {secretName: quoin-secrets}}
    - {name: tmp, emptyDir: {}}
