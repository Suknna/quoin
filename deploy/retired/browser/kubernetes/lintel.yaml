# Optional Lintel browser runtime overlay. The default quoin.yaml stack is
# browser-free and never depends on, probes, or provisions Lintel resources;
# apply this file in the same namespace only when browser automation
# (Playwright Chromium, noVNC, Journey, Exploration) is explicitly wanted.
# Quoin keeps its fixed Lintel Runtime slot `unregistered` until this
# deployment registers through the Admin UI. Explicit enablement is therefore
# exactly two declarative steps, never part of the default manifest:
#   1. add `browser` to `enabledPlugins` in the quoin-config ConfigMap from
#      quoin.yaml (so Quoin accepts the browser plugin's runtime), then
#   2. apply this overlay for the Lintel runtime itself.
# This overlay deliberately ships no quoin-config, quoin Deployment or any
# other Quoin-owned object: quoin.yaml stays the single authority for them.
# Removing the browser again requires the approved offline recovery/retirement
# flow, never a bare `kubectl delete`. Create the `quoin-secrets` Secret
# (runtime-ca.pem at minimum) before applying; see docs/deployment.md.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lintel-config
data:
  component.yaml: |
    component: lintel
    stateDirectory: /var/lib/lintel
    quoinRuntimeEndpoint: https://quoin:8443
    quoinRuntimeCaFile: /run/quoin-secrets/runtime-ca.pem
    browserSlots: 1
    minimumShmBytes: 1073741824
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lintel-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lintel
  labels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: lintel}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: lintel}
  template:
    metadata:
      labels: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: lintel}
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: lintel
          image: quoin/lintel:v0.1.0-dev
          args: [--config, /etc/quoin/component.yaml]
          ports: [{name: ops, containerPort: 9090}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe: {httpGet: {path: /livez, port: ops}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {httpGet: {path: /readyz, port: ops}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /livez, port: ops}, periodSeconds: 10}
          volumeMounts:
            - {name: config, mountPath: /etc/quoin/component.yaml, subPath: component.yaml, readOnly: true}
            - {name: state, mountPath: /var/lib/lintel}
            - {name: runtime-ca, mountPath: /run/quoin-secrets/runtime-ca.pem, subPath: runtime-ca.pem, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - {name: config, configMap: {name: lintel-config}}
        - {name: state, persistentVolumeClaim: {claimName: lintel-state}}
        - {name: runtime-ca, secret: {secretName: quoin-secrets, items: [{key: runtime-ca.pem, path: runtime-ca.pem}]}}
        - {name: tmp, emptyDir: {}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 1Gi}}
---
# Internal-only operational listener for in-cluster verification and
# monitoring of the optional browser runtime. Never routed by gateway and
# deliberately without public exposure.
apiVersion: v1
kind: Service
metadata: {name: lintel-ops}
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: quoin, app.kubernetes.io/component: lintel}
  ports: [{name: ops, port: 9090, targetPort: ops}]
