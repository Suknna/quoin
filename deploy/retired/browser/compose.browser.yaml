# Explicit browser enablement for the local topology. Use it together with
# the base file and the browser profile — the default stack never reads this
# file, never mounts the browser-enabled config, and never starts Lintel:
#
#   docker compose --project-directory deploy \
#     -f deploy/compose.yaml -f deploy/compose.browser.yaml \
#     --profile browser up
#
# Quoin receives the browser-enabled component config (browser added to
# enabledPlugins) so it accepts the Lintel runtime registration; the Lintel
# Deployment itself lives in the `browser` profile of the base file. Keep
# config/quoin.yaml and config/quoin-browser.yaml in sync — they differ only
# in enabledPlugins.
services:
  quoin:
    volumes:
      # Same container target as the base mount, so the override replaces it.
      - ./config/quoin-browser.yaml:/etc/quoin/component.yaml:ro
  lintel:
    # Carried over from the base file; repeated here so this override alone
    # documents the complete opt-in intent.
    profiles: ["browser"]
