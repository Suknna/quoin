  entry: web/src/main.tsx
  app: web/src/app
  components: web/src/components/ui
  hooks: web/src/hooks
  lib: web/src/lib
  styles: web/src/styles
  public: web/public
  feature_ui: web/src/features/<domain>/ui
  generated_api: web/src/api/generated
