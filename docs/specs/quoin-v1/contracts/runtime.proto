// Quoin v1 四组件 gRPC 协议机器契约（唯一机器权威，SPEC-VERSION-002：package quoin.runtime.v1）。
// 职责划分（SPEC-AUTHORITY-002）：本文件只承载 service、RPC、message、stream 与 wire-level
// 枚举；握手顺序、身份裁决、lease/fencing、调和、跨流事务、提交顺序裁决、凭据 grant 生命周期
// 与故障语义由 docs/specs/quoin-v1/runtime-protocol.md（CATEGORY=RUNTIME）承载，不在本文件重复。
//
// 字段编号策略（RUNTIME-VERSION-002）：字段编号一经分配永不复用；删除字段必须使用 reserved
// 声明并保留编号；oneof 成员与普通字段共享所在 message 的编号空间。流式服务中的消息方向
// 由 message 类型名与 runtime-protocol.md 的收发方表格表达，不通过字段命名表达。
//
// 身份：内部组件（Plinth/Stele）主动出站拨号 Quoin；所有内部 gRPC 连接使用部署 CA
// （runtime-ca）签发的客户端与服务端证书做 mTLS 双向认证（ADR-0009、CONTEXT「服务身份」）。
// TLS 握手同时验证服务端与客户端身份，不存在注册、一次性注册令牌或长期 Bearer：客户端
// 身份取自已验证链叶证书 CN（plinth/stele），Quoin 按 CN 授权服务——RuntimeControl 与
// ArtifactService 仅接受 CN=plinth，SteleRelay 仅接受 CN=stele。客户端证书由部署密钥
// bootstrap 签发、经部署 Secret 挂载，不进入任何消息体、日志或数据库。
//
// 内容 digest（AttemptInputSnapshot.content_digest / ResultPayload.content_digest 等）是原始
// 32 字节二进制 SHA-256，用 bytes 承载。

syntax = "proto3";

package quoin.runtime.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Suknna/quoin/internal/gen/proto/runtime/v1;runtimev1";

// ============================================================================
// 服务
// ============================================================================

// Runtime 控制面：长期双向控制流（Connect）与任务级连接凭据 grant 获取（unary，
// supervisor-only）。Connect 是 Runtime 侧出站发起的 bidi stream；客户端证书已在 mTLS
// 握手中认证（CN=plinth），首帧必须是 Hello。
service RuntimeControl {
  // 长期控制流：双向 ControlEnvelope，承载任务派发/接受/进度/结果/取消与调和
  // （RUNTIME-CTRL-001/009）。同 slot 同时至多一条活动控制流。
  rpc Connect(stream ControlEnvelope) returns (stream ControlEnvelope);

  // 任务级连接凭据 grant 获取（supervisor-only，RUNTIME-GRANT-001..003）：返回 Attempt 派发
  // 绑定的 revision/generation 的非秘密配置投影与解密后的类型化秘密；仅 Attempt Running 期间
  // 可用，终态即清除。ADR-0011 后只服务 model_provider grant；外部平台凭据由 Stele 经
  // SteleRelay.AcquireConnectionCredential 按需获取。worker 进程不得调用本 RPC。
  rpc FetchCredentialGrant(FetchCredentialGrantRequest) returns (FetchCredentialGrantResponse);
}

// Artifact 上传：独立 client-streaming；首帧必须是 header；整单重传，无 offset 续传
// （RUNTIME-UPLOAD-001/002）。upload_id 在重试生命周期内稳定，同摘要重试幂等。
service ArtifactService {
  rpc Upload(stream ArtifactUploadFrame) returns (ArtifactUploadResult);

  // supervisor-only、Attempt-scoped 的文本分段读取与 RE2 搜索。只允许读取 Quoin 已授权给
  // 当前 Attempt 且正文尚在的 Artifact；worker 不直接持有 Runtime Bearer（RUNTIME-ARTIFACT-001..004）。
  rpc ReadText(ArtifactReadTextRequest) returns (ArtifactReadTextResponse);
  rpc GrepText(ArtifactGrepTextRequest) returns (ArtifactGrepTextResponse);
}

// Stele 外部网关服务（ADR-0011）：Stele 以部署 CA 签发的客户端证书（CN=stele）经
// mTLS 认证（ADR-0009），是所有外部平台交互的唯一出入口——入向接收平台推送并归一化
// 入本地队列（入队即 ACK，可靠性由队列重试 + 死信承担），出向按 Quoin 派发注入凭证、
// 限流并执行平台调用。每个请求必须携带完整 Proto 权威契约的 SHA-256 指纹；发布版本
// 只用于展示与溯源，绝不作为通信准入条件。单 Stele 实例假设。
service SteleRelay {
  // 长期网关双向流（拓扑同 RuntimeControl.Connect）：Quoin 经该流向 Stele 下发
  // 出向平台执行请求，Stele 回传执行结果；心跳维护活性投影。
  rpc Connect(stream SteleEnvelope) returns (stream SteleEnvelope);

  // 版本化只读凭据 digest 快照（入向来源认证）；Stele 仅内存缓存，未成功加载时
  // 拒绝接收入向请求（RUNTIME-STELE-002）。
  rpc GetCredentialSnapshot(GetCredentialSnapshotRequest) returns (GetCredentialSnapshotResponse);

  // 归一化事件批量转交：Stele 本地队列的消费转发；event_id 幂等，逐事件裁决。
  rpc DeliverEvents(DeliverEventsRequest) returns (DeliverEventsResponse);

  // 按需连接材料获取（出向执行）：返回非秘密配置投影与解密后的类型化秘密；Stele
  // 缓存于本地状态，动态凭证生命周期管理归 Stele；Quoin 对外部平台凭据只写不读。
  rpc AcquireConnectionCredential(AcquireConnectionCredentialRequest) returns (AcquireConnectionCredentialResponse);

  // 已删除的 Deliver（同步转交被本地队列 + DeliverEvents 取代，ADR-0011）。
  // proto3 的 service 不支持 reserved 声明，方法名以本注释与 runtime-protocol.md 记录为准。
}

// ============================================================================
// 身份与通用枚举
// ============================================================================

// 唯一逻辑 Runtime slot（CONTEXT「服务身份」）。对应 SQL runtime_slot
// 与 OpenAPI RuntimeSlot 枚举的字符串 'plinth'。
enum RuntimeSlot {
  RUNTIME_SLOT_UNSPECIFIED = 0;
  RUNTIME_SLOT_PLINTH = 1;
  reserved 2; // 已删除的 RUNTIME_SLOT_LINTEL（浏览器运行时整体移除）
}

// execution_attempts.attempt_type 的 wire 表达（DATA-ATTEMPT-002）。
enum AttemptType {
  ATTEMPT_TYPE_UNSPECIFIED = 0;
  ATTEMPT_TYPE_INITIAL_ANALYSIS = 1;
  ATTEMPT_TYPE_INVESTIGATION = 2;
  ATTEMPT_TYPE_INSPECTION_ANALYSIS = 3;
  ATTEMPT_TYPE_INSPECTION_COLLECTION = 4;
  reserved 5; // 已删除的 ATTEMPT_TYPE_BROWSER_EXPLORATION
  ATTEMPT_TYPE_KNOWLEDGE_EXTRACTION = 6;
  ATTEMPT_TYPE_EMBEDDING = 7;
  ATTEMPT_TYPE_CONNECTION_PROBE = 8;
}

// execution_attempts.scope_type 的 wire 表达（DATA-ATTEMPT-002）。
// 编号 5（Config Verification Run）与 9（Resource Refresh Run）已随验证/刷新
// 引擎退役；按 RUNTIME-VERSION-002 保留编号与名称 reserved，永不复用。
enum ScopeType {
  reserved 5, 9;
  reserved "SCOPE_TYPE_CONFIG_VERIFICATION_RUN", "SCOPE_TYPE_RESOURCE_REFRESH_RUN";
  SCOPE_TYPE_UNSPECIFIED = 0;
  SCOPE_TYPE_ANALYSIS = 1;
  SCOPE_TYPE_INVESTIGATION = 2;
  SCOPE_TYPE_RUN = 3;
  SCOPE_TYPE_RUN_CHECK = 4;
  SCOPE_TYPE_KNOWLEDGE_IMPORT_BATCH = 6;
  SCOPE_TYPE_EMBEDDING_GENERATION = 7;
  SCOPE_TYPE_CONNECTION = 8;
  SCOPE_TYPE_OBSERVATION_RUN = 10; // 来源级观测子 Attempt（ADR-0004 接入即有界观测）
}

// execution_attempts.termination_reason 的 wire 表达（DATA-ATTEMPT-005）。
enum TerminationReason {
  TERMINATION_REASON_UNSPECIFIED = 0;
  TERMINATION_REASON_TIMEOUT = 1;
  TERMINATION_REASON_RATE_LIMITED = 2;
  TERMINATION_REASON_PROVIDER_UNAVAILABLE = 3;
  TERMINATION_REASON_INVALID_RESPONSE = 4;
  TERMINATION_REASON_TOOL_ERROR = 5;
  TERMINATION_REASON_ARTIFACT_COMMIT_FAILED = 6;
  TERMINATION_REASON_CANCELLED = 7;
  TERMINATION_REASON_CONNECTION_DISABLED = 8;
  TERMINATION_REASON_BUSINESS_SYSTEM_DISABLED = 9;
  TERMINATION_REASON_LEASE_EXPIRED = 10;
  TERMINATION_REASON_REPLACED = 11;
  TERMINATION_REASON_REVOKED = 12;
  TERMINATION_REASON_CONTEXT_TOO_LARGE = 13;
  TERMINATION_REASON_ARTIFACT_BODY_EXPIRED = 14;
  TERMINATION_REASON_SANDBOX_UNAVAILABLE = 15;
  TERMINATION_REASON_WORKER_PROTOCOL_ERROR = 16;
}

// ResultProposal 的结果分类（RUNTIME-TASK-008）。
enum AttemptOutcome {
  ATTEMPT_OUTCOME_UNSPECIFIED = 0;
  ATTEMPT_OUTCOME_SUCCEEDED = 1;
  ATTEMPT_OUTCOME_FAILED = 2;
}

// Hello 拒绝原因（RUNTIME-CTRL-002/003/010）；detail 在 runtime-protocol.md 定义。
// 凭据类拒绝已随注册制退役（ADR-0009）：mTLS 握手失败的连接到达不了 Hello。
enum HelloRejectReason {
  HELLO_REJECT_REASON_UNSPECIFIED = 0;
  reserved 1, 2; // 已删除的 TOKEN_INVALID/SLOT_REVOKED（注册制随 ADR-0009 退役）
  HELLO_REJECT_REASON_CONTRACT_MISMATCH = 3;
  HELLO_REJECT_REASON_EPOCH_STALE = 4;
  reserved 5; // 已删除的 CATALOG_MISMATCH（Journey Catalog 随浏览器运行时移除）
}

// Runtime 拒绝接受派发的原因（RUNTIME-TASK-004）。
enum AttemptRejectReason {
  ATTEMPT_REJECT_REASON_UNSPECIFIED = 0;
  ATTEMPT_REJECT_REASON_NO_CAPACITY = 1;        // 暂无可执行容量；Attempt 保持 Assigned，可幂等重派
  ATTEMPT_REJECT_REASON_INPUT_UNSUPPORTED = 2;  // 输入/快照不受支持；Attempt 转 Failed
  ATTEMPT_REJECT_REASON_INTERNAL = 3;           // Runtime 内部错误；Attempt 转 Failed
}

// Runtime 可上传的 artifacts.kind 封闭子集（DATA-ARTIFACT-003/006）；verification_bundle 与 verification_attachment 由 Quoin/Deployment Helper 本地耐久路径创建，不经过 Runtime ArtifactService。
enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_ATTACHMENT = 1;
  reserved 2, 3; // 已删除的 SCREENSHOT/TRACE（浏览器运行时移除）
  ARTIFACT_KIND_TOOL_RESULT = 4;
  ARTIFACT_KIND_REPORT_FILE = 5;
}

// artifacts.retention_kind 的 wire 表达（DATA-ARTIFACT-003）。
enum RetentionKind {
  RETENTION_KIND_UNSPECIFIED = 0;
  RETENTION_KIND_LONG_TERM = 1;
  RETENTION_KIND_GENERATED = 2;
}

// runtime_artifact_uploads rejected 原因（RUNTIME-UPLOAD-004/005）。
enum UploadRejectReason {
  UPLOAD_REJECT_REASON_UNSPECIFIED = 0;
  UPLOAD_REJECT_REASON_SHA256_MISMATCH = 1;
  UPLOAD_REJECT_REASON_SIZE_MISMATCH = 2;
  UPLOAD_REJECT_REASON_ATTEMPT_NOT_RUNNING = 3; // Attempt 非 Running（未派发/终态/替换后 ABA）
  UPLOAD_REJECT_REASON_BOOT_MISMATCH = 4;
  UPLOAD_REJECT_REASON_EPOCH_MISMATCH = 5;
  UPLOAD_REJECT_REASON_METADATA_MISMATCH = 6;   // kind/retention/sensitive/owner 与 artifacts 不符
  reserved 7;
  UPLOAD_REJECT_REASON_INTERNAL = 8;
}

// Quoin 主动结束控制流的原因（RUNTIME-CTRL-007）。
enum GoAwayReason {
  GO_AWAY_REASON_UNSPECIFIED = 0;
  GO_AWAY_REASON_SHUTTING_DOWN = 1;    // Quoin 有序停机（服务端不可用，可重试）
  GO_AWAY_REASON_CONTRACT_MISMATCH = 2; // 契约不匹配（不应发生：握手已拒绝）
  reserved 3, 4, 5; // 已删除的 REVOKED/ROTATED/REPLACED（token/slot 生命周期随 ADR-0009 退役）
}

// ============================================================================
// 控制流（RuntimeControl.Connect）
// ============================================================================

// 双向控制信封：所有消息（含 Hello）都携带 envelope 字段；领域载荷在 msg oneof。
// 收发方归属、顺序与验证规则由 runtime-protocol.md 定义（RUNTIME-CTRL-001/009）：
// message_id 当前连接内单调唯一（去重）；connection_epoch/boot_id 除 Hello 外必须等于
// 接收流上下文；correlation_id 关联请求-响应对（0 = 无）。
message ControlEnvelope {
  uint64 message_id = 1;         // 当前连接（slot+boot+epoch）内、按方向单调递增且唯一（RUNTIME-CTRL-009）
  uint64 connection_epoch = 2;   // 除 Hello 外必须等于接收流上下文的 epoch；不一致丢弃/仅审计
  uint64 correlation_id = 3;     // 请求-响应对关联（RUNTIME-CTRL-009）；0 = 无
  string boot_id = 4;            // 除 Hello 外必须等于接收流上下文的 boot_id；不一致丢弃/仅审计
  reserved 23, 24;               // 已删除的 issue_token/token_persisted（长期 token 轮换随 ADR-0009 退役）
  oneof msg {
    // --- 握手（RUNTIME-CTRL-002/003）---
    Hello hello = 10;              // Runtime -> Quoin；首帧必须为 hello
    HelloAck hello_ack = 11;       // Quoin -> Runtime；握手裁决

    // --- 活性与容量（RUNTIME-CTRL-005）---
    Heartbeat heartbeat = 12;      // 双向；只更新瞬时投影，不落库

    // --- 任务派发与调和（RUNTIME-TASK-001..007）---
    DispatchAttempt dispatch_attempt = 13;   // Quoin -> Runtime；Assigned -> Accept/Reject
    AttemptAccept attempt_accept = 14;       // Runtime -> Quoin；accepted_at + Running
    AttemptReject attempt_reject = 15;       // Runtime -> Quoin；保持 Assigned 或转 Failed
    AttemptProgress attempt_progress = 16;   // Runtime -> Quoin；显示性阶段，非权威
    ReconcileRequest reconcile_request = 17; // Quoin -> Runtime；重连调和
    ReconcileReport reconcile_report = 18;   // Runtime -> Quoin；实际运行集合

    // --- 结果与取消（RUNTIME-TASK-008/012 / RUNTIME-CANCEL-001..003）---
    ResultProposal result_proposal = 19;     // Runtime -> Quoin；按提交顺序裁决
    ResultAck result_ack = 20;               // Quoin -> Runtime；裁决结果
    CancelAttempt cancel_attempt = 21;       // Quoin -> Runtime；fence 已提交后发出
    CancelAck cancel_ack = 22;               // Runtime -> Quoin；已停止

    // --- 连接终结（RUNTIME-CTRL-007 / RUNTIME-REVOKE-001）---
    GoAway go_away = 28;                     // Quoin -> Runtime；尽力而为的通知，关闭是权威

    // --- Plinth 模型/工具循环（RUNTIME-AGENT-001..010）---
    BeginModelCall begin_model_call = 29;             // Plinth -> Quoin；provider 请求前先落物理调用
    BeginModelCallAck begin_model_call_ack = 30;      // Quoin -> Plinth；返回 model_call_id 与模型 grant
    ModelTokenDelta model_token_delta = 31;           // Plinth -> Quoin；瞬时 UI token delta，不入权威历史
    CompleteModelCall complete_model_call = 32;       // Plinth -> Quoin；封存响应/usage，并提议 Tool Calls
    CompleteModelCallAck complete_model_call_ack = 33; // Quoin -> Plinth；返回持久 tool_call_id/grant
    BeginToolCall begin_tool_call = 34;               // Plinth -> Quoin；副作用执行前 pending -> running
    BeginToolCallAck begin_tool_call_ack = 35;        // Quoin -> Plinth；fence 与授权裁决
    CompleteToolCall complete_tool_call = 36;         // Plinth -> Quoin；提交 Tool 结果/Evidence/Artifact 引用
    CompleteToolCallAck complete_tool_call_ack = 37;  // Quoin -> Plinth；提交裁决
    ExternalToolResult external_tool_result = 56;     // Quoin -> Plinth；QUOIN_ROUTED 工具经 Stele 执行后的封存结果（ADR-0011）

  }
  // 已删除的跨 Runtime 浏览器子执行（25/26/27/38）与 Lintel Browser Operation 调和（39..55）
  reserved 25 to 27, 38, 39 to 55;
}

// 握手首帧：客户端证书已在 mTLS 握手中认证；本帧声明 slot/连接身份与完整 Proto
// 权威契约指纹。
message Hello {
  RuntimeSlot slot = 1;
  string boot_id = 2;              // 每次进程启动重新生成
  uint64 connection_epoch = 3;     // 每次连接递增，>= 1（RUNTIME-CTRL-004）
  string contract_fingerprint = 4; // 完整权威集合 SHA-256，小写 hex
  repeated int64 active_attempts = 5;
  reserved 6, 7, 8, 9, 10; // 已删除的 Journey Catalog/浏览器容量/Chromium 字段（浏览器运行时移除）
  // Informational build provenance only. It does not participate in admission.
  string release_version = 11; // 上次连接仍在执行的 attempt（调和输入，可空）
}

// 握手裁决：accepted=true 后连接成为该 slot 当前活动控制流；
// accepted=false 携带拒绝原因（RUNTIME-CTRL-002/003）。
message HelloAck {
  bool accepted = 1;
  HelloRejectReason reject_reason = 2;
  uint64 last_connection_epoch = 3; // accepted 时携带该 slot 当前 boot 最近一次连接 epoch（调和参考）
  reserved 4; // 已删除的 profile_reconcile_required（浏览器运行时移除）
}

// 心跳：更新瞬时连接投影（connected/lastSeenAt），纯内存不落库
// （DATA-RUNTIME-001）；周期为同一 Release 的内部常量，不在协议冻结数值（RUNTIME-SCOPE-004、RUNTIME-CTRL-005）。
message Heartbeat {
  uint64 seq = 1;                  // 当前连接内单调递增
  repeated int64 active_attempts = 2; // Runtime 当前正在执行的 attempt（调和输入）
  Capacity capacity = 3;           // 剩余容量上报（部署内部）
  reserved 4; // 已删除的 active_browser_operations（浏览器运行时移除）
}

// 容量投影（部署内部）：只用于派发决策提示，不是权威事实（RUNTIME-CTRL-005）。
message Capacity {
  uint32 running = 1;
  uint32 max = 2;                  // 当前 boot 固定容量；来自 Release 常量
}

// 派发：Quoin 先持久化 Attempt（Assigned，带 slot/boot/epoch/lease）后发送本消息
// （RUNTIME-TASK-001/002）。重复投递按 attempt_id + boot/epoch 幂等。
// 任务执行输入由 input（AttemptInputSnapshot）完整携带；连接秘密不在本消息，
// 经 FetchCredentialGrant 由 supervisor 按 grant_id 获取（RUNTIME-GRANT-001）。
// operation_correlation_id 是跨进程/重启的业务操作关联标识（ADR-0006）：协议只承载
// 关联身份，权威归属（含原始发起者）由 Quoin 在派发事务内独立持久化；它与
// ControlEnvelope.correlation_id（流内请求-响应配对编号，uint64）语义不同且互不替代，
// 也不是权限凭据、不替代 attempt_id；无关联时为空。
message DispatchAttempt {
  int64 attempt_id = 1;            // execution_attempts.id
  AttemptType attempt_type = 2;
  ScopeType scope_type = 3;
  int64 scope_id = 4;
  string check_key = 5;            // run_check 子 Attempt 时非空；否则空
  google.protobuf.Timestamp lease_deadline = 6; // 有限 lease 截止；时长数值为部署配置
  AttemptInputSnapshot input = 7;  // 冻结的非秘密任务执行输入（RUNTIME-TASK-011）
  reserved 8; // 已删除的 requested_by_tool_call_id（跨 Runtime 子执行随浏览器运行时移除）
  reserved 9; // 已删除的 plan_key（config verification 引擎退役，2026-09）
  reserved "plan_key";
  string discovery_key = 10;       // observation_run 子 Attempt 必填；其它 scope 为空（DATA-OBSERVED-004）
  string operation_correlation_id = 11; // 业务操作关联标识（ADR-0006）；不透明文本，无关联为空
}

// 任务执行输入快照：Quoin 在派发事务中冻结的规范结构化输入（非秘密），对端按
// schema_kind 解析 canonical_json 重建执行上下文；content_digest 必须等于
// SHA-256(canonical_json)。artifact_refs 是只读 Artifact 引用；connection_grants
// 是非秘密 grant 引用，秘密由 supervisor 经 FetchCredentialGrant 获取（RUNTIME-TASK-011、
// RUNTIME-GRANT-001/002）。
message AttemptInputSnapshot {
  string schema_kind = 1;          // 输入 schema 标识（如 "investigation_v1"）；非空
  bytes canonical_json = 2;        // 非秘密规范结构化输入（冻结）
  bytes content_digest = 3;        // SHA-256(canonical_json)（32 字节）
  repeated ArtifactRef artifact_refs = 4;     // 输入引用的只读 Artifact（可空）
  repeated ConnectionGrant connection_grants = 5; // 派发前已知 grant；动态 Tool grant 由 CompleteModelCallAck 返回
  reserved 6;
  string agent_version = 7;        // 与 execution_attempts.agent_version 严格一致；Plinth 必须已有该不可变内置版本
}

// 输入引用的 Artifact（只读；正文访问按 DATA-ARTIFACT-003 裁决）。
message ArtifactRef {
  int64 artifact_id = 1;           // artifacts.id
  string role = 2;                 // 输入中的角色（如 attachment、source、tool_result）
  string media_type = 3;
  uint64 size_bytes = 4;
  bytes sha256 = 5;
  bool body_expired = 6;
}

// 任务级连接凭据 grant 引用（非秘密；RUNTIME-GRANT-001）。grant 可在 Attempt 派发时
// （模型供应商）或 Quoin 接受具体 Tool Call 时（Thanos）创建；绑定当时实际的
// connection revision/credential generation，并在 Attempt 终态后不可再获取（DATA-CONN-002）。
message ConnectionGrant {
  int64 grant_id = 1;              // attempt_connection_grants.id（不可变、Attempt-scoped）
  int64 connection_revision_id = 2; // connections.current_revision_id 绑定
  int64 credential_generation_id = 3; // credential_generations.id 绑定
  string purpose = 4;              // chat_model|embedding|thanos_query|model_probe_chat|model_probe_embedding|prometheus_probe|thanos_probe
  int64 connection_probe_result_id = 5; // model_provider 必须绑定通过的不可变 qualification；其它类型为 0
}

// 接受：Quoin 写 accepted_at 并转 Running（RUNTIME-TASK-004）。
message AttemptAccept {
  int64 attempt_id = 1;
}

// 拒绝：NO_CAPACITY 保持 Assigned 可幂等重派；INPUT_UNSUPPORTED/INTERNAL 转 Failed
// （RUNTIME-TASK-004）。
message AttemptReject {
  int64 attempt_id = 1;
  AttemptRejectReason reason = 2;
}

// 显示性进度：权威进度由 tool_calls/evidence 持久记录承担，本消息不入权威历史
// （RUNTIME-TASK-010）。
message AttemptProgress {
  int64 attempt_id = 1;
  string stage = 2;                // 显示性阶段名；不得成为任何领域状态权威
  int64 tool_call_id = 3;          // 相关 tool_call（可 0）
}

// 调和请求：重连后 Quoin 列出该 slot 当前 active（Assigned/Running/Cancelling）
// 的 attempt；同 boot 不重派（RUNTIME-TASK-005）。
message ReconcileRequest {
  repeated int64 active_attempt_ids = 1;
}

// 调和报告：Runtime 实际正在执行的 attempt（RUNTIME-TASK-005）。
message ReconcileReport {
  repeated int64 running_attempt_ids = 1;
}

// 结果提议：Runtime 结束运行并提议结果；Quoin 按 attempt_id + boot + epoch 幂等并
// 按 SQLite 提交顺序与 cancellation fence 裁决（RUNTIME-TASK-008 / RUNTIME-CANCEL-002）。
// outcome=SUCCEEDED 时 payload 必填（RUNTIME-TASK-012）；outcome=FAILED 时
// termination_reason 必填。
message ResultProposal {
  int64 attempt_id = 1;
  string boot_id = 2;
  uint64 connection_epoch = 3;
  AttemptOutcome outcome = 4;
  TerminationReason termination_reason = 5; // outcome=FAILED 时必填
  reserved 6;
  reserved "artifact_ids";               // 最终引用只由 ResultPayload 显式承载
  ResultPayload payload = 7;                // 规范结构化输出；SUCCEEDED 必填（RUNTIME-TASK-012）
}

// 结果载荷：与 attempt_type 对应的规范结构化输出（assistant message / report content /
// analysis output 等），由 Quoin 校验 schema_kind 与 content_digest 后
// 原子持久化到对应领域记录（RUNTIME-TASK-012）。不依赖未定义实现层的补通道。
message ResultPayload {
  string schema_kind = 1;          // 输出 schema 标识（如 "assistant_message_v1"、"inspection_report_v1"）；非空
  bytes canonical_json = 2;        // 非秘密规范结构化输出
  bytes content_digest = 3;        // SHA-256(canonical_json)（32 字节）
  repeated int64 evidence_ids = 4; // 已存在且本 Attempt 获授权的引用；Evidence 由 canonical_json proposals 经 Quoin 事务创建
  repeated int64 artifact_ids = 5;
  repeated int64 knowledge_version_ids = 6;
}

// 结果裁决：accepted=true 表示 Quoin 已提交该结果；false 表示迟到（旧 epoch/已取消/
// lease 已到期），Runtime 只审计（RUNTIME-CANCEL-002/003）。
message ResultAck {
  int64 attempt_id = 1;
  bool accepted = 2;
  string detail = 3;               // 面向 Runtime 日志的非权威说明
}

// 取消：Quoin 先事务提交 cancellation fence（Cancelling）再发送本消息
// （RUNTIME-CANCEL-001）。
message CancelAttempt {
  int64 attempt_id = 1;
}

// 确认已停止；Quoin 转 Cancelled（RUNTIME-CANCEL-003）。
message CancelAck {
  int64 attempt_id = 1;
}

// 连接终结通知：尽力而为；实际关闭由 Quoin 执行，客户端不得依赖本消息送达
// （RUNTIME-REVOKE-001）。
message GoAway {
  GoAwayReason reason = 1;
  string detail = 2;
}

// ============================================================================
// Plinth 模型/工具执行循环
// ============================================================================

// 物理 Model Call 必须先落库再发 provider 请求。call_seq 是 Attempt 内逻辑模型步序；
// provider 传输重试使用相同 call_seq、递增 retry_seq，且前一物理行必须已明确失败。
enum ModelOperation {
  MODEL_OPERATION_UNSPECIFIED = 0;
  MODEL_OPERATION_CHAT = 1;
  MODEL_OPERATION_EMBEDDING = 2;
}

message BeginModelCall {
  int64 attempt_id = 1;
  uint32 call_seq = 2;
  uint32 retry_seq = 3;
  string model_id = 4;
  bytes prompt_digest = 5;       // 固定 agent/system prompt 的 SHA-256
  bytes tool_schema_digest = 6;  // 本次暴露 Tool schema 集合的 SHA-256
  bytes input_digest = 7;        // 按顺序串联 input_items 后的 SHA-256
  repeated ModelInputItem input_items = 8;
  uint32 evicted_turn_count = 9; // 因 context budget 从最旧端淘汰的完整回合数；不生成摘要
  ModelOperation operation = 10;
  uint64 context_budget_tokens = 11; // chat 必填；embedding 为 0
  uint64 max_output_tokens = 12;     // chat 必填；embedding 为 0
  bytes rendered_request_digest = 13; // 实际发送 provider 的规范请求 SHA-256；chat/embedding 均必填
}

enum ModelInputItemKind {
  MODEL_INPUT_ITEM_KIND_UNSPECIFIED = 0;
  MODEL_INPUT_ITEM_KIND_ATTEMPT_INPUT_SNAPSHOT = 1;
  MODEL_INPUT_ITEM_KIND_INVESTIGATION_MESSAGE = 2;
  MODEL_INPUT_ITEM_KIND_PRIOR_MODEL_CALL = 3;
  MODEL_INPUT_ITEM_KIND_TOOL_CALL = 4;
  MODEL_INPUT_ITEM_KIND_EVIDENCE = 5;
  MODEL_INPUT_ITEM_KIND_ARTIFACT = 6;
  MODEL_INPUT_ITEM_KIND_KNOWLEDGE_VERSION = 7;
  MODEL_INPUT_ITEM_KIND_SYSTEM_CONTRACT = 8;
  MODEL_INPUT_ITEM_KIND_TOOL_SCHEMA = 9;
}

enum ModelInputRole {
  MODEL_INPUT_ROLE_UNSPECIFIED = 0;
  MODEL_INPUT_ROLE_SYSTEM = 1;
  MODEL_INPUT_ROLE_USER = 2;
  MODEL_INPUT_ROLE_ASSISTANT = 3;
  MODEL_INPUT_ROLE_TOOL = 4;
}

message ModelInputItem {
  uint32 sequence = 1;
  ModelInputItemKind item_kind = 2;
  int64 item_id = 3;             // system_contract/tool_schema 时必须为 0；其余为对应权威行 ID
  bytes content_digest = 4;      // Quoin 对对应权威记录复算并核对
  ModelInputRole role = 5;       // 精确对应本次 provider Message role；Quoin 与来源类型共同复核
}

message BeginModelCallAck {
  bool accepted = 1;
  int64 attempt_id = 2;
  int64 model_call_id = 3;
  ConnectionGrant model_provider_grant = 4; // accepted 时必填；只供 supervisor FetchCredentialGrant
  string detail = 5;
}

// 流式 token delta 仅用于 Chat UI 的瞬时显示；Quoin 不把 delta 当消息或模型响应权威。
// complete_model_call 的规范响应才可封存，ResultProposal 成功事务才可创建 assistant message。
message ModelTokenDelta {
  int64 attempt_id = 1;
  int64 model_call_id = 2;
  uint64 delta_seq = 3;
  string text = 4;
}

enum ModelCallCompletionRejectReason {
  MODEL_CALL_COMPLETION_REJECT_REASON_UNSPECIFIED = 0;
  MODEL_CALL_COMPLETION_REJECT_REASON_ATTEMPT_TERMINAL = 1;
  MODEL_CALL_COMPLETION_REJECT_REASON_STALE_STREAM = 2;
  MODEL_CALL_COMPLETION_REJECT_REASON_DIGEST_CONFLICT = 3;
  MODEL_CALL_COMPLETION_REJECT_REASON_INVALID_COMPLETION = 4;
}

enum ModelCallOutcome {
  MODEL_CALL_OUTCOME_UNSPECIFIED = 0;
  MODEL_CALL_OUTCOME_SUCCEEDED = 1;
  MODEL_CALL_OUTCOME_FAILED = 2;
  MODEL_CALL_OUTCOME_CANCELLED = 3;
}

enum ModelCallFailureReason {
  MODEL_CALL_FAILURE_REASON_UNSPECIFIED = 0;
  MODEL_CALL_FAILURE_REASON_TIMEOUT = 1;
  MODEL_CALL_FAILURE_REASON_RATE_LIMITED = 2;
  MODEL_CALL_FAILURE_REASON_PROVIDER_UNAVAILABLE = 3;
  MODEL_CALL_FAILURE_REASON_CONTEXT_OVERFLOW = 4;
  MODEL_CALL_FAILURE_REASON_INVALID_RESPONSE = 5;
  MODEL_CALL_FAILURE_REASON_CANCELLED = 6;
  MODEL_CALL_FAILURE_REASON_ARTIFACT_COMMIT_FAILED = 7;
  MODEL_CALL_FAILURE_REASON_TRANSPORT_ERROR = 8; // 请求明确未到达 provider 或由 adapter 证明无不确定副作用；可物理重试
}

message CompleteModelCall {
  int64 attempt_id = 1;
  int64 model_call_id = 2;
  ModelCallOutcome outcome = 3;
  ModelCallFailureReason failure_reason = 4; // FAILED/CANCELLED 时必填
  string provider_request_id = 5;
  uint64 latency_ms = 6;
  uint64 input_tokens = 7;
  uint64 output_tokens = 8;
  uint64 total_tokens = 9;
  string finish_reason = 10;
  string assistant_text = 11;                // success 时可空；隐藏思维链不得提交
  repeated ProposedToolCall tool_calls = 12; // success 时按 provider 输出顺序；无工具则为空
  bytes response_digest = 13;                // 规范化 assistant_text + tool_calls 的 SHA-256
  bool response_complete = 14;               // success 必须 true；失败收到 partial 时 false
  repeated EmbeddingVector embedding_vectors = 15; // embedding success 时必填；chat 时为空
}

message EmbeddingVector {
  uint32 input_index = 1;
  bytes source_digest = 2; // 对应输入正文 digest
  repeated float values = 3;
}

message ProposedToolCall {
  uint32 provider_index = 1;
  string provider_tool_call_id = 2;
  string tool_name = 3;
  bytes arguments_json = 4;       // 规范 JSON；Quoin 按固定 Tool schema 验证
  bytes arguments_digest = 5;     // SHA-256(arguments_json)
}

enum ToolExecutionMode {
  TOOL_EXECUTION_MODE_UNSPECIFIED = 0;
  TOOL_EXECUTION_MODE_WORKER_LOCAL = 1;
  reserved 2; // 已删除的 SUPERVISOR_TYPED（出向工具执行迁移至 Quoin 编排、Stele 执行，ADR-0011）
  reserved 3; // 已删除的 QUOIN_BROWSER（浏览器运行时移除）
  TOOL_EXECUTION_MODE_QUOIN_ROUTED = 4; // Quoin 权限/审计后经 Stele 网关执行（ADR-0011）
}

enum ToolFailureMode {
  TOOL_FAILURE_MODE_UNSPECIFIED = 0;
  TOOL_FAILURE_MODE_RETURN_TO_MODEL = 1;
  TOOL_FAILURE_MODE_FAIL_ATTEMPT = 2;
}

message ToolCallAuthorization {
  int64 tool_call_id = 1;
  uint32 provider_index = 2;
  string provider_tool_call_id = 3;
  ToolFailureMode failure_mode = 4; // 由固定 Tool 定义决定，模型不得覆盖
  repeated ConnectionGrant connection_grants = 5; // 可绑定多个；无外部连接的 Tool 为空
  // Deterministic Business System routing preflight. When non-empty it is
  // mutually exclusive with grants; Plinth closes the existing Tool Call as a
  // return_to_model result and must not fetch a credential or contact a target.
  string preflight_error_code = 6; // target_not_found|target_ambiguous|no_mapping
  string preflight_error_detail = 7; // bounded non-secret user-facing detail
  // Quoin-authorized execution arguments. When present, Plinth must verify this
  // digest and execute these bytes rather than the immutable model proposal.
  bytes execution_arguments_json = 8;
  bytes execution_arguments_digest = 9;
}

message CompleteModelCallAck {
  bool accepted = 1;
  int64 attempt_id = 2;
  int64 model_call_id = 3;
  repeated ToolCallAuthorization tool_calls = 4;
  string detail = 5;
  ModelCallCompletionRejectReason reject_reason = 6; // accepted=false 时必为封闭非零值；accepted=true 时 UNSPECIFIED
}

message BeginToolCall {
  int64 attempt_id = 1;
  int64 tool_call_id = 2;
}

message BeginToolCallAck {
  bool accepted = 1;
  int64 attempt_id = 2;
  int64 tool_call_id = 3;
  string detail = 4;
}

enum ToolCallOutcome {
  TOOL_CALL_OUTCOME_UNSPECIFIED = 0;
  TOOL_CALL_OUTCOME_SUCCEEDED = 1;
  TOOL_CALL_OUTCOME_FAILED = 2;
  TOOL_CALL_OUTCOME_CANCELLED = 3;
}

// Tool 结果由固定 Tool schema 解释。小结果可在 canonical_json inline；长结果必须先通过
// ArtifactService.Upload 提交现有 tool_result Artifact，再在 artifact_ids 中引用。
message CompleteToolCall {
  int64 attempt_id = 1;
  int64 tool_call_id = 2;
  ToolCallOutcome outcome = 3;
  ResultPayload payload = 4;       // succeeded 时必填；schema_kind 绑定 tool definition
  int64 artifact_id = 5; // 0 表示无长正文；每个 Tool Result 最多一个完整正文 Artifact
  string error_code = 6;           // failed/cancelled 时的稳定机器码
  string error_detail = 7;         // 非秘密、面向 Agent 的可操作说明
}

message CompleteToolCallAck {
  bool accepted = 1;
  int64 attempt_id = 2;
  int64 tool_call_id = 3;
  repeated int64 evidence_ids = 4; // Quoin 由固定 Tool 结果确定性创建并提交的 Evidence
  ResultPayload committed_payload = 5; // 后续模型输入使用的已提交规范结果
  ArtifactRef artifact_ref = 6; // 无长正文时为空
  string detail = 7;
}

// QUOIN_ROUTED 工具的执行结果下发（ADR-0011）：Quoin 完成 BeginToolCall 授权后自行
// 编排执行（Handler 构造请求 -> Stele 网关执行 -> 结果封存/Evidence 创建/长正文
// Artifact 化），随后经本帧把已提交的规范结果推给 Plinth，supervisor 原样转发 worker
// 作为 ToolResult。Quoin 已是权威封存方，本帧不产生新的提交裁决。
message ExternalToolResult {
  int64 attempt_id = 1;
  int64 tool_call_id = 2;
  ToolCallOutcome outcome = 3;
  ResultPayload payload = 4;       // succeeded 时必填（已封存的 committed payload）
  ArtifactRef artifact_ref = 5;    // 长正文溢出时携带
  repeated int64 evidence_ids = 6; // Quoin 确定性创建的 Evidence
  string error_code = 7;           // failed/cancelled 时的稳定机器码
  string error_detail = 8;         // 非秘密、面向 Agent 的可操作说明
}

// ============================================================================
// 连接凭据 grant（RuntimeControl.FetchCredentialGrant）
// ============================================================================

// grant 获取请求（supervisor-only，RUNTIME-GRANT-001..003）：必须携带派发时下发的
// grant_id 与 Attempt/boot/epoch 上下文；Quoin 校验 Attempt Running 且绑定一致。
message FetchCredentialGrantRequest {
  int64 grant_id = 1;
  int64 attempt_id = 2;
  string boot_id = 3;
  uint64 connection_epoch = 4;
}

// grant 响应：非秘密 revision 配置投影 + 解密后的类型化秘密。仅经 TLS 返回一次成功
// 载荷；supervisor 只在 Attempt 内存中使用，完成即清除，不落盘、不进入日志/审计
// （RUNTIME-GRANT-002/003）。ADR-0011 后本 RPC 只服务 model_provider grant——
// metrics 等外部平台凭据改由 Stele 经 SteleRelay.AcquireConnectionCredential 按需获取。
message FetchCredentialGrantResponse {
  int64 grant_id = 1;
  int64 attempt_id = 2;
  int64 connection_revision_id = 3;     // connections.current_revision_id 绑定
  int64 credential_generation_id = 4;   // credential_generations.id 绑定
  string connection_type = 5;           // "model_provider"（connections.type；ADR-0011 后仅此一类）
  bytes revision_config_json = 6;       // 非秘密类型化投影（ModelConnectionNonSecret 等，DATA-CONN-005）
  oneof secret {
    ModelProviderCredentialSecret model_provider = 9;
  }
  reserved 7; // 已删除的 thanos（外部平台凭据供给移交 Stele，ADR-0011）
  reserved 8; // 已删除的 kubernetes（插件移除）
}

// Prometheus-compatible connection credentials (Prometheus or Thanos). Used by
// SteleRelay.AcquireConnectionCredential（ADR-0011）：Stele 只在本地缓存与出向执行中
// 使用，绝不回传公开 API 或进入日志。
message ThanosCredentialSecret {
  string username = 1;
  string password = 2;
  string bearer_token = 3;
}

// model_provider 连接秘密：API key（仅 supervisor 内存）。
message ModelProviderCredentialSecret {
  string api_key = 1;
}

// ============================================================================
// Artifact 上传（ArtifactService.Upload）
// ============================================================================

// client-stream 帧：首帧必须为 header，随后 0..N 个 chunk，可选的 end 帧；
// Quoin 在收到 size_bytes 字节或 end 帧后裁决（RUNTIME-UPLOAD-001）。
message ArtifactUploadFrame {
  oneof frame {
    ArtifactUploadHeader header = 1;
    ArtifactUploadChunk chunk = 2;
    ArtifactUploadEnd end = 3;
  }
}

// 上传头：冻结上传身份与目标元数据；来源字段在 ledger 中不可改写
// （DATA-ARTIFACT-006）。
message ArtifactUploadHeader {
  string upload_id = 1;            // Runtime 生成；重试生命周期内稳定
  int64 attempt_id = 2;            // execution_attempts.id
  string boot_id = 3;
  uint64 connection_epoch = 4;     // >= 1
  string owner_type = 5;           // artifacts.owner_type 封闭值（OpenAPI ArtifactSummary.ownerType / DATA-ARTIFACT-003）
  int64 owner_id = 6;              // artifacts.owner_id
  ArtifactKind kind = 7;
  RetentionKind retention_kind = 8;
  bool sensitive = 9;              // 敏感正文标记（DATA-ARTIFACT-003）
  uint64 size_bytes = 10;
  bytes sha256 = 11;               // 完整内容 SHA-256（32 字节）
  string media_type = 12;          // IANA media type；与 artifacts.media_type 严格一致
  reserved 13; // 已删除的 trace_integrity（浏览器运行时移除）
}

// 数据块：offset 必须连续（从 0 开始按序到达）；payload 长度部署受限（RUNTIME-UPLOAD-006）。
message ArtifactUploadChunk {
  uint64 offset = 1;
  bytes payload = 2;
}

// 结束帧（可选）：显式声明已上传字节数；Quoin 同时接受"收到 size_bytes 字节即判完成"。
message ArtifactUploadEnd {
  uint64 uploaded_size_bytes = 1;
}

// 上传结果：committed=true 返回 artifact_id；rejected 携带原因（RUNTIME-UPLOAD-004/005）。
message ArtifactUploadResult {
  string upload_id = 1;
  bool committed = 2;
  int64 artifact_id = 3;           // committed 时返回 artifacts.id
  UploadRejectReason reject_reason = 4;
}

// Artifact 文本读取/搜索请求都必须绑定当前 Running Attempt、boot 与 epoch；Quoin 只允许
// attempt_artifact_grants 中已授权且 body_expired=0 的正文。offset/limit 和输出字节数受部署
// 固定上限，响应永不暴露 PV/storage_key 物理路径。
message ArtifactReadTextRequest {
  int64 attempt_id = 1;
  int64 artifact_id = 2;
  string boot_id = 3;
  uint64 connection_epoch = 4;
  uint64 start_line = 5;           // 1-based；0 拒绝
  uint32 max_lines = 6;            // 非零且不超过服务端固定上限
}

message ArtifactReadTextResponse {
  int64 artifact_id = 1;
  bytes content = 2;               // 原始 UTF-8 字节片段；不改写换行
  uint64 start_line = 3;
  uint64 next_line = 4;            // eof=false 时下一次读取位置
  bool eof = 5;
  uint64 total_size_bytes = 6;
  uint64 total_lines = 7;
  bytes sha256 = 8;
  string media_type = 9;
}

message ArtifactGrepTextRequest {
  int64 attempt_id = 1;
  int64 artifact_id = 2;
  string boot_id = 3;
  uint64 connection_epoch = 4;
  string re2_pattern = 5;
  uint32 max_matches = 6;          // 非零且不超过服务端固定上限
  uint32 context_lines = 7;        // 不超过服务端固定上限
}

message ArtifactTextMatch {
  uint64 line = 1;
  bytes content = 2;
}

message ArtifactGrepTextResponse {
  int64 artifact_id = 1;
  repeated ArtifactTextMatch matches = 2;
  bool truncated = 3;
  uint64 total_size_bytes = 4;
  uint64 total_lines = 5;
  bytes sha256 = 6;
  string media_type = 7;
}

// ============================================================================
// Stele 外部网关（SteleRelay，ADR-0011）
// ============================================================================

// ---- 网关流（Connect）----

// 网关双向信封。message_id 当前连接内按方向单调递增且唯一；correlation_id 关联
// ExecutePlatformCall 请求-响应对（0 = 无）；boot_id 除 SteleHello 外必须等于接收流
// 上下文。
message SteleEnvelope {
  uint64 message_id = 1;
  uint64 correlation_id = 2;     // 请求-响应对关联；0 = 无
  string boot_id = 3;            // 除 SteleHello 外必须等于接收流上下文
  oneof msg {
    SteleHello hello = 10;                        // Stele -> Quoin；首帧
    SteleHelloAck hello_ack = 11;                 // Quoin -> Stele；握手裁决
    SteleHeartbeat heartbeat = 12;                // 双向；只更新瞬时投影
    ExecutePlatformCall execute = 13;             // Quoin -> Stele；出向平台执行请求
    ExecutePlatformCallResult execute_result = 14; // Stele -> Quoin；执行结果
    GoAway go_away = 15;                          // Quoin -> Stele；尽力而为的停机通知
  }
}

// 网关握手首帧：客户端证书已在 mTLS 握手中认证（CN=stele）。
message SteleHello {
  string boot_id = 1;              // 每次进程启动重新生成
  uint64 connection_epoch = 2;     // 每次连接递增，>= 1
  string contract_fingerprint = 3; // 完整权威集合 SHA-256，小写 hex
  string release_version = 4;      // 展示与溯源
}

message SteleHelloAck {
  bool accepted = 1;
  string detail = 2;               // 拒绝时的非权威说明
}

message SteleHeartbeat {
  uint64 seq = 1;                  // 当前连接内单调递增
}

// ---- 出向平台执行（Quoin -> Stele）----

// 出向平台执行请求：Quoin 的 Tool Handler 构造协议请求（方法 + 相对路径 + 正文），
// Stele 负责连接材料解析（endpoint + 凭证注入）、限流与传输执行。URL 由已配置连接的
// endpoint 与相对路径拼装，本消息不承载 scheme/host（SSRF 面由此收敛）。call_id 用于
// 流内配对；Quoin 在流断开后重发同一 call_id 不保证恰好一次——出向工具以幂等读为主，
// 副作用语义由具体工具契约自行约束。
message ExecutePlatformCall {
  string call_id = 1;         // Quoin 生成的请求标识；correlation_id 配对
  int64 connection_id = 2;    // connections.id；Stele 据此解析连接材料
  int64 connection_revision_id = 3; // 冻结 grant 绑定的 revision；与 Stele 缓存不一致时重新 Acquire
  string method = 4;          // GET | POST（封闭）
  string path = 5;            // 相对路径（以 / 开始，不含 scheme/host）
  string query = 6;           // 原样 query string（可空）
  map<string, string> headers = 7; // 附加非凭证头；认证头由 Stele 注入
  bytes body = 8;             // GET 必须为空
  uint32 timeout_ms = 9;      // > 0，部署上限
}

// 执行结果。SUCCEEDED 表示平台返回了 HTTP 响应（含平台侧 4xx/5xx，语义由 Quoin 侧
// Handler 解释）；非 SUCCEEDED 是 Stele 网关自身的判定：配额、凭证、连通性。
message ExecutePlatformCallResult {
  string call_id = 1;
  PlatformCallStatus status = 2;
  int32 http_status = 3;      // SUCCEEDED 时有效
  bytes body = 4;             // 原始响应体（SUCCEEDED 时）
  uint64 latency_ms = 5;
  string error_code = 6;      // 非 SUCCEEDED 时的稳定机器码
  string error_detail = 7;    // 非秘密说明
}

enum PlatformCallStatus {
  PLATFORM_CALL_STATUS_UNSPECIFIED = 0;
  PLATFORM_CALL_STATUS_SUCCEEDED = 1;              // 平台已响应（HTTP 状态由 Handler 解释）
  PLATFORM_CALL_STATUS_RATE_LIMITED = 2;           // Stele 侧配额拒绝
  PLATFORM_CALL_STATUS_CREDENTIAL_UNAVAILABLE = 3; // 连接材料不可用（未配置/吊销/Acquire 失败）
  PLATFORM_CALL_STATUS_UNREACHABLE = 4;            // 平台不通/超时
  PLATFORM_CALL_STATUS_INTERNAL = 5;               // 网关内部错误
}

// ---- 连接材料按需获取 ----

message AcquireConnectionCredentialRequest {
  int64 connection_id = 1;
  string contract_fingerprint = 2; // 完整权威集合 SHA-256，小写 hex
}

// 连接材料响应：非秘密配置投影（含 endpoint）+ 解密秘密。Quoin 只写不读（ADR-0011）：
// 解密仅为按需投递，Quoin 自身不使用、不缓存。Stele 缓存于本地状态，动态凭证
// （token 刷新等）生命周期管理归 Stele。
message AcquireConnectionCredentialResponse {
  int64 connection_id = 1;
  int64 connection_revision_id = 2;
  int64 credential_generation_id = 3;
  string connection_type = 4;     // "prometheus" | "thanos"（connections.type）
  bytes revision_config_json = 5; // 非秘密类型化投影（ThanosConnectionNonSecret，DATA-CONN-005）
  ThanosCredentialSecret thanos = 6; // prometheus/thanos 共用；connection_type 为权威判别
}

// ---- 入向快照与事件转交 ----

// 快照请求：contract_fingerprint 必须与 Quoin 的完整 Proto 权威契约相同。
message GetCredentialSnapshotRequest {
  string contract_fingerprint = 1;
}

// 版本化只读快照：Stele 仅内存缓存；DeliverEvents 必须回传 snapshot_version
// （DATA-ALERT-008）。contract_fingerprint 供 Stele 复核通信准入。
message GetCredentialSnapshotResponse {
  uint64 snapshot_version = 1;     // 单调递增；DeliverEvents 回传
  repeated AlertSourceSnapshot sources = 2;
  string contract_fingerprint = 3; // Quoin 当前完整 Proto 权威契约 SHA-256
}

// 单个逻辑告警源的非秘密投影（对应 alert_sources 的 enabled 与 active 凭据 digest）。
message AlertSourceSnapshot {
  int64 source_id = 1;             // alert_sources.id
  string source_key = 2;
  string protocol = 3;             // v1: alertmanager（= EventSource.Kind()）
  bool enabled = 4;
  repeated CredentialDigestEntry credentials = 5; // 仅 active 凭据（<=2）
}

// active 凭据 digest 条目：Stele 提交事件时回传 credential_id 与快照版本。
message CredentialDigestEntry {
  int64 credential_id = 1;         // alert_source_credentials.id
  bytes digest = 2;                // 32-byte Bearer digest
}

// 事件批量转交：Stele 本地队列的转发循环调用。event_id 幂等；结果逐事件裁决，
// ACCEPTED/REJECTED 后 Stele 删除本地队列条目，UNAVAILABLE 稍后重试、超限入死信。
message DeliverEventsRequest {
  string contract_fingerprint = 1; // 完整权威集合 SHA-256，小写 hex
  repeated RelayEvent events = 2;  // 逐事件独立事务裁决
}

// 归一化事件：EventSource 插件 VerifyAndParse 的产物信封。payload 是该 source_kind
// 的归一化事件 JSON（协议语义已在边缘解析，Quoin 只解释业务语义）。
message RelayEvent {
  string event_id = 1;          // Stele 生成；全局唯一；幂等键
  string source_kind = 2;       // EventSource.Kind()（= AlertSourceSnapshot.protocol）
  int64 source_id = 3;          // 匹配的 alert_sources.id
  int64 credential_id = 4;      // 命中的凭据
  uint64 credential_snapshot_version = 5;
  string event_type = 6;        // 归一化事件类型（如 "alerts.batch"）
  google.protobuf.Timestamp received_at = 7; // Stele 收到外部请求的时间
  bytes payload = 8;            // 归一化事件 JSON
}

message DeliverEventsResponse {
  repeated EventDeliveryStatus results = 1; // 与请求 events 顺序一一对应
}

// 逐事件转交裁决（ADR-0011：入队即 ACK，业务拒绝发生在 ACK 之后）。ACCEPTED 含
// 重复到达的幂等接受；REJECTED 为业务性永久拒绝（Stele 死信保留原文）；UNAVAILABLE
// 为瞬时不可用（Stele 重试）。
enum EventDeliveryStatus {
  EVENT_DELIVERY_STATUS_UNSPECIFIED = 0;
  EVENT_DELIVERY_STATUS_ACCEPTED = 1;
  EVENT_DELIVERY_STATUS_REJECTED = 2;
  EVENT_DELIVERY_STATUS_UNAVAILABLE = 3;
}
