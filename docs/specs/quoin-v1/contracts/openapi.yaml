  /api/v1/alerts/events:
    get:
      tags: [realtime]
      operationId: streamAlertEvents
      x-external-dependency: true
      x-sse-event-data:
        change:
          $ref: '#/components/schemas/AlertChangeEvent'
        resync_required:
          $ref: '#/components/schemas/ResyncRequiredEvent'
      summary: 告警变更 SSE（快照后建立；after 查询参数；重连使用 Last-Event-ID）
      description: |
        SSE 事件格式（HTTP-SSE-002）：
        event: change
        id: <alert_change_seq>
        data: {"seq":"123","type":"created|state_changed","occurrenceId":"42","rowVersion":3}

        游标过期分两种边界（HTTP-SSE-002/003）：
        1) 游标在响应头写出前已判定过期（last-seen 谓词：high_water > 0 时 cursor < high_water AND cursor < oldest_available - 1；high_water = 0 时仅 cursor = 0 有效）→ 直接返回 410 problem+json，不写流；
        2) 流已建立后才判定过期 → 发送 event: resync_required 与 data: {"type":"resync_required"} 后关闭连接，不返回 410。

        heartbeat 为纯传输注释（: comment），不持久化（HTTP-SSE-005）。
        每个事件必须带 id: 行（HTTP-SSE-003）。
      parameters:
        - name: after
          in: query
          description: 上次收到的最大 alert_change_seq（十进制字符串，可为 0）；与 Last-Event-ID 同时存在时以 Last-Event-ID 为准（HTTP-SSE-003）。游标在响应头写出前已判定过期时返回 410；流建立后过期则发送 resync_required 事件并关闭连接（HTTP-SSE-002）。
          schema:
            $ref: '#/components/schemas/ChangeSeq'
        - name: Last-Event-ID
          in: header
          description: 原生 EventSource 重连自动携带的上次事件 id（HTTP-SSE-003）；存在时优先于 after 查询参数；游标过期语义与 after 相同。
          schema:
            $ref: '#/components/schemas/ChangeSeq'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: text/event-stream 变更流。
          headers:
            Content-Type:
              schema:
                type: string
                const: text/event-stream
            Cache-Control:
              schema:
                type: string
                const: no-cache
            X-Accel-Buffering:
              schema:
                type: string
                const: 'no'
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AlertChangeEvent'
                  - $ref: '#/components/schemas/ResyncRequiredEvent'
                description: "每条 data: 行的 JSON 载荷为 AlertChangeEvent（event: change）或 ResyncRequiredEvent（event: resync_required）；framing（event:/id:/data:）与逐事件 flush 见 HTTP-SSE-002。"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          $ref: '#/components/responses/Gone'
  /api/v1/tasks/events:
    get:
      tags: [realtime]
      operationId: streamTaskEvents
      x-external-dependency: true
      x-sse-event-data:
        change:
          $ref: '#/components/schemas/TaskChangeEvent'
        resync_required:
          $ref: '#/components/schemas/ResyncRequiredEvent'
      summary: 后台任务变更 SSE（快照后建立；after 查询参数；重连使用 Last-Event-ID）
      description: |
        SSE 事件格式（HTTP-SSE-006）：
        event: change
        id: <task_change_seq>
        data: {"seq":"123","objectType":"execution_attempt","objectId":"7","changeType":"created|state_changed","rowVersion":2}

        游标过期分两种边界（HTTP-SSE-002/003）：
        1) 游标在响应头写出前已判定过期 → 直接返回 410 problem+json，不写流；
        2) 流已建立后才判定过期 → 发送 event: resync_required 与 data: {"type":"resync_required"} 后关闭连接，不返回 410。

        token delta/高频动画不持久化、不进入事件（HTTP-SSE-007）。
      parameters:
        - name: after
          in: query
          description: 上次收到的最大 task_change_seq（十进制字符串，可为 0）；与 Last-Event-ID 同时存在时以 Last-Event-ID 为准（HTTP-SSE-003）。游标在响应头写出前已判定过期时返回 410；流建立后过期则发送 resync_required 事件并关闭连接（HTTP-SSE-002）。
          schema:
            $ref: '#/components/schemas/ChangeSeq'
        - name: Last-Event-ID
          in: header
          description: 原生 EventSource 重连自动携带的上次事件 id（HTTP-SSE-003）；存在时优先于 after 查询参数；游标过期语义与 after 相同。
          schema:
            $ref: '#/components/schemas/ChangeSeq'
      responses:
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: text/event-stream 变更流。
          headers:
            Content-Type:
              schema:
                type: string
                const: text/event-stream
            Cache-Control:
              schema:
                type: string
                const: no-cache
            X-Accel-Buffering:
              schema:
                type: string
                const: 'no'
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TaskChangeEvent'
                  - $ref: '#/components/schemas/ResyncRequiredEvent'
                description: "每条 data: 行的 JSON 载荷为 TaskChangeEvent（event: change）或 ResyncRequiredEvent（event: resync_required）；framing（event:/id:/data:）与逐事件 flush 见 HTTP-SSE-006。"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          $ref: '#/components/responses/Gone'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-quoin-session
      description: 32-byte opaque Session bearer 的 HttpOnly Secure SameSite=Lax Cookie；raw bearer 只存在于浏览器与认证瞬间内存（DATA-AUTH-003）。
  parameters:
    Cursor:
      name: cursor
      in: query
      description: 不透明分页游标（HTTP-PAGE-001）；由上一响应 nextCursor 原样回传。
      schema:
        $ref: '#/components/schemas/Cursor'
    Limit:
      name: limit
      in: query
      description: 页大小上限（默认 50，最大 200；HTTP-PAGE-002）。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    OccurrenceId:
      name: occurrenceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LocatorId'
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LocatorId'
    IssueId:
