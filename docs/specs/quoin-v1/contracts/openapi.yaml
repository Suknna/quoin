          minimum: 1
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ImportBatchDetail:
      allOf:
        - $ref: '#/components/schemas/ImportBatchSummary'
        - type: object
          required: [candidates]
          properties:
            candidates:
              type: array
              items:
                $ref: '#/components/schemas/CandidateSummary'
    CandidateSummary:
      type: object
      required: [id, sourceType, sourceId, state, rowVersion, generation, draftRevision]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        sourceType:
          type: string
          enum: [initial_analysis_output, inspection_report, investigation_message, source_material]
        sourceId:
          $ref: '#/components/schemas/LocatorId'
        state:
          type: string
          enum: [AwaitingConfirmation, Confirmed, Excluded, Superseded, SourceInvalid]
        rowVersion:
          type: integer
          minimum: 1
        generation:
          type: integer
          minimum: 1
        draftRevision:
          type: integer
          minimum: 0
        draftTitle:
          type: string
        draftBody:
          type: string
        confirmedKnowledgeId:
          $ref: '#/components/schemas/LocatorId'
    CandidateDraftEditRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [expectedRevision]
          properties:
            expectedRevision:
              type: integer
              minimum: 0
              description: stale revision 冲突（DATA-KNOWLEDGE-004）。
            title:
              type: string
            body:
              type: string
          anyOf:
            - required: [title]
            - required: [body]
      description: 至少提供一个草稿变更字段（anyOf 强制），防止无变化编辑。
    ConfirmCandidateRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [expectedRevision]
          properties:
            expectedRevision:
              type: integer
              minimum: 0
    ConfirmCandidatesRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              minItems: 1
              items:
                type: object
                required: [candidateId, expectedRevision]
                properties:
                  candidateId:
                    $ref: '#/components/schemas/LocatorId'
                  expectedRevision:
                    type: integer
                    minimum: 0
    FeedbackRequest:
      type: object
      required: [targetType, targetId, value]
      properties:
        targetType:
          type: string
          enum: [initial_analysis_output, inspection_report, investigation_message]
        targetId:
          $ref: '#/components/schemas/LocatorId'
        value:
          type: string
          enum: [adopted, executed, verified_effective, rejected]
    FeedbackSummary:
      type: object
      required: [id, targetType, targetId, value, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        targetType:
          type: string
          enum: [initial_analysis_output, inspection_report, investigation_message]
        targetId:
          $ref: '#/components/schemas/LocatorId'
        value:
          type: string
          enum: [adopted, executed, verified_effective, rejected]
        createdBy:
          $ref: '#/components/schemas/LocatorId'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    TaskSnapshot:
      type: object
      required: [snapshotSeq, items]
      properties:
        snapshotSeq:
          $ref: '#/components/schemas/ChangeSeq'
          description: 快照绑定的 task_change_seq（首页取当前最大 task_change_log.id；全部页回传同一值，DATA-SSE-009）；建立 streamTaskEvents 时作为 after。
        items:
          type: array
          description: 有界集合（HTTP-PAGE-007）：active 任务 + 当前用户终态未查看任务；按 nextCursor 分页遍历。
          items:
            $ref: '#/components/schemas/TaskObjectRef'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
          description: 绑定首页 snapshotSeq 的短有效期快照游标（HTTP-PAGE-006）；过期返回 410。
    TaskObjectRef:
      type: object
      required: [objectType, objectId, rowVersion]
      properties:
        objectType:
          type: string
          enum: [initial_analysis, execution_attempt, inspection_run, inspection_report, tool_call, knowledge_import_batch, knowledge_candidate, browser_operation, config_test_run]
        objectId:
          $ref: '#/components/schemas/LocatorId'
        rowVersion:
          type: integer
          minimum: 1
          description: 快照时该对象的权威 row_version；客户端按 rowVersion 幂等应用事件（HTTP-SSE-003）。
    BusinessSystemSummary:
      type: object
      required: [key, displayName, enabled, rowVersion]
      properties:
        key:
          $ref: '#/components/schemas/StableKey'
        displayName:
          type: string
        enabled:
          type: boolean
        rowVersion:
          type: integer
          minimum: 1
          description: 系统行并发前提（HTTP-COMMAND-002）。
        currentConfigVersionId:
          $ref: '#/components/schemas/LocatorId'
        timezone:
          type: ["string", "null"]
          description: 已发布配置版本的根投影；首次发布后存在（DATA-CONFIG-001）。
        resourceRefreshIntervalSeconds:
          type: ["integer", "null"]
          minimum: 1
          description: 已发布配置版本的根投影；首次发布后存在（DATA-CONFIG-001）。
        browserIdentityState:
          type: string
          enum: [Ready, AuthenticationRequired, none]
    BusinessSystemDetail:
      allOf:
        - $ref: '#/components/schemas/BusinessSystemSummary'
        - type: object
          properties:
            configVersionCount:
              type: integer
              minimum: 0
              description: 配置版本总数；历史经 listBusinessSystemConfigs 游标分页读取（HTTP-PAGE-005）。
            discoveries:
              type: array
              items:
                $ref: '#/components/schemas/DiscoverySummary'
            plans:
              type: array
              items:
                $ref: '#/components/schemas/PlanSummary'
            browserIdentity:
              $ref: '#/components/schemas/BrowserIdentitySummary'
    DiscoverySummary:
      type: object
      required: [discoveryKey, displayName, selector, identityLabels]
      properties:
        discoveryKey:
          $ref: '#/components/schemas/StableKey'
        displayName:
          type: string
        selector:
          type: string
          description: 单个 instant vector selector（上传时经 Prometheus 官方 AST 校验，CFG-PROMQL-002）。
        identityLabels:
          type: array
          items:
            type: string
    PlanSummary:
      type: object
      required: [planKey, displayName]
      properties:
        planKey:
          $ref: '#/components/schemas/StableKey'
        displayName:
          type: string
        cron:
          type: string
          description: 标准五字段 cron；缺省表示仅人工运行。时区由配置根节点统一提供（DATA-CONFIG-004）。
        checks:
          type: array
          items:
            $ref: '#/components/schemas/CheckSummary'
    CheckSummary:
      oneOf:
        - $ref: '#/components/schemas/PromqlCheckSummary'
        - $ref: '#/components/schemas/BrowserCheckSummary'
      description: 巡检项按 kind 封闭判别；promql 与 browser 字段互相排斥（DATA-CONFIG-003）。
    PromqlCheckSummary:
      oneOf:
        - $ref: '#/components/schemas/PromqlInstantCheck'
        - $ref: '#/components/schemas/PromqlRangeCheck'
      description: PromQL 巡检项按查询模式封闭判别（DATA-CONFIG-003）。
    PromqlInstantCheck:
      type: object
      required: [checkKey, displayName, analysisQuestion, kind, queryMode, expression]
      additionalProperties: false
      properties:
        checkKey:
          $ref: '#/components/schemas/StableKey'
        displayName:
          type: string
        analysisQuestion:
          type: string
        kind:
          type: string
          const: promql
        queryMode:
          type: string
          const: instant
        expression:
          type: string
          description: PromQL 字面量表达式（官方 AST 校验；每个 VectorSelector 必须等于目标 Label Contract 业务系统 label 精确 = 当前 system key，CFG-PROMQL-002）。
    PromqlRangeCheck:
      type: object
      required: [checkKey, displayName, analysisQuestion, kind, queryMode, expression, rangeSeconds, stepSeconds]
      additionalProperties: false
      properties:
        checkKey:
          $ref: '#/components/schemas/StableKey'
        displayName:
          type: string
        analysisQuestion:
          type: string
        kind:
          type: string
          const: promql
        queryMode:
          type: string
          const: range
        expression:
          type: string
          description: PromQL 字面量表达式（官方 AST 校验；每个 VectorSelector 必须等于目标 Label Contract 业务系统 label 精确 = 当前 system key，CFG-PROMQL-002）。
        rangeSeconds:
          type: integer
          minimum: 1
          description: range 查询窗口；以真实 evidence_at 为终点（DATA-CONFIG-003）。
        stepSeconds:
          type: integer
          minimum: 1
          description: range 查询步长。
    BrowserCheckSummary:
      type: object
      required: [checkKey, displayName, analysisQuestion, kind, journeyId, journeyParams]
      additionalProperties: false
      properties:
        checkKey:
          $ref: '#/components/schemas/StableKey'
        displayName:
          type: string
        analysisQuestion:
          type: string
        kind:
          type: string
          const: browser
        journeyId:
          type: string
          description: Journey Catalog 中的稳定 ID（DATA-CONFIG-008）。
        journeyParams:
          type: object
          description: 与 journey_id 对应的封闭参数；YAML 缺省时规范化为 {}，上传时按嵌入 catalog 的 params_schema 校验（schema 由 catalog 生成持有，不在此复制字段，CFG-JOURNEY-003）。
    ConfigVersionSummary:
      type: object
      required: [id, versionSeq, state, createdAt, digest, parserVersion, schemaVersion, systemKey, displayName, enabled, labelContractVersionId, journeyCatalogDigest, journeyCatalogVersion]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        versionSeq:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [draft, published, superseded]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
        digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        parserVersion:
          type: string
        schemaVersion:
          type: string
        systemKey:
          $ref: '#/components/schemas/StableKey'
          description: 解析一次的类型化根投影；必须等于业务系统稳定 key（DATA-CONFIG-003）。
        displayName:
          type: string
        enabled:
          type: boolean
        labelContractVersionId:
          $ref: '#/components/schemas/LocatorId'
          description: 上传时显式目标 Label Contract 版本（DATA-CONFIG-003）。
        journeyCatalogDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        journeyCatalogVersion:
          type: string
      allOf:
        - if:
            properties:
              state:
                enum: [published, superseded]
            required: [state]
          then:
            properties:
              publishedAt: {}
            required: [publishedAt]
          else:
            not:
              type: object
              properties:
                publishedAt: {}
              required: [publishedAt]
    ConfigVersionDetail:
      allOf:
        - $ref: '#/components/schemas/ConfigVersionSummary'
        - type: object
          required: [yamlBody, timezone, resourceRefreshIntervalSeconds, discoveries, plans]
          properties:
            yamlBody:
              type: string
              description: 上传的原始 YAML 正文（可导出；运行只使用类型结构）。
            timezone:
              type: string
              description: IANA 时区（根节点统一提供，DATA-CONFIG-004）。
            resourceRefreshIntervalSeconds:
              type: integer
              minimum: 1
            discoveries:
              type: array
              items:
                $ref: '#/components/schemas/DiscoverySummary'
            plans:
              type: array
              items:
                $ref: '#/components/schemas/PlanSummary'
    PublishConfigRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [expectedCurrentPublishedVersionId]
          properties:
            expectedCurrentPublishedVersionId:
              $ref: '#/components/schemas/NullableLocatorId'
              description: 并发前提；null 表示当前无已发布版本（首次发布），其余情况必须为当前已发布版本 ID；不匹配返回 409（DATA-CONFIG-001）。
    ObservedResourceSummary:
      type: object
      required: [id, discoveryKey, identityLabels, current]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        discoveryKey:
          $ref: '#/components/schemas/StableKey'
        identityLabels:
          type: object
          additionalProperties:
            type: string
          description: 身份 labels 的排序键值（identity_key 是相等性权威；DATA-OBSERVED-001）。
        displayName:
          type: string
        observedAt:
          $ref: '#/components/schemas/Timestamp'
        current:
          type: boolean
        stale:
          type: boolean
        lastSuccessfulRefreshAt:
          $ref: '#/components/schemas/Timestamp'
    AuthenticationProbeConfig:
      type: object
      additionalProperties: false
      required: [journeyId, journeyVersion, params]
      properties:
        journeyId:
          type: string
          minLength: 1
          maxLength: 200
          description: Journey Catalog 中 purpose=authentication_probe 的稳定版本化 ID。
        journeyVersion:
          type: integer
          minimum: 1
        params:
          type: object
          description: 按该 Journey 的封闭 params_schema 校验；未知字段拒绝。
    BrowserIdentityRevisionSummary:
      type: object
      additionalProperties: false
      required: [id, revision, name, startUrl, authenticationProbe, catalogDigest, catalogVersion, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        revision:
          type: integer
          minimum: 1
        name:
          type: string
        startUrl:
          type: string
          format: uri
          pattern: '^https?://[^/?#]+'
        authenticationProbe:
          $ref: '#/components/schemas/AuthenticationProbeConfig'
        catalogDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        catalogVersion:
          type: string
          minLength: 1
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    BrowserProfileGenerationSummary:
      type: object
      additionalProperties: false
      required: [id, generation, identityRevisionId, chromiumRevision, profileManifestDigest, probeJourneyId, probeJourneyVersion, probeCatalogDigest, probeCatalogVersion, publishedAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        generation:
          type: integer
          minimum: 1
        identityRevisionId:
          $ref: '#/components/schemas/LocatorId'
        chromiumRevision:
          type: string
          minLength: 1
        profileManifestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        probeJourneyId:
          type: string
          minLength: 1
        probeJourneyVersion:
          type: integer
          minimum: 1
        probeCatalogDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        probeCatalogVersion:
          type: string
          minLength: 1
        publishedAt:
          $ref: '#/components/schemas/Timestamp'
    AuthenticationProbeResultSummary:
      type: object
      additionalProperties: false
      required: [phase, result, journeyId, journeyVersion, catalogDigest, catalogVersion, observedAt]
      properties:
        phase:
          type: string
          enum: [revision_change, admission, completion, publish, mid_operation]
        result:
          type: string
          enum: [Authenticated, Unauthenticated, Indeterminate]
        journeyId:
          type: string
        journeyVersion:
          type: integer
          minimum: 1
        catalogDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        catalogVersion:
          type: string
          minLength: 1
        reasonCode:
          type: string
          minLength: 1
        observedAt:
          $ref: '#/components/schemas/Timestamp'
      allOf:
        - if:
            properties:
              result:
                const: Indeterminate
            required: [result]
          then:
            properties:
              reasonCode:
                type: string
                minLength: 1
            required: [reasonCode]
          else:
            properties:
              reasonCode: false
    BrowserOperationSummary:
      type: object
      additionalProperties: false
      required: [id, identityId, identityRevisionId, kind, state, rowVersion, requestedAt, canAttach, canPublish, canCancel]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        identityId:
          $ref: '#/components/schemas/LocatorId'
        identityRevisionId:
          $ref: '#/components/schemas/LocatorId'
        profileGenerationId:
          $ref: '#/components/schemas/NullableLocatorId'
        kind:
          type: string
          enum: [manual_login, authentication_probe, journey, exploration]
        state:
          type: string
          enum: [Queued, WaitingForCapacity, Starting, Running, AwaitingReconnect, Succeeded, Failed, Cancelled, Interrupted]
        terminalReason:
          type: string
          enum: [client_closed_without_publish, grace_expired, session_revoked, new_boot, shutdown, slot_revoked, slot_replaced, profile_missing, profile_manifest_invalid, chromium_revision_mismatch, authentication_required, authentication_probe_unavailable, artifact_commit_failed, journey_failed, cancelled, parent_terminal, lease_expired, runtime_unavailable, browser_crashed, protocol_error]
        rowVersion:
          type: integer
          minimum: 1
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        startDispatchedAt:
          $ref: '#/components/schemas/Timestamp'
          description: StartBrowserOperation 已派发；本字段存在但 startedAt 缺失时，Starting 表示 Ack 未知，WaitingForCapacity 表示明确 NO_CAPACITY 后按原 FIFO 等待重发；两者都保留身份 fence。
        startedAt:
          $ref: '#/components/schemas/Timestamp'
        reconnectDeadline:
          $ref: '#/components/schemas/Timestamp'
        endedAt:
          $ref: '#/components/schemas/Timestamp'
        stopConfirmedAt:
          $ref: '#/components/schemas/Timestamp'
          description: Lintel 已确认该 operation 的 Chromium/隧道不存在；领域终态存在但本字段缺失时身份仍被占用。
        stopConfirmationBasis:
          type: string
          enum: [not_dispatched, start_rejected, stop_ack, inventory_absent, new_boot]
          description: 物理停止确认的唯一审计依据；必须与 stopConfirmedAt 成对出现。
        startedByUsername:
          type: string
        probeResults:
          type: array
          items:
            $ref: '#/components/schemas/AuthenticationProbeResultSummary'
        canAttach:
          type: boolean
        canPublish:
          type: boolean
        canCancel:
          type: boolean
      allOf:
        - if:
            required: [stopConfirmedAt]
          then:
            required: [stopConfirmationBasis]
          else:
            properties:
              stopConfirmationBasis: false
        - if:
            properties:
              state:
                const: Starting
            required: [state]
          then:
            properties:
              startedAt: false
            required: [startDispatchedAt]
        - if:
            properties:
              state:
                enum: [Running, AwaitingReconnect, Succeeded]
            required: [state]
          then:
            required: [startDispatchedAt, startedAt]
        - if:
            properties:
              state:
                enum: [Failed, Cancelled, Interrupted]
            required: [state]
          then:
            properties:
              endedAt:
                $ref: '#/components/schemas/Timestamp'
              terminalReason:
                type: string
                enum: [client_closed_without_publish, grace_expired, session_revoked, new_boot, shutdown, slot_revoked, slot_replaced, profile_missing, profile_manifest_invalid, chromium_revision_mismatch, authentication_required, authentication_probe_unavailable, artifact_commit_failed, journey_failed, cancelled, parent_terminal, lease_expired, runtime_unavailable, browser_crashed, protocol_error]
            required: [endedAt, terminalReason]
          else:
            properties:
              terminalReason: false
        - if:
            properties:
              state:
                const: Succeeded
            required: [state]
          then:
            properties:
              endedAt:
                $ref: '#/components/schemas/Timestamp'
            required: [endedAt]
        - if:
            properties:
              state:
                const: AwaitingReconnect
            required: [state]
          then:
            properties:
              startedAt:
                $ref: '#/components/schemas/Timestamp'
              reconnectDeadline:
                $ref: '#/components/schemas/Timestamp'
            required: [startedAt, reconnectDeadline]
          else:
            properties:
              reconnectDeadline: false
        - if:
            properties:
              terminalReason:
                enum: [artifact_commit_failed, journey_failed]
            required: [terminalReason]
          then:
            properties:
              state:
                const: Failed
        - if:
            properties:
              state:
                enum: [Queued, WaitingForCapacity, Starting, Running, AwaitingReconnect]
            required: [state]
          then:
            properties:
              stopConfirmedAt: false
        - if:
            allOf:
              - properties:
                  state:
                    enum: [Succeeded, Failed, Cancelled, Interrupted]
                required: [state]
              - not:
                  required: [startDispatchedAt]
          then:
            required: [stopConfirmedAt, stopConfirmationBasis]
            properties:
              stopConfirmationBasis:
                const: not_dispatched
        - if:
            required: [startDispatchedAt]
          then:
            properties:
              stopConfirmationBasis:
                enum: [start_rejected, stop_ack, inventory_absent, new_boot]
        - if:
            properties:
              kind:
                const: manual_login
            required: [kind]
          then:
            properties:
              startedByUsername:
                type: string
            required: [startedByUsername]
          else:
            properties:
              startedByUsername: false
        - if:
            properties: {kind: {const: manual_login}}
            required: [kind]
          then:
            properties:
              terminalReason:
                enum: [client_closed_without_publish, grace_expired, session_revoked, new_boot, shutdown, slot_revoked, slot_replaced, cancelled, runtime_unavailable, browser_crashed, protocol_error]
        - if:
            properties: {kind: {const: authentication_probe}}
            required: [kind]
          then:
            properties:
              terminalReason:
                enum: [new_boot, shutdown, slot_revoked, slot_replaced, profile_missing, profile_manifest_invalid, chromium_revision_mismatch, authentication_required, authentication_probe_unavailable, cancelled, runtime_unavailable, browser_crashed, protocol_error]
        - if:
            properties: {kind: {const: journey}}
            required: [kind]
          then:
            properties:
              terminalReason:
                enum: [new_boot, shutdown, slot_revoked, slot_replaced, profile_missing, profile_manifest_invalid, chromium_revision_mismatch, authentication_required, authentication_probe_unavailable, artifact_commit_failed, journey_failed, cancelled, parent_terminal, lease_expired, runtime_unavailable, browser_crashed, protocol_error]
        - if:
            properties: {kind: {const: exploration}}
            required: [kind]
          then:
            properties:
              terminalReason:
                enum: [new_boot, shutdown, slot_revoked, slot_replaced, profile_missing, profile_manifest_invalid, chromium_revision_mismatch, authentication_required, authentication_probe_unavailable, artifact_commit_failed, cancelled, parent_terminal, lease_expired, runtime_unavailable, browser_crashed, protocol_error]
    BrowserIdentitySummary:
      type: object
      additionalProperties: false
      required: [id, state, rowVersion, currentRevision, currentProfile, lastProbe, currentOperation]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        state:
          type: string
          enum: [Ready, AuthenticationRequired]
        rowVersion:
          type: integer
          minimum: 1
        currentRevision:
          $ref: '#/components/schemas/BrowserIdentityRevisionSummary'
        currentProfile:
          oneOf:
            - $ref: '#/components/schemas/BrowserProfileGenerationSummary'
            - type: 'null'
        lastProbe:
          description: 当前身份最近一次持久化 authentication probe 三态事实；从未执行时为 null。
          oneOf:
            - $ref: '#/components/schemas/AuthenticationProbeResultSummary'
            - type: 'null'
        currentOperation:
          description: 当前身份锁持有者；领域已终态但 stopConfirmedAt 缺失的 operation 仍在此返回，只有物理停止确认后才为 null。
          oneOf:
            - $ref: '#/components/schemas/BrowserOperationSummary'
            - type: 'null'
      allOf:
        - if:
            properties:
              state:
                const: Ready
            required: [state]
          then:
            properties:
              currentProfile:
                $ref: '#/components/schemas/BrowserProfileGenerationSummary'
    BrowserIdentityConfig:
      oneOf:
        - $ref: '#/components/schemas/BrowserIdentityCreate'
        - $ref: '#/components/schemas/BrowserIdentityUpdate'
      description: 创建形态无 expectedRowVersion；更新形态必须携带当前 BrowserIdentitySummary.rowVersion。
    BrowserIdentityCreate:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [name, startUrl, authenticationProbe]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 200
            startUrl:
              type: string
              format: uri
              pattern: '^https?://[^/?#]+'
            authenticationProbe:
              $ref: '#/components/schemas/AuthenticationProbeConfig'
      unevaluatedProperties: false
    BrowserIdentityUpdate:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/ExpectedRowVersion'
        - type: object
          required: [name, startUrl, authenticationProbe]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 200
            startUrl:
              type: string
              format: uri
              pattern: '^https?://[^/?#]+'
            authenticationProbe:
              $ref: '#/components/schemas/AuthenticationProbeConfig'
      unevaluatedProperties: false
    BrowserIdentityConfigResponse:
      type: object
      additionalProperties: false
      required: [identity, probeOperation]
      properties:
        identity:
          $ref: '#/components/schemas/BrowserIdentitySummary'
        probeOperation:
          oneOf:
            - $ref: '#/components/schemas/BrowserOperationSummary'
            - type: 'null'
          description: 已有 current profile 时为立即创建的 revision_change probe；尚无 profile 时为 null。
    StartBrowserManualLoginRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/ExpectedRowVersion'
      unevaluatedProperties: false
    PublishBrowserProfileRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [expectedOperationRowVersion]
          properties:
            expectedOperationRowVersion:
              type: integer
              minimum: 1
      unevaluatedProperties: false
    CancelBrowserOperationRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [expectedOperationRowVersion]
          properties:
            expectedOperationRowVersion:
              type: integer
              minimum: 1
      unevaluatedProperties: false
    BrowserProfilePublishResponse:
      type: object
      additionalProperties: false
      required: [identity, operation, generation]
      properties:
        identity:
          $ref: '#/components/schemas/BrowserIdentitySummary'
        operation:
          $ref: '#/components/schemas/BrowserOperationSummary'
        generation:
          $ref: '#/components/schemas/BrowserProfileGenerationSummary'
    LabelContractSummary:
      type: object
      required: [id, version, state, createdAt, rowVersion, parserVersion, schemaVersion]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
          description: Label Contract 版本记录的技术 locator；并发激活前提使用该 ID。
        version:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [draft, active, retired]
        rowVersion:
          type: integer
          minimum: 1
          description: 契约行并发前提（激活命令使用，HTTP-COMMAND-002）。
        parserVersion:
          type: string
        schemaVersion:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        activatedAt:
          $ref: '#/components/schemas/Timestamp'
      allOf:
        - if:
            properties:
              state:
                enum: [active, retired]
            required: [state]
          then:
            properties:
              activatedAt: {}
            required: [activatedAt]
          else:
            not:
              type: object
              properties:
                activatedAt: {}
              required: [activatedAt]
    LabelContractDetail:
      allOf:
        - $ref: '#/components/schemas/LabelContractSummary'
        - type: object
          required: [yamlBody, contractJson, digest]
          properties:
            yamlBody:
              type: string
              description: 上传的 strict YAML 原文（可导出；运行只使用类型化 contractJson）。
            contractJson:
              type: object
              additionalProperties: true
              description: 解析一次的类型化投影（形状由 contracts/schemas/label-contract.schema.json 唯一拥有）。
            digest:
              type: string
              pattern: '^[0-9a-f]{64}$'
    ActivateLabelContractRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [expectedStateRowVersion, expectedCurrentContractVersionId, expectedTargetRowVersion, compatibleVersions]
          properties:
            expectedStateRowVersion:
              type: integer
              minimum: 1
              description: label_contract_state 单行聚合的并发前提（DATA-CONFIG-006）；陈旧值 409（current_pointer_conflict），防止并发激活基于同一旧 current 静默互相覆盖。
            expectedCurrentContractVersionId:
              $ref: '#/components/schemas/NullableLocatorId'
              description: 当前激活契约版本；无已激活契约时显式 null；与 label_contract_state.current_contract_id 不匹配返回 409。
            expectedTargetRowVersion:
              type: integer
              minimum: 1
              description: 目标契约草稿行（label_contracts.row_version）的并发前提；陈旧值 409（row_version_conflict）。
            compatibleVersions:
              type: array
              description: 启用业务系统的兼容目标配置版本与逐系统并发前提；零启用系统时必须为空数组；全部就绪才原子激活（DATA-CONFIG-002）。
              items:
                type: object
                required: [businessSystemKey, configVersionId, testRunId, expectedCurrentConfigVersionId, expectedBusinessSystemRowVersion]
                additionalProperties: false
                properties:
                  businessSystemKey:
                    $ref: '#/components/schemas/StableKey'
                  configVersionId:
                    $ref: '#/components/schemas/LocatorId'
                  testRunId:
                    $ref: '#/components/schemas/LocatorId'
                    description: 引用该 (businessSystemKey, configVersionId, target contract) 的 Passed 配置 Test Run；联合激活必须逐系统重验其状态、完整检查结果与归属，否则 409（DATA-CONFIG-002/007）。
                  expectedCurrentConfigVersionId:
                    $ref: '#/components/schemas/NullableLocatorId'
                    description: 该业务系统当前已发布配置版本并发前提；null 表示当前无已发布版本；不匹配返回 409（DATA-CONFIG-002）。
                  expectedBusinessSystemRowVersion:
                    type: integer
                    minimum: 1
                    description: 该业务系统行（business_systems.row_version）的并发前提；陈旧值 409。
      description: 多聚合并发前提（DATA-CONFIG-005/006）：state 单行聚合 + 目标草稿契约行 + 每个受影响系统的 current 配置与行版本，同一事务重验后原子切换（DATA-TX-007）；任一前提陈旧全部回滚。
    LabelContractReadiness:
      type: object
      required: [targetContractVersion, stateRowVersion, targetRowVersion, currentContractVersionId, systems]
      additionalProperties: false
      properties:
        targetContractVersion:
          type: integer
          minimum: 1
        stateRowVersion:
          type: integer
          minimum: 1
          description: label_contract_state.row_version；激活请求复制为 expectedStateRowVersion。
        targetRowVersion:
          type: integer
          minimum: 1
          description: 目标契约草稿 row_version；激活请求复制为 expectedTargetRowVersion。
        currentContractVersionId:
          $ref: '#/components/schemas/NullableLocatorId'
        systems:
          type: array
          items:
            $ref: '#/components/schemas/LabelContractReadinessSystem'
    LabelContractReadinessSystem:
      type: object
      required: [businessSystemKey, currentConfigVersionId, businessSystemRowVersion, activationCandidates, blockers]
      additionalProperties: false
      properties:
        businessSystemKey:
          $ref: '#/components/schemas/StableKey'
        currentConfigVersionId:
          $ref: '#/components/schemas/NullableLocatorId'
          description: 当前已发布配置版本；激活请求复制为 expectedCurrentConfigVersionId。
        businessSystemRowVersion:
          type: integer
          minimum: 1
          description: business_systems.row_version；激活请求复制为 expectedBusinessSystemRowVersion。
        activationCandidates:
          type: array
          uniqueItems: true
          items:
            type: object
            required: [configVersionId, passedTestRunId]
            additionalProperties: false
            properties:
              configVersionId:
                $ref: '#/components/schemas/LocatorId'
              passedTestRunId:
                $ref: '#/components/schemas/LocatorId'
                description: 精确绑定该未发布配置版本与目标契约、状态为 Passed 的 Config Test Run；激活请求复制为 testRunId。
        blockers:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [no_compatible_version, test_run_missing, test_run_pending, test_run_failed, test_run_cancelled, test_run_interrupted]
      oneOf:
        - properties:
            activationCandidates:
              minItems: 1
            blockers:
              maxItems: 0
        - properties:
            activationCandidates:
              maxItems: 0
            blockers:
              minItems: 1
      description: activationCandidates 包含所有数据库实际可接受的显式候选对；blockers 仅在候选集合为空时存在。不得用“最新草稿”或“最新 Test Run”覆盖仍合法的旧候选。
    ConfigTestRunSummary:
      type: object
      required: [id, configVersionId, labelContractVersionId, state, rowVersion, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        configVersionId:
          $ref: '#/components/schemas/LocatorId'
        labelContractVersionId:
          $ref: '#/components/schemas/LocatorId'
        state:
          type: string
          enum: [Queued, Running, Passed, Failed, Cancelled, Interrupted]
        rowVersion:
          type: integer
          minimum: 1
        evidenceAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
      allOf:
        - if:
            properties:
              state:
                enum: [Queued]
            required: [state]
          then:
            not:
              type: object
              properties:
                evidenceAt: {}
              required: [evidenceAt]
        - if:
            properties:
              state:
                enum: [Running, Passed]
            required: [state]
          then:
            properties:
              evidenceAt: {}
            required: [evidenceAt]
    ConfigTestRunDetail:
      allOf:
        - $ref: '#/components/schemas/ConfigTestRunSummary'
        - type: object
          required: [checkResults]
          properties:
            checkResults:
              type: array
              items:
                $ref: '#/components/schemas/ConfigTestRunCheckResult'
            resultDetail:
              type: string
              description: Failed/Cancelled/Interrupted 的人类可读失败或中止原因（非秘密）。
        - if:
            properties:
              state:
                enum: [Failed, Cancelled, Interrupted]
            required: [state]
          then:
            properties:
              resultDetail: {}
            required: [resultDetail]
          else:
            not:
              type: object
              properties:
                resultDetail: {}
              required: [resultDetail]
    ConfigTestRunCheckResult:
      oneOf:
        - type: object
          required: [planKey, checkKey, status, evidenceId]
          additionalProperties: false
          properties:
            planKey:
              type: string
            checkKey:
              type: string
            status:
              const: ok
            evidenceId:
              $ref: '#/components/schemas/LocatorId'
        - type: object
          required: [planKey, checkKey, status, gapReason]
          additionalProperties: false
          properties:
            planKey:
              type: string
            checkKey:
              type: string
            status:
              type: string
              enum: [error, gap]
            gapReason:
              type: string
              enum: [runtime_unavailable, authentication_required, authentication_probe_unavailable, identity_busy, artifact_commit_failed, journey_failed, query_failed, partial_response, no_data, cancelled, interrupted]
      description: planKey+checkKey 精确定位绑定配置版本中的检查；ok 携带 Evidence locator，error/gap 携带缺口原因，两种联合不得混合（DATA-CONFIG-007）。
    JourneyCatalogView:
      type: object
      required: [version, digest, catalogJson]
      additionalProperties: false
      properties:
        version:
          type: string
        digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        catalogJson:
          type: object
          additionalProperties: true
          description: 嵌入的生成产物 catalog 文档；形状由 contracts/schemas/journey-catalog.schema.json 唯一拥有（DATA-CONFIG-008）。
    ConnectionSummary:
      oneOf:
        - $ref: '#/components/schemas/ThanosConnectionSummary'
        - $ref: '#/components/schemas/KubernetesConnectionSummary'
        - $ref: '#/components/schemas/ModelProviderConnectionSummary'
      description: 连接响应按 type 封闭：外层 type 与 config 变体由同一对象强制一致，客户端不会读到相互矛盾的 type/config 组合（HTTP-COMMAND-010）。
    ThanosConnectionSummary:
      type: object
      required: [name, type, enabled, rowVersion, config]
      properties:
        name:
          $ref: '#/components/schemas/StableKey'
        type:
          type: string
          const: thanos
        enabled:
          type: boolean
        rowVersion:
          type: integer
          minimum: 1
          description: 连接行并发前提（enable/disable/rotate 命令使用，HTTP-COMMAND-002）。
        revalidationRequired:
          type: boolean
        currentRevisionId:
          $ref: '#/components/schemas/LocatorId'
        currentCredentialGenerationId:
          $ref: '#/components/schemas/LocatorId'
        config:
          $ref: '#/components/schemas/ThanosConnectionNonSecret'
    KubernetesConnectionSummary:
      type: object
      required: [name, type, enabled, rowVersion, config]
      properties:
        name:
          $ref: '#/components/schemas/StableKey'
        type:
          type: string
          const: kubernetes
        enabled:
          type: boolean
        rowVersion:
          type: integer
          minimum: 1
        revalidationRequired:
          type: boolean
        currentRevisionId:
          $ref: '#/components/schemas/LocatorId'
        currentCredentialGenerationId:
          $ref: '#/components/schemas/LocatorId'
        config:
          $ref: '#/components/schemas/KubernetesConnectionNonSecret'
    ModelProviderConnectionSummary:
      type: object
      required: [name, type, enabled, rowVersion, config]
      properties:
        name:
          $ref: '#/components/schemas/StableKey'
        type:
          type: string
          const: model_provider
        enabled:
          type: boolean
        rowVersion:
          type: integer
          minimum: 1
        revalidationRequired:
          type: boolean
        currentRevisionId:
          $ref: '#/components/schemas/LocatorId'
        currentCredentialGenerationId:
          $ref: '#/components/schemas/LocatorId'
        config:
          $ref: '#/components/schemas/ModelProviderConnectionNonSecret'
        capability:
          $ref: '#/components/schemas/ModelProviderCapabilitySummary'
          description: 仅当 current revision/generation 已完成真实 probe 时存在；缺失表示未验证且不可启用。
    ModelProviderCapabilitySummary:
      type: object
      additionalProperties: false
      required: [probeAttemptId, chatModelId, embeddingModelId, supportsStreaming, supportsNativeTools, supportsParallelToolCalls, supportsCancel, supportsUsage, supportsRequestId, supportsEmbeddings, contextBudgetTokens, maxOutputTokens, testedAt]
      properties:
        probeAttemptId:
          $ref: '#/components/schemas/LocatorId'
        chatModelId:
          type: string
        embeddingModelId:
          type: string
        supportsStreaming:
          type: boolean
        supportsNativeTools:
          type: boolean
        supportsParallelToolCalls:
          type: boolean
        supportsCancel:
          type: boolean
        supportsUsage:
          type: boolean
        supportsRequestId:
          type: boolean
        contextBudgetTokens:
          type: integer
          minimum: 1
        maxOutputTokens:
          type: integer
          minimum: 1
        supportsEmbeddings:
          type: boolean
        embeddingDimensions:
          type: integer
          minimum: 1
        testedAt:
          $ref: '#/components/schemas/Timestamp'
      allOf:
        - if:
            properties:
              supportsEmbeddings:
                const: true
          then:
            properties:
              embeddingDimensions: {}
            required: [embeddingDimensions]
          else:
            properties:
              embeddingDimensions: false
    ConnectionDetail:
      allOf:
        - $ref: '#/components/schemas/ConnectionSummary'
        - type: object
          required: [revisionCount, generationCount]
          properties:
            revisionCount:
              type: integer
              minimum: 0
              description: revision 总数；历史经 listConnectionRevisions 游标分页读取（HTTP-PAGE-005）。
            generationCount:
              type: integer
              minimum: 0
              description: generation 总数；历史经 listCredentialGenerations 游标分页读取（HTTP-PAGE-005）。
    RevisionSummary:
      type: object
      required: [id, revisionSeq, config, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        revisionSeq:
          type: integer
          minimum: 1
        config:
          oneOf:
            - $ref: '#/components/schemas/ThanosConnectionNonSecret'
            - $ref: '#/components/schemas/KubernetesConnectionNonSecret'
            - $ref: '#/components/schemas/ModelProviderConnectionNonSecret'
          description: 该 revision 的服务端生成类型化非秘密投影（DATA-CONN-005）；不得包含秘密。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    GenerationSummary:
      type: object
      required: [id, generationSeq, createdAt]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        generationSeq:
          type: integer
          minimum: 1
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        createdBy:
          $ref: '#/components/schemas/LocatorId'
          description: 创建者用户 locator（可选，非秘密）。
      description: 凭据 generation 的非秘密标识投影；密文与内部元数据永不下发、永不返回（DATA-CONN-001/004）。
    ThanosConnectionNonSecret:
      type: object
      required: [type, baseUrl]
      additionalProperties: false
      properties:
        type:
          type: string
          const: thanos
        baseUrl:
          type: string
          format: uri
          description: Thanos Query 入口 URL（实现 Prometheus HTTP v1 API）。
        tlsCaPem:
          type: string
          description: 自定义 CA 的 PEM 正文（非秘密）。
        tlsServerName:
          type: string
          description: TLS ServerName 覆盖（非秘密）。
        tlsSkipVerify:
          type: boolean
          description: 跳过 TLS 校验（仅 Admin 明确接受风险时设置；非秘密）。
        username:
          type: string
          description: HTTP Basic Auth 用户名（非秘密）。
    KubernetesConnectionNonSecret:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          const: kubernetes
        contextName:
          type: string
          description: kubeconfig 中使用的 context 名（非秘密；缺省使用当前 context）。
        defaultNamespace:
          type: string
          description: 只读调查的默认命名空间（非秘密）。
    ModelProviderConnectionNonSecret:
      type: object
      required: [type, baseUrl, chatModelId, embeddingModelId]
      additionalProperties: false
      properties:
        type:
          type: string
          const: model_provider
        baseUrl:
          type: string
          format: uri
          description: OpenAI-compatible endpoint 基 URL。
        chatModelId:
          type: string
          description: 对话模型 ID（必须存在于 GET /v1/models；能力经 ConnectionRevision 实测）。
        embeddingModelId:
          type: string
          description: 嵌入模型 ID；能力与向量维度经真实 probe 实测。
        contextBudgetTokens:
          type: integer
          minimum: 1
          description: 优先由 provider metadata 自动发现；metadata 不足时由 Admin 补充，并由 probe 验证可工作。
        maxOutputTokens:
          type: integer
          minimum: 1
          description: 优先由 provider metadata 自动发现；metadata 不足时由 Admin 补充。
    ThanosConnectionInput:
      type: object
      required: [type, baseUrl]
      additionalProperties: false
      properties:
        type:
          type: string
          const: thanos
        baseUrl:
          type: string
          format: uri
        tlsCaPem:
          type: string
        tlsServerName:
          type: string
        tlsSkipVerify:
          type: boolean
        username:
          type: string
        password:
          type: string
          description: HTTP Basic Auth 密码（秘密；仅请求内存，服务端加密为 CredentialGeneration 后丢弃，DATA-CONN-004）。
    KubernetesConnectionInput:
      type: object
      required: [type, kubeconfig]
      additionalProperties: false
      properties:
        type:
          type: string
          const: kubernetes
        contextName:
          type: string
        defaultNamespace:
          type: string
        kubeconfig:
          type: string
          description: kubeconfig 正文（秘密；仅请求内存，服务端加密为 CredentialGeneration 后丢弃）。
    ModelProviderConnectionInput:
      type: object
      required: [type, baseUrl, chatModelId, embeddingModelId]
      additionalProperties: false
      properties:
        type:
          type: string
          const: model_provider
        baseUrl:
          type: string
          format: uri
        chatModelId:
          type: string
        embeddingModelId:
          type: string
        contextBudgetTokens:
          type: integer
          minimum: 1
        maxOutputTokens:
          type: integer
          minimum: 1
        apiKey:
          type: string
          description: API key（秘密；仅请求内存，服务端加密为 CredentialGeneration 后丢弃）。
    ConnectionInput:
      oneOf:
        - $ref: '#/components/schemas/ThanosConnectionInput'
        - $ref: '#/components/schemas/KubernetesConnectionInput'
        - $ref: '#/components/schemas/ModelProviderConnectionInput'
      description: "按 type 封闭的判别联合（additionalProperties 为 false）：非秘密配置字段与秘密字段在同一变体内声明，未知字段与跨类型字段被拒绝（DATA-CONN-005）。"
    CreateConnectionRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [name, connection]
          properties:
            name:
              $ref: '#/components/schemas/StableKey'
            connection:
              $ref: '#/components/schemas/ConnectionInput'
    RotateConnectionRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/ExpectedRowVersion'
        - type: object
          required: [connection]
          properties:
            connection:
              $ref: '#/components/schemas/ConnectionInput'
              description: 新 revision/generation 的完整配置；expectedRowVersion 取当前 ConnectionSummary.rowVersion。
    AlertSourceSummary:
      type: object
      required: [key, protocol, enabled, createdAt, rowVersion]
      properties:
        key:
          $ref: '#/components/schemas/StableKey'
        protocol:
          type: string
          enum: [alertmanager]
        enabled:
          type: boolean
        rowVersion:
          type: integer
          minimum: 1
          description: 来源行并发前提（enable/disable 命令使用，HTTP-COMMAND-002）。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        disabledAt:
          $ref: '#/components/schemas/Timestamp'
    AlertSourceDetail:
      allOf:
        - $ref: '#/components/schemas/AlertSourceSummary'
        - type: object
          required: [credentialCount]
          properties:
            credentialCount:
              type: integer
              minimum: 0
              description: 凭据总数；历史经 listAlertSourceCredentials 游标分页读取（HTTP-PAGE-005）。
    CredentialSummary:
      type: object
      required: [id, state, rowVersion, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        state:
          type: string
          enum: [Active, Retired]
        rowVersion:
          type: integer
          minimum: 1
          description: 吊销命令并发前提与响应版本（DATA-ALERT-009）。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        retiredAt:
          $ref: '#/components/schemas/Timestamp'
    CreateAlertSourceRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [key, protocol]
          properties:
            key:
              $ref: '#/components/schemas/StableKey'
            protocol:
              type: string
              enum: [alertmanager]
    AlertSourceCredentialMetadata:
      type: object
      required: [sourceKey, credentialId, revealAvailable]
      properties:
        sourceKey:
          $ref: '#/components/schemas/StableKey'
        credentialId:
          $ref: '#/components/schemas/LocatorId'
        revealAvailable:
          type: boolean
          description: 仅首次实时响应为 true（同次请求创建/轮换后立即生成内存 revealHandle）；命令重放恒为 false（HTTP-COMMAND-008）。
        revealHandle:
          type: string
          description: 不透明、内存中短生命周期、单次使用的 reveal 句柄；仅 revealAvailable=true 时存在；不落盘（SQLite/日志/审计/Artifact/命令结果均禁止）（HTTP-COMMAND-008）。
      allOf:
        - if:
            properties:
              revealAvailable:
                const: true
            required: [revealAvailable]
          then:
            properties:
              revealHandle: {}
            required: [revealHandle]
          else:
            properties:
              revealHandle: false
    RevealCredentialRequest:
      type: object
      required: [revealHandle]
      additionalProperties: false
      properties:
        revealHandle:
          type: string
          description: 创建/轮换命令首次实时响应返回的一次性句柄；不接受 source/credential ID（HTTP-COMMAND-008）。
    RevealCredentialResult:
      type: object
      required: [credentialId, bearerToken]
      properties:
        credentialId:
          $ref: '#/components/schemas/LocatorId'
        bearerToken:
          type: string
          description: 32-byte 高熵 Bearer；仅此一次返回；数据库只存 digest（CONTEXT「告警源凭据投影」）；不进入日志、审计或命令结果（HTTP-COMMAND-008）。
    RetireCredentialRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/ExpectedRowVersion'
    BackupSummary:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        status:
          type: string
          enum: [succeeded, failed]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        dbSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        manifestSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        artifactCount:
          type: integer
          minimum: 0
        errorDetail:
          type: string
    BackupSettings:
      type: object
      required: [enabled, timezone, retentionCount, rowVersion]
      properties:
        enabled:
          type: boolean
        scheduleCron:
          type: string
          description: 缺省表示仅手动触发。
        timezone:
          type: string
        retentionCount:
          type: integer
          minimum: 1
        rowVersion:
          type: integer
          minimum: 1
          description: 设置行并发前提（updateBackupSettings 使用，HTTP-COMMAND-002）。
    BackupSettingsUpdate:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/ExpectedRowVersion'
        - type: object
          properties:
            enabled:
              type: boolean
            scheduleCron:
              type: [string, 'null']
              description: null 表示清除定时（仅手动触发）。
            timezone:
              type: string
            retentionCount:
              type: integer
              minimum: 1
          anyOf:
            - required: [enabled]
            - required: [scheduleCron]
            - required: [timezone]
            - required: [retentionCount]
      description: 至少提供一个设置字段（anyOf 强制），防止无变化更新；expectedRowVersion 取当前 BackupSettings.rowVersion。
    ArtifactSummary:
      type: object
      required: [id, kind, sensitive, retentionKind, ownerType, ownerId, sizeBytes, sha256, bodyExpired, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        kind:
          type: string
          enum: [attachment, screenshot, trace, tool_result, report_file]
        sensitive:
          type: boolean
        retentionKind:
          type: string
          enum: [long_term, generated]
        ownerType:
          type: string
          enum: [investigation_message, evidence, tool_call, browser_operation, inspection_report, backup, source_material]
          description: 逻辑所有者类型；与 ownerId 的权威表由 DATA-ARTIFACT-003 机械闭合。
        ownerId:
          $ref: '#/components/schemas/LocatorId'
        sizeBytes:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        bodyExpired:
          type: boolean
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    SourceMaterialSummary:
      type: object
      required: [id, kind, digest, sizeBytes, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        kind:
          type: string
          enum: [text_attachment, knowledge_import]
        digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        sizeBytes:
          type: integer
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    UnviewedNotification:
      type: object
      required: [objectType, objectId]
      properties:
        objectType:
          type: string
          enum: [initial_analysis, investigation, inspection_run, knowledge_import_batch]
        objectId:
          $ref: '#/components/schemas/LocatorId'
        state:
          type: string
          description: 权威对象当前终态（显示用）。
    MarkViewedRequest:
      type: object
      required: [objectType, objectId]
      properties:
        objectType:
          type: string
          enum: [initial_analysis, investigation, inspection_run, knowledge_import_batch]
        objectId:
          $ref: '#/components/schemas/LocatorId'
    AuditEventSummary:
      type: object
      required: [id, actorType, actorId, action, outcome, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        actorType:
          type: string
          enum: [user, service, system]
        actorId:
          $ref: '#/components/schemas/LocatorId'
        action:
          type: string
        outcome:
          type: string
          enum: [success, failure, rejected, unknown]
        clientCommandId:
          type: string
        domainRefType:
          type: string
        domainRefId:
          $ref: '#/components/schemas/LocatorId'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    AlertChangeEvent:
      type: object
      required: [seq, type, occurrenceId, rowVersion]
      properties:
        seq:
          $ref: '#/components/schemas/ChangeSeq'
          description: "alert_change_seq（与 SSE id: 行一致）；事件中恒 ≥1。"
        type:
          type: string
          enum: [created, state_changed]
        occurrenceId:
          $ref: '#/components/schemas/LocatorId'
        rowVersion:
          type: integer
          minimum: 1
    TaskChangeEvent:
      type: object
      required: [seq, objectType, objectId, changeType, rowVersion]
      properties:
        seq:
          $ref: '#/components/schemas/ChangeSeq'
          description: "task_change_seq（与 SSE id: 行一致）；事件中恒 ≥1。"
        objectType:
          type: string
          enum: [initial_analysis, execution_attempt, inspection_run, inspection_report, tool_call, knowledge_import_batch, knowledge_candidate, browser_operation, config_test_run]
        objectId:
          $ref: '#/components/schemas/LocatorId'
        changeType:
          type: string
          enum: [created, state_changed]
        rowVersion:
          type: integer
          minimum: 1
    ResyncRequiredEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: resync_required