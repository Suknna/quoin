    post:
      tags: [config]
      operationId: uploadBusinessSystemConfig
      x-external-dependency: true
      summary: 上传业务系统 YAML（multipart 流式；只解析一次并保存草稿）
      description: YAML 根 system_key 是唯一系统身份；首次上传原子创建同 key 的 Disabled 系统与第一份不可变草稿，后续上传为同系统追加草稿，路径不重复传递系统身份。解析一次保存原文/parser/schema 版本/digest/类型结构（根 system_key/display_name/enabled/timezone/resource_refresh_interval_seconds 与 discovery/plan/check 类型化投影，DATA-CONFIG-003）。strict 单文档 YAML：未知字段、重复 key、anchor/alias/merge、自定义 tag、非字符串字段名、第二文档、尾随内容必须拒绝（CFG-YAML-002）。PromQL 表达式与 discovery selector 必须通过 Prometheus 官方 AST 校验（每个 VectorSelector 必须以目标 Label Contract 的业务系统 label 精确 = YAML system_key；discovery 必须是单个 instant vector selector，禁止 offset/@/聚合/label_replace，CFG-PROMQL-001/002）；browser check 的 journey_id 与 journey_params 必须通过嵌入 Journey Catalog 的封闭 params_schema 静态校验（CFG-JOURNEY-003）。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, clientCommandId, targetLabelContractVersion]
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: 单个 UTF-8 YAML 文档。
                clientCommandId:
                  type: string
                  minLength: 8
                  maxLength: 128
                  pattern: '^[A-Za-z0-9_-]+$'
                  description: 客户端生成的幂等命令 ID（HTTP-COMMAND-001）；内容 hash 相同仍按命令键去重。
