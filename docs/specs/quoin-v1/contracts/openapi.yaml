  responses:
    BadRequest:
      description: 请求语法错误（400）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    Unauthorized:
      description: 未认证或 Session 无效（401）；统一失败信息，不区分用户不存在/密码错误/禁用。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    Forbidden:
      description: 权限不足或受限 Session（403）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    NotFound:
      description: 资源不存在（404）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    Conflict:
      description: 版本/幂等/active 冲突（409）；冲突信息包含当前对象与版本（HTTP-ERROR-004）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ConflictErrorModel'
    Gone:
      description: 资源已过期或回放游标不再可用（410）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    PayloadTooLarge:
      description: 超过请求体/文件大小上限（413）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    UnsupportedMedia:
      description: 不支持的媒体类型（415）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    Unprocessable:
      description: 语法有效但领域/校验失败（422）；field_errors 逐项给出路径、原因与修复提示。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    RateLimited:
      description: 部署级速率限制（429）。
      headers:
        Retry-After:
          description: 重试等待时间（HTTP 日期或延迟秒数；HTTP-ERROR-006）。
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    ServiceUnavailable:
      description: 服务不可用/维护中（503）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
  schemas:
    PluginInspectionScope:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - kind
        properties:
          kind:
            const: integration
            type: string
      - type: object
        additionalProperties: false
        required:
        - kind
        - businessViewKey
        properties:
          kind:
            const: businessView
            type: string
          businessViewKey:
            $ref: '#/components/schemas/StableKey'
      - type: object
        additionalProperties: false
        required:
        - kind
        - objects
        properties:
          kind:
            const: objects
            type: string
          objects:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required:
              - objectType
              - identityKey
              properties:
                objectType:
                  type: string
                identityKey:
                  type: string
    PluginInspectionPlan:
      type: object
      required:
      - planKey
      - displayName
      - enabled
      - connectionName
      - pluginId
      - templateId
      - params
      - scope
      - timezone
      - rowVersion
      - createdAt
      - updatedAt
      properties:
        planKey:
          $ref: '#/components/schemas/StableKey'
        displayName:
          type: string
        enabled:
          type: boolean
        connectionName:
          type: string
        pluginId:
          type: string
        templateId:
          type: string
        templateVersion:
          type:
          - string
          - 'null'
        params:
          type: object
          additionalProperties: true
        checkDescription:
          description: 检查说明（可选）；Run 创建时冻结，计划修改不改写已存在 Run。
          type: [string, 'null']
          maxLength: 2000
        metricUnit:
          description: 指标单位（可选）；Run 创建时冻结。
          type: [string, 'null']
          maxLength: 100
        reportInstructions:
          description: 初始报告要求（可选，用户级）；Run 创建时冻结，重分析默认沿用。
          type: [string, 'null']
          maxLength: 4000
        scope:
          $ref: '#/components/schemas/PluginInspectionScope'
        cron:
          type:
          - string
          - 'null'
        timezone:
          type: string
        rowVersion:
          type: integer
          minimum: 1
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    BusinessView:
      type: object
      required:
      - viewKey
      - displayName
      - description
      - scope
      - rowVersion
      - createdAt
      - updatedAt
      properties:
        viewKey:
          $ref: '#/components/schemas/StableKey'
        displayName:
          type: string
        description:
          type: string
        scope:
          type: object
          additionalProperties: false
          required:
          - labelConditions
          properties:
            connectionName:
              type: string
            labelConditions:
              type: object
              additionalProperties:
                type: string
            alertSourceKeys:
              type: array
              description: 显式参与告警归属的 Alertmanager 告警源 key（ADR-0008）；空/缺省 = 不参与告警归属，与 connection 身份互不顶替。
              items:
                $ref: '#/components/schemas/StableKey'
        rowVersion:
          type: integer
          minimum: 1
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    PluginInspectionPlanInput:
      type: object
      additionalProperties: false
      required:
      - planKey
      - displayName
      - enabled
      - connectionName
      - pluginId
      - templateId
      - params
      - scope
      - timezone
      - clientCommandId
      properties:
        planKey:
          $ref: '#/components/schemas/StableKey'
        displayName:
          type: string
        enabled:
          type: boolean
        connectionName:
          type: string
        pluginId:
          type: string
        templateId:
          type: string
        templateVersion:
          type:
          - string
          - 'null'
        params:
          type: object
          additionalProperties: true
        checkDescription:
          type: [string, 'null']
          maxLength: 2000
        metricUnit:
          type: [string, 'null']
          maxLength: 100
        reportInstructions:
          type: [string, 'null']
          maxLength: 4000
        scope:
          $ref: '#/components/schemas/PluginInspectionScope'
        cron:
          type:
          - string
          - 'null'
        timezone:
          type: string
        clientCommandId:
          type: string
          minLength: 8
          maxLength: 128
        expectedRowVersion:
          type: integer
          minimum: 1
    BusinessViewInput:
      type: object
      additionalProperties: false
      required:
      - viewKey
      - displayName
      - description
      - scope
      - clientCommandId
      properties:
        viewKey:
          $ref: '#/components/schemas/StableKey'
        displayName:
          type: string
        description:
          type: string
        scope:
          type: object
          additionalProperties: false
          required:
          - labelConditions
          properties:
            connectionName:
              type: string
            labelConditions:
              type: object
              additionalProperties:
                type: string
            alertSourceKeys:
              type: array
              description: 显式参与告警归属的 Alertmanager 告警源 key（ADR-0008）；非空时必须至少一个标签条件。
              items:
                $ref: '#/components/schemas/StableKey'
        clientCommandId:
          type: string
          minLength: 8
          maxLength: 128
        expectedRowVersion:
          type: integer
          minimum: 1
    UpdateBusinessViewRequest:
      type: object
      additionalProperties: false
      description: 更新业务视图的可变字段与并发前提；viewKey 由路径唯一携带，不在此重复。
      required:
      - displayName
      - description
      - scope
      - clientCommandId
      - expectedRowVersion
      properties:
        displayName:
          type: string
        description:
          type: string
        scope:
          type: object
          additionalProperties: false
          required:
          - labelConditions
          properties:
            connectionName:
              type: string
            labelConditions:
              type: object
              additionalProperties:
                type: string
            alertSourceKeys:
              type: array
              description: 显式参与告警归属的 Alertmanager 告警源 key（ADR-0008）；非空时必须至少一个标签条件。
              items:
                $ref: '#/components/schemas/StableKey'
        clientCommandId:
          type: string
          minLength: 8
          maxLength: 128
        expectedRowVersion:
          type: integer
          minimum: 1
    EnrichmentRule:
      type: object
      required:
      - ruleKey
      - displayName
      - description
      - enabled
      - labelConditions
      - alertSourceKeys
      - outputs
      - priority
      - rowVersion
      - createdAt
      - updatedAt
      properties:
        ruleKey:
          $ref: '#/components/schemas/StableKey'
          description: 退役不复用；不可改写、行不可删除（退役 = enabled=0）。
        displayName:
          type: string
        description:
          type: string
        enabled:
          type: boolean
          description: false = 规则停用（不参与首观测富化求值），即退役形态。
        labelConditions:
          type: object
          additionalProperties:
            type: string
          description: 精确 label=value 匹配条件（与业务视图同语义）；空对象 = 全局规则，命中一切。
        alertSourceKeys:
          type: array
          description: 规则适用的告警源 key（必须存在且启用）；空数组 = 不限来源。
          items:
            $ref: '#/components/schemas/StableKey'
        outputs:
          type: object
          additionalProperties:
            type: string
          description: 命中时叠加的富化字段；按规则 priority 升序叠加，后命中不覆盖已写字段。
        priority:
          type: integer
          minimum: 1
          description: 叠加序（升序先生效）；缺省 100。
        rowVersion:
          type: integer
          minimum: 1
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    EnrichmentRuleInput:
      type: object
      additionalProperties: false
      required:
      - ruleKey
      - displayName
      - description
      - enabled
      - labelConditions
      - outputs
      - clientCommandId
      properties:
        ruleKey:
          $ref: '#/components/schemas/StableKey'
        displayName:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        labelConditions:
          type: object
          additionalProperties:
            type: string
        alertSourceKeys:
          type: array
          description: 引用的告警源必须存在且启用；自动去重并按稳定序存储。
          items:
            $ref: '#/components/schemas/StableKey'
        outputs:
          type: object
          additionalProperties:
            type: string
          description: 至少一个字段，值为非空字符串。
        priority:
          type: integer
          minimum: 0
          description: 叠加序（升序先生效）；0 或缺省视为 100。
        clientCommandId:
          type: string
          minLength: 8
          maxLength: 128
    UpdateEnrichmentRuleRequest:
      type: object
      additionalProperties: false
      description: 更新富化规则的可变字段与并发前提；ruleKey 由路径唯一携带，不在此重复。
      required:
      - displayName
      - description
      - enabled
      - labelConditions
      - outputs
      - clientCommandId
      - expectedRowVersion
      properties:
        displayName:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        labelConditions:
          type: object
          additionalProperties:
            type: string
        alertSourceKeys:
          type: array
          description: 引用的告警源必须存在且启用；空数组 = 不限来源。
          items:
            $ref: '#/components/schemas/StableKey'
        outputs:
          type: object
          additionalProperties:
            type: string
          description: 至少一个字段，值为非空字符串。
        priority:
          type: integer
          minimum: 0
          description: 叠加序（升序先生效）；0 或缺省视为 100。
        clientCommandId:
          type: string
          minLength: 8
          maxLength: 128
        expectedRowVersion:
          type: integer
          minimum: 1
    LocatorId:
      type: string
      description: 64-bit 技术 locator 的十进制字符串表示（DATA-IDENT-002）；词法范围限定为有符号 64-bit 正整数 1..9223372036854775807（SQLite INTEGER / Go / Proto int64 上限），无前导零，超出 JS 安全整数仍必须按字符串处理。
      pattern: '^(([1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-7]))$'
      example: '9223372036854775807'
    NullableLocatorId:
      anyOf:
        - $ref: '#/components/schemas/LocatorId'
        - type: 'null'
      description: 可空 locator；null 表示“当前无该对象”（如新调查无 head、首次发布无当前已发布版本）。JSON Schema 2020-12 表达，不使用已废弃的 nullable 关键字。
    ChangeSeq:
      type: string
      description: 单调递增序列（alert_change_log.id）的十进制字符串表示；"0" 表示日志为空，事件中的 seq 恒 ≥1；词法范围限定为有符号 64-bit 非负整数 0..9223372036854775807。超出 JS 安全整数仍必须按字符串处理（HTTP-SCOPE-002）。
      pattern: '^(0|([1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-7]))$'
      example: '0'
    StableKey:
      type: string
      minLength: 1
      maxLength: 200
      description: 用户维护的稳定 key（业务系统 key、连接名、告警源 key 等）。
    Cursor:
      type: string
      description: 不透明分页游标；绑定过滤器与排序（跨排序/过滤变化无效，HTTP-PAGE-001）。快照列表（listAlerts/getTaskSnapshot）的游标额外绑定首页 snapshotSeq、由服务端签名并带短有效期，过期返回 410（resource_expired），客户端重新从首页读取（HTTP-PAGE-006）。
    Timestamp:
      type: string
      format: date-time
      description: RFC3339 UTC 时间（如 2026-08-13T02:00:00.123456789Z）。
    CommandBase:
      type: object
      required: [clientCommandId]
      properties:
        clientCommandId:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
          description: 客户端生成、用户不可见的幂等命令 ID；按 (principal, client_command_id) 唯一（HTTP-COMMAND-001）。
    ExpectedRowVersion:
      type: object
      required: [expectedRowVersion]
      properties:
        expectedRowVersion:
          type: integer
          minimum: 1
          description: 修改当前状态/current 指针命令的并发前提；包含在请求摘要中（HTTP-COMMAND-002）。
    CommandRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
    VersionedCommandRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/ExpectedRowVersion'
      description: 修改当前状态/current 指针但非取消语义的领域命令（HTTP-COMMAND-002）。
    EnableConnectionRequest:
      allOf:
        - $ref: '#/components/schemas/VersionedCommandRequest'
        - type: object
          properties:
            qualifiedProbeResultId:
              $ref: '#/components/schemas/LocatorId'
      description: model_provider 必须显式提供同 current binding 的 passed probe result；其它连接类型必须省略该字段。
    CancelRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/ExpectedRowVersion'
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 200
        password:
          type: string
          minLength: 1
          maxLength: 512
          description: |
            接受正式密码（15–512 Unicode 字符，NFC 规范化后校验策略）与内置管理员的
            公共默认密码（仅在其未初始化时验证，永不满足正式策略）；登录不重跑
            blocklist，失败由 Quoin 有界进程内冷却状态裁决。
    LoginResponse:
      type: object
      required: [completed, user]
      description: 单步本地登录结果（ADR-0010）；密码校验与受限会话语义见 POST /auth/login。
      properties:
        completed:
          type: boolean
          description: 单步登录恒为 true；保留字段以与旧两步协议区分。
        user:
          $ref: '#/components/schemas/UserSummary'
    AuthConfig:
      type: object
      required: [local, oidc]
      description: 登录页配置驱动渲染的公开投影（ADR-0010）；不含任何敏感配置。
      properties:
        local:
          type: object
          required: [enabled, visible]
          properties:
            enabled:
              type: boolean
              description: 本地应急通道是否可用。
            visible:
              type: boolean
              description: 登录页是否渲染本地表单；false 时 /login?local=1 与 POST 接口仍可用。
        oidc:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
            label:
              type: string
              description: SSO 按钮显示名；缺省用 issuer 主机名。
            iconUrl:
              type: string
              description: SSO 按钮图标 URL；可选。
    UserSummary:
      type: object
      required: [id, username, displayName, role, enabled, initialized, authRevision, rowVersion, passwordChangeRequired, lastLoginAt]
      properties:
        authSource:
          type: string
          enum: [local, oidc]
          description: 登录来源——本地（应急通道）或外部 OIDC（identities 行派生，ADR-0010）。
        id:
          $ref: '#/components/schemas/LocatorId'
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, operator]
        enabled:
          type: boolean
        initialized:
          type: boolean
          description: 初始化是否完成；未初始化用户只能进入对应初始化流程，不能登录。
        authRevision:
          type: integer
          minimum: 1
          description: 账号变更裁决依据（DATA-TX-002）；与 rowVersion 相互独立：authRevision 由账号变更事务递增，rowVersion 由任何用户行 UPDATE 恰好递增 1。
        rowVersion:
          type: integer
          minimum: 1
          description: 用户行并发前提（HTTP-COMMAND-002）；与 authRevision 独立，任何 UPDATE 恰好递增 1（DATA-AUTH-004）。
        passwordChangeRequired:
          type: boolean
          description: 受限 Session 依据（DATA-AUTH-001/002）。
        lastLoginAt:
          type: [string, 'null']
          format: date-time
          description: 从该用户 Session 的最大 created_at 机械派生；从未登录为 null，不建立第二份登录事实（UI-ADMIN-003）。
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 15
          maxLength: 128
        newPassword:
          type: string
          minLength: 15
          maxLength: 128
          description: 15–128 Unicode 字符；NFC 后执行嵌入 blocklist 与上下文比较；成功改密在同一事务清除强制改密标志并撤销其他 Session。
    SessionInfo:
      type: object
      required: [id, clientLabel, createdAt, lastActiveAt, idleExpiresAt, absoluteExpiresAt, current]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        clientLabel:
          type: string
          minLength: 1
          maxLength: 200
          description: 登录时由服务端从 User-Agent 机械归一的设备/浏览器摘要；不返回原始 User-Agent（UI-AUTH-004）。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastActiveAt:
          $ref: '#/components/schemas/Timestamp'
        idleExpiresAt:
          $ref: '#/components/schemas/Timestamp'
        absoluteExpiresAt:
          $ref: '#/components/schemas/Timestamp'
        current:
          type: boolean
          description: 是否为当前请求使用的 Session。
    CreateUserRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [username, displayName, password, contacts]
          properties:
            username:
              type: string
              maxLength: 200
            displayName:
              type: string
              maxLength: 200
            role:
              type: string
              enum: [operator]
              description: 只能创建 Operator；不存在经创建路径的角色提升，Admin 由部署引导产生。
            password:
              type: string
              minLength: 15
              maxLength: 128
              description: 15–128 Unicode 字符；NFC 后执行嵌入 blocklist 与上下文比较。
            contacts:
              type: array
              minItems: 1
              maxItems: 2
              items:
                $ref: '#/components/schemas/ContactInput'
              description: 创建时必须登记一到两个收码渠道；未配置可验证渠道的用户无法完成初始化。
    UpdateUserRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/ExpectedRowVersion'
        - type: object
          properties:
            displayName:
              type: string
              maxLength: 200
            enabled:
              type: boolean
          anyOf:
            - required: [displayName]
            - required: [enabled]
      description: |
        至少提供一个变更字段（anyOf 强制）；expectedRowVersion 取当前
        UserSummary.rowVersion（与 authRevision 独立）。角色不可变更——唯一管理员
        模型下 Operator 永不提升，携带 role 一律 422；禁用唯一 Admin 冲突
        （DATA-TX-014）。
    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 15
          maxLength: 128
          description: 受保护请求中的临时密码秘密；NFC 后执行同一 blocklist/上下文策略，服务端不得回显或保存明文；重置后 password_change_required=1。
    ResetPasswordPayload:
      type: object
      required: [user, revokedSessionCount]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        revokedSessionCount:
          type: integer
          minimum: 0
          description: 本事务从有效变为撤销的 Session 数；所有旧 Session 即使并发请求已读到 bearer，也会因 authRevision 不匹配而认证失败。
    SessionRevocationPayload:
      type: object
      required: [revokedSessionCount]
      properties:
        revokedSessionCount:
          type: integer
          minimum: 0
          description: 本事务从有效变为撤销的 Session 数。
    AuthFlowContact:
      type: object
      required: [id, channel, maskedTarget, verified]
      description: 用户联系方式的唯一客户端可见形状（auth.MaskedContact）；ADR-0010 后仅作展示。
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        channel:
          type: string
          enum: [email, sms]
        maskedTarget:
          type: string
          description: 服务端掩码后的收码目标（如 a***@example.com / ****1234）；明文永不出服务器。
        verified:
          type: boolean
    VerifyFlowChallengeResult:
      type: object
      required: [completed]
      properties:
        completed:
          type: boolean
          description: login 流程验证成功即完成会话签发（true，附 user）；初始化/恢复流程只标记验证通过（false）。
        user:
          $ref: '#/components/schemas/UserSummary'
    ContactInput:
      type: object
      required: [channel, target]
      description: 一条管理员指派的收码目标（auth.ContactInput）。
      properties:
        channel:
          type: string
          enum: [email, sms]
        target:
          type: string
          description: email 需恰好一个 @ 且 3–320 字符；sms 为可选 + 前缀的 5–20 位数字。
    SetUserContactsRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/ExpectedRowVersion'
        - type: object
          required: [contacts]
          properties:
            contacts:
              type: array
              minItems: 1
              maxItems: 2
              items:
                $ref: '#/components/schemas/ContactInput'
      description: 供给完整的期望渠道集合（每渠道至多一个，重复渠道为 422）。
    ErrorModel:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: 稳定机器错误码（HTTP-ERROR-002）。
        message:
          type: string
          description: 面向人的普通语言错误说明（先说明影响与恢复方式，不暴露内部细节）。
        requestId:
          type: string
          description: 本次请求的关联 ID（供排查）。
        retryable:
          type: boolean
          description: 使用同一 client_command_id 重试是否安全（HTTP-ERROR-005）。
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    ConflictErrorModel:
      allOf:
        - $ref: '#/components/schemas/ErrorModel'
        - type: object
          required: [conflict]
          properties:
            conflict:
              oneOf:
                - $ref: '#/components/schemas/CommandIdReuseConflict'
                - $ref: '#/components/schemas/RowVersionConflict'
                - $ref: '#/components/schemas/HeadConflict'
                - $ref: '#/components/schemas/CurrentPointerConflict'
      description: 409 冲突响应的专用包络：conflict 块按 code 判别联合（HTTP-ERROR-004/007）。
    FieldError:
      type: object
      required: [path, reason]
      properties:
        path:
          type: string
          description: 字段路径（如 config.discoveries[0].identityLabels）。
        reason:
          type: string
        remediation:
          type: string
          description: 可操作修复提示。
    CommandIdReuseConflict:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          const: command_id_reused
          description: 相同 client_command_id 但不同请求摘要（HTTP-COMMAND-003）；纯追加命令可能无结果对象，因此不强制 objectType/objectId/版本字段。
        clientCommandId:
          type: string
          description: 冲突的命令 ID。
        objectType:
          type: string
          description: 原命令结果对象类型（无结果对象时省略）。
        objectId:
          $ref: '#/components/schemas/LocatorId'
        detail:
          type: string
          description: 人类可读冲突说明（HTTP-ERROR-004）。
    RowVersionConflict:
      type: object
      required: [code, objectType, objectId, rowVersion]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [row_version_conflict, active_conflict]
        objectType:
          type: string
        objectId:
          $ref: '#/components/schemas/LocatorId'
        rowVersion:
          type: integer
          description: 当前权威 row_version（供客户端重试回填）。
        detail:
          type: string
          description: 人类可读冲突说明（HTTP-ERROR-004）。
      description: 通用聚合 row_version/active 冲突。
    HeadConflict:
      type: object
      required: [code, objectType, objectId, headMessageId]
      additionalProperties: false
      properties:
        code:
          type: string
          const: head_conflict
        objectType:
          type: string
        objectId:
          $ref: '#/components/schemas/LocatorId'
        headMessageId:
          $ref: '#/components/schemas/NullableLocatorId'
          description: 当前 head 消息 locator；null 表示当前无 head（调查已撤回全部消息）。
        detail:
          type: string
          description: 人类可读冲突说明（HTTP-ERROR-004）。
    CurrentPointerConflict:
      type: object
      required: [code, objectType, objectId, currentVersionId]
      additionalProperties: false
      properties:
        code:
          type: string
          const: current_pointer_conflict
        objectType:
          type: string
        objectId:
          $ref: '#/components/schemas/LocatorId'
        currentVersionId:
          $ref: '#/components/schemas/NullableLocatorId'
          description: 当前已发布配置版本/当前激活契约 locator；null 表示当前无该指针目标（首次发布前）。
        detail:
          type: string
          description: 人类可读冲突说明（HTTP-ERROR-004）。
    MaintenanceState:
      type: object
      required: [active, reason, rowVersion, enteredAt, items]
      additionalProperties: false
      properties:
        active:
          type: boolean
        reason:
          type: [string, 'null']
          enum: [Restore, Upgrade, RootKeyRebind, null]
        rowVersion:
          type: integer
          minimum: 1
          description: maintenance_state.row_version；同时是当前清单 revision。active=true 时冻结，只有退出事务可推进。
        enteredAt:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceItem'
          description: 仅 active=true 时返回当前 revision 的非空清单；退出只接受全部 Safe。
      allOf:
        - if:
            properties:
              active:
                const: true
            required: [active]
          then:
            properties:
              reason:
                type: string
                enum: [Restore, Upgrade, RootKeyRebind]
              enteredAt:
                $ref: '#/components/schemas/Timestamp'
          else:
            properties:
              reason:
                type: 'null'
              enteredAt:
                type: 'null'
              items:
                maxItems: 0
    MaintenanceItem:
      type: object
      required: [kind, objectKey, safeState, detailCode]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [AdminPassword, User, Connection, AlertSource, ActiveAttempt, BackupPreflight, SchemaMigration, ReleaseVersion, Integrity, SearchProjection]
        objectKey:
          type: string
          minLength: 1
          maxLength: 256
        safeState:
          type: string
          enum: [Safe, Blocking]
        detailCode:
          type: string
          minLength: 1
          maxLength: 128
          description: 与 maintenance_items.detail_code 一致的稳定非秘密机器码。
        detail:
          type: string
          maxLength: 2000
        action:
          type: string
          maxLength: 512
          description: Blocking 项可直接前往的显式 trust-rebuild 操作；不得指向普通业务路由。
    ExitMaintenanceRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/VersionedCommandRequest'
        - type: object
          required: [expectedReason]
          properties:
            expectedReason:
              type: string
              enum: [Restore, Upgrade, RootKeyRebind]
      description: expectedRowVersion/expectedReason 必须与当前 active maintenance_state 一致；不存在 force/skip。
    RuntimeSlot:
      type: object
      required: [slot, connected]
      additionalProperties: false
      properties:
        slot:
          type: string
          enum: [plinth]
        connected:
          type: boolean
          description: 瞬时连接投影（内存，非持久权威）：控制流当前是否在线。组件身份是部署 CA 签发的 mTLS 客户端证书（ADR-0009），不存在注册状态。必填；false 时不携带 bootId/connectionEpoch/lastSeenAt。
        bootId:
          type: string
          description: 瞬时连接投影：当前控制流 Runtime boot ID（仅 connected=true 时存在）。
        connectionEpoch:
          type: integer
          minimum: 1
          description: 瞬时连接投影：当前控制流递增 connection epoch（仅 connected=true 时存在）。
        lastSeenAt:
          $ref: '#/components/schemas/Timestamp'
          description: 瞬时连接投影：最近一次心跳时间（仅 connected=true 时存在）。
        releaseVersion:
          type: string
          description: 瞬时连接投影：对端 Hello 携带的信息性构建版本，不参与准入。
    AlertSnapshot:
      type: object
      required: [snapshotSeq, items]
      properties:
        snapshotSeq:
          $ref: '#/components/schemas/ChangeSeq'
          description: 快照绑定的 alert_change_seq（首页取当前最大 alert_change_log.id；全部页回传同一值，DATA-SSE-009）；客户端以它建立 SSE（after），分页期间的变更经事件回放补齐（HTTP-PAGE-006）。
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertOccurrenceSummary'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
          description: 绑定首页 snapshotSeq 的短有效期快照游标（HTTP-PAGE-006）；过期返回 410。
    AdminAbout:
      type: object
      required: [releaseVersion, maintenance, components]
      properties:
        releaseVersion:
          type: string
        maintenance:
          type: object
          required: [active, rowVersion]
          properties:
            active: {type: boolean}
            reason: {type: string}
            rowVersion: {type: integer, minimum: 1}
        components:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeSlot'
    AlertOccurrenceSummary:
      type: object
      required: [id, source, state, rowVersion, severity, title, firstSeenAt, lastStateChangeAt, labels, correlations]
      properties:
        id:
          type: string
          description: Alertmanager occurrence locator or platform:<fault-id> identity.
        source:
          type: string
          enum: [alertmanager, platform]
        component:
          type: string
          enum: [plinth]
        reason:
          type: string
        state:
          type: string
          enum: [Firing, Resolved]
        rowVersion:
          type: integer
          minimum: 1
        severity:
          type: string
          enum: [critical, high, warning, info]
          description: 首观测经插件 AlertNormalizer 冻结的统一严重度（ADR-0012）；平台故障按故障类别在入库侧映射。缺失/解析失败降为 info 并记 normalizer_missing 接入问题。
        title:
          type: string
          description: 统一人面告警名（Alertmanager：labels.alertname）；平台故障为固定平台标题。缺省为空字符串。
        resource:
          type: string
          description: 受影响对象的最佳身份（Alertmanager：labels.instance，回退 labels.job）。
        firstSeenAt:
          $ref: '#/components/schemas/Timestamp'
        lastStateChangeAt:
          $ref: '#/components/schemas/Timestamp'
        resolvedAt:
          $ref: '#/components/schemas/Timestamp'
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
          description: 首观测冻结的规范化注释全量快照（ADR-0012 annotations_canonical）；平台故障为入库侧投影。
        correlations:
          type: array
          description: 首观测时冻结的全部命中视图证据（ADR-0012，多命中全记录，替代旧唯一归属状态机）；按 matched_at 稳定序，视图改名/退役后不漂移。
          items:
            $ref: '#/components/schemas/AlertCorrelation'
        enrichment:
          $ref: '#/components/schemas/AlertEnrichment'
          description: 首观测时冻结的富化投影（ADR-0012）；无规则命中时 fields 为空对象（与未求值区分），详情面额外携带 ruleKeys 溯源。
    AlertCorrelation:
      type: object
      additionalProperties: false
      required: [viewKey, displayName]
      properties:
        viewKey:
          $ref: '#/components/schemas/StableKey'
          description: 命中视图的冻结 key 快照。
        displayName:
          type: string
          description: 命中视图的冻结显示名快照。
    AlertEnrichment:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: object
          additionalProperties:
            type: string
          description: 按规则 priority 升序叠加、后命中不覆盖已写字段的富化终值。
        ruleKeys:
          type: array
          description: 命中规则的溯源 key 列表（求值序：priority 升序、同序按创建序）；仅详情面返回。
          items:
            type: string
    AlertOccurrenceDetail:
      allOf:
        - $ref: '#/components/schemas/AlertOccurrenceSummary'
        - type: object
          required: [observationCount, matchedResourceCount, initialAnalysisCount, investigationCount]
          properties:
            observationCount:
              type: integer
              minimum: 0
              description: 不可变观测总数；完整时间线经 listAlertObservations 游标读取。
            matchedResourceCount:
              type: integer
              minimum: 0
              description: 当前机械匹配候选总数；完整集合经 listAlertMatchedResources 游标读取，可为零个或多个。
            initialAnalysisCount:
              type: integer
              minimum: 0
              description: Initial Analysis 历史总数；经 listInitialAnalyses 游标读取。
            investigationCount:
              type: integer
              minimum: 0
              description: 关联调查总数；经 listOccurrenceInvestigations 游标读取。
    ObservationSummary:
      type: object
      required: [id, observedState, startsAt, receivedAt, committedAt, effect]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        observedState:
          type: string
          enum: [firing, resolved]
        startsAt:
          $ref: '#/components/schemas/Timestamp'
        endsAt:
          $ref: '#/components/schemas/Timestamp'
        receivedAt:
          $ref: '#/components/schemas/Timestamp'
        committedAt:
          $ref: '#/components/schemas/Timestamp'
        effect:
          type: string
          enum: [initial_firing, repeat_firing, resolved, resolved_first, late_firing_after_resolved]
    InitialAnalysisSummary:
      type: object
      required: [id, state, rowVersion, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        state:
          type: string
          enum: [Queued, Running, Succeeded, Failed, Cancelled, Interrupted]
        rowVersion:
          type: integer
          minimum: 1
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    InitialAnalysisDetail:
      allOf:
        - $ref: '#/components/schemas/InitialAnalysisSummary'
        - type: object
          required: [attemptCount]
          properties:
            attemptCount:
              type: integer
              minimum: 0
              description: 执行 Attempt 总数；完整历史经 listInitialAnalysisAttempts 游标读取。
            output:
              $ref: '#/components/schemas/AnalysisOutput'
    AnalysisOutput:
      type: object
      required: [id, modelId, content, evidenceIds, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        modelId:
          type: string
        content:
          type: string
        evidenceIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/LocatorId'
          description: 通过 initial_analysis_output_evidence 不可变关系按 Evidence locator 投影；每项可由 getEvidence 读取。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    AttemptSummary:
      type: object
      required: [id, type, state, rowVersion, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        type:
          type: string
          enum: [initial_analysis, investigation, inspection_analysis, inspection_collection, knowledge_extraction, embedding, connection_probe]
        state:
          type: string
          enum: [Queued, Assigned, Running, Cancelling, Succeeded, Failed, Cancelled, Interrupted]
        rowVersion:
          type: integer
          minimum: 1
        startedAt:
          $ref: '#/components/schemas/Timestamp'
        endedAt:
          $ref: '#/components/schemas/Timestamp'
        terminationReason:
          type: string
          enum: [context_too_large, timeout, rate_limited, provider_unavailable, invalid_response, tool_error, artifact_commit_failed, artifact_body_expired, sandbox_unavailable, worker_protocol_error, cancelled, connection_disabled, lease_expired, replaced, revoked]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ToolCallSummary:
      type: object
      additionalProperties: false
      required: [id, attemptId, modelCallId, callSeq, toolIndex, providerToolCallId, toolName, toolVersion, arguments, executionMode, failureMode, status, rowVersion, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        attemptId:
          $ref: '#/components/schemas/LocatorId'
        modelCallId:
          $ref: '#/components/schemas/LocatorId'
        callSeq:
          type: integer
          minimum: 1
        toolIndex:
          type: integer
          minimum: 0
        providerToolCallId:
          type: string
          minLength: 1
        toolName:
          type: string
          minLength: 1
        toolVersion:
          type: string
          minLength: 1
        arguments:
          type: object
          additionalProperties: true
          description: 已持久化 canonical Tool arguments 的 JSON 投影；只含非秘密领域 locator/参数。
        executionMode:
          type: string
          enum: [worker_local, supervisor_typed]
        failureMode:
          type: string
          enum: [return_to_model, fail_attempt]
        status:
          type: string
          enum: [pending, running, succeeded, failed, cancelled]
        rowVersion:
          type: integer
          minimum: 1
        result:
          description: 有界模型可见结果预览；JSON 结构由该 Tool definition 的 result schema 约束，通用时间线不建立第二份联合；完整正文只由 resultArtifactId 指向。
        resultArtifactId:
          $ref: '#/components/schemas/LocatorId'
        errorDetail:
          type: string
        startedAt:
          $ref: '#/components/schemas/Timestamp'
        endedAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    IntakeIssueFields:
      type: object
      dependentRequired:
        acknowledgedAt: [acknowledgedBy]
        acknowledgedBy: [acknowledgedAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        sourceId:
          $ref: '#/components/schemas/LocatorId'
        sourceKey:
          $ref: '#/components/schemas/StableKey'
          description: 告警源的人类稳定 key；列表不得以 sourceId 作为主要识别信息。
        kind:
          type: string
          enum: [identity_conflict, fingerprint_mismatch, delivery_truncated, normalizer_missing, credential_denied]
          description: normalizer_missing（ADR-0012）：来源协议无 AlertNormalizer 或归一化失败，首观测以缺省语义冻结；来源级问题，不指向具体条目。
        deliveryId:
          $ref: '#/components/schemas/LocatorId'
        deliveryItemId:
          $ref: '#/components/schemas/LocatorId'
        firstSeenAt:
          $ref: '#/components/schemas/Timestamp'
        lastSeenAt:
          $ref: '#/components/schemas/Timestamp'
        occurrenceCount:
          type: integer
          minimum: 1
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        acknowledgedAt:
          $ref: '#/components/schemas/Timestamp'
        acknowledgedBy:
          $ref: '#/components/schemas/LocatorId'
        rowVersion:
          type: integer
          minimum: 1
          description: 确认命令并发前提（DATA-ALERT-011）。
    IntakeIssueSummary:
      allOf:
        - $ref: '#/components/schemas/IntakeIssueFields'
      required: [id, sourceId, sourceKey, kind, firstSeenAt, lastSeenAt, occurrenceCount, rowVersion, createdAt]
      unevaluatedProperties: false
    InvestigationSourceInput:
      type: object
      additionalProperties: false
      required: [type, sourceId]
      properties:
        type:
          type: string
          enum: [occurrence, initial_analysis, evidence, inspection_report]
        sourceId:
          $ref: '#/components/schemas/LocatorId'
    InvestigationSourceSummary:
      type: object
      additionalProperties: false
      required: [id, type, sourceId, linkedAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        type:
          type: string
          enum: [occurrence, initial_analysis, evidence, inspection_report]
        sourceId:
          $ref: '#/components/schemas/LocatorId'
        linkedBy:
          $ref: '#/components/schemas/LocatorId'
        linkedAt:
          $ref: '#/components/schemas/Timestamp'
    CreateInvestigationRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/MessageContentInput'
        - type: object
          properties:
            sources:
              type: array
              maxItems: 100
              uniqueItems: true
              items:
                $ref: '#/components/schemas/InvestigationSourceInput'
              description: 从既有对象进入 Chat 时由前端自动携带；直接新建时省略或为空，不得要求用户预选。
    InvestigationSummary:
      type: object
      additionalProperties: false
      required: [id, displayTitle, lastActivityAt, createdAt, createdBy]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        displayTitle:
          type: string
          minLength: 1
          description: 服务端派生的人类标题；优先使用当前有效分支第一条用户消息的有界单行摘要，消息空白时才回退为不可变来源对象显示名或“新调查 + 创建时间”。前端不得自行建立第二套标题规则。
        lastActivityAt:
          $ref: '#/components/schemas/Timestamp'
          description: 当前有效分支最后消息提交时间与 Investigation-scope Attempt 最近持久化状态时间的机械最大值；空分支回退 Investigation 创建时间。用于 `(last_activity_at DESC, id DESC)` 键集排序（DATA-INVEST-005）。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        createdBy:
          $ref: '#/components/schemas/LocatorId'
        headMessageId:
          $ref: '#/components/schemas/LocatorId'
        activeAttemptId:
          $ref: '#/components/schemas/LocatorId'
    InvestigationDetail:
      allOf:
        - $ref: '#/components/schemas/InvestigationSummary'
        - type: object
          required: [messageCount, attemptCount, sources]
          properties:
            sources:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/InvestigationSourceSummary'
              description: 创建时从既有对象入口自动带入的不可变来源；直接新建时为空。
            messageCount:
              type: integer
              minimum: 0
              description: 当前调查的消息总数；历史经 listInvestigationMessages 游标分页读取（HTTP-PAGE-005）。
            attemptCount:
              type: integer
              minimum: 0
              description: 当前调查的执行尝试总数；历史经 listInvestigationAttempts 游标分页读取（HTTP-PAGE-005）。
    MessageSummary:
      type: object
      required: [id, seq, role, status, content, attachments, evidenceIds, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        seq:
          type: integer
          minimum: 1
        role:
          type: string
          enum: [user, assistant]
        status:
          type: string
          enum: [active, withdrawn]
        content:
          type: string
        parentMessageId:
          $ref: '#/components/schemas/LocatorId'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/TextAttachmentSummary'
          description: 按用户发送顺序列出消息引用的文本附件及稳定显示文件名；不设个数限制，单文件与合计大小由默认 10 MiB、部署可调的消息级边界限制。
        attemptId:
          $ref: '#/components/schemas/LocatorId'
        evidenceIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/LocatorId'
          description: 通过 investigation_message_evidence 不可变关系投影；user 消息为空数组，assistant 消息中的引用可由 getEvidence 读取。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    MessageContentInput:
      type: object
      properties:
        content:
          type: string
          maxLength: 262144
        attachmentIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/LocatorId'
          description: 先前上传的文本附件；创建首条消息前也可上传，同一不可变附件可被 Undo 后的新消息复用；单文件与合计大小由默认 10 MiB、部署可调的消息级边界限制。
      anyOf:
        - required: [content]
          properties:
            content:
              minLength: 1
        - required: [attachmentIds]
          properties:
            attachmentIds:
              minItems: 1
      description: 消息必须包含非空正文或至少一个附件；允许附件消息正文为空。
    SendMessageRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/MessageContentInput'
        - type: object
          required: [expectedHeadMessageId]
          properties:
            expectedHeadMessageId:
              $ref: '#/components/schemas/NullableLocatorId'
              description: 当前 head locator（DATA-INVEST-001）；Undo 撤回全部消息后可为 null，其余情况必须与当前 head 一致；head 已变化返回 409。
            sources:
              type: array
              maxItems: 100
              uniqueItems: true
              items:
                $ref: '#/components/schemas/InvestigationSourceInput'
              description: ADR-0012「+ 引入告警」：随消息追加的告警来源（幂等——已链接的来源忽略）；新来源并入下一次模型输入。
    StreamRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [protocol]
          properties:
            protocol:
              type: string
              const: ui-message-stream
              description: 显式锁定协议，不依赖自动检测（Issue #3）。
            messages:
              type: array
              description: 非权威投影（HTTP-STREAM-004）；assistant-ui adapter 请求体中的客户端消息视图，服务端忽略并以 Quoin 持久 head 重建输入。
              items:
                type: object
                additionalProperties: true
                properties:
                  id:
                    type: string
                  role:
                    type: string
                  content:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        type:
                          type: string
                        text:
                          type: string
            tools:
              type: object
              additionalProperties: true
              description: 非权威投影；原型证据（34a46c7 server/main.go Tools map[string]any）中 adapter 真实请求体的 tools 为 JSON object，声明为数组会拒绝真实 adapter 请求。服务端工具 schema 为权威。
            runConfig:
              type: object
              additionalProperties: true
              description: 非权威投影。
            system:
              type: string
              description: 非权威投影。
            parentId:
              type: string
              description: 非权威投影（assistant-ui 消息树父节点）。
            threadId:
              type: string
              description: 非权威投影（assistant-ui 线程标识）。
            unstable_assistantMessageId:
              type: string
              description: 非权威投影（assistant-ui 客户端占位消息 ID）。
      description: |
        adapter 兼容面：字段形态取自 Issue #18 证据 commit 34a46c7 的服务器输入结构（Huma v2.39.1 严格校验要求
        接受 adapter 真实请求体）；原型锁定的消费端为 @assistant-ui/react 0.15.14（lockfile 精确版本；Issue #18
        resolution 评论中的 0.12.6 为转录笔误，@assistant-ui/react-data-stream 才是 0.12.26）。
        这些字段全部是非权威投影：服务端以宽松结构解析（additionalProperties 默认允许），输入 MUST 由 Quoin
        从当前有效 Investigation head、持久消息、Artifact 与服务端工具 schema 重建；客户端携带值不参与生成。
        本 Schema 不声称是 adapter 请求体的完整镜像（未对每个传递字段做正反例验证），只覆盖证据中出现的字段。
    UndoRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [expectedHeadMessageId]
          properties:
            expectedHeadMessageId:
              $ref: '#/components/schemas/LocatorId'
    CreateCandidateRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [sourceType, sourceId]
          properties:
            sourceType:
              type: string
              enum: [initial_analysis_output, inspection_report, investigation_message]
            sourceId:
              $ref: '#/components/schemas/LocatorId'
    InspectionRunSummary:
      type: object
      required: [id, planKey, state, rowVersion, triggerKind, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        connectionName:
          description: 本次执行冻结的来源接入名称。
          type: string
        planKey:
          $ref: '#/components/schemas/StableKey'
        state:
          type: string
          enum: [Queued, Running, Completed, CompletedWithGaps, Failed, Cancelled, Interrupted, SkippedOverlap]
        rowVersion:
          type: integer
          minimum: 1
        triggerKind:
          type: string
          enum: [schedule, manual]
        scheduledFor:
          $ref: '#/components/schemas/Timestamp'
        evidenceAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
      allOf:
        - if:
            properties:
              state:
                enum: [Queued, SkippedOverlap]
            required: [state]
          then:
            not:
              type: object
              properties:
                evidenceAt: {}
              required: [evidenceAt]
        - if:
            properties:
              state:
                enum: [Running, Completed, CompletedWithGaps]
            required: [state]
          then:
            properties:
              evidenceAt: {}
            required: [evidenceAt]
    InspectionRunDetail:
      allOf:
        - $ref: '#/components/schemas/InspectionRunSummary'
        - type: object
          required: [checks, reportCount, analysisActive]
          properties:
            checks:
              type: array
              items:
                $ref: '#/components/schemas/CheckResultSummary'
            reportCount:
              type: integer
              minimum: 0
              description: 报告版本总数；完整版本历史经 listInspectionReports 游标读取。
            analysisActive:
              type: boolean
              description: 当前是否存在尚未终结的 inspection_analysis Attempt；用于轮询和取消控制。
            latestAnalysis:
              $ref: '#/components/schemas/InspectionAnalysisStatus'
              description: 最新 inspection_analysis Attempt 的只读生命周期投影；失败、取消和中断时用于说明恢复路径，不携带模型输入或报告内容。
            frozenConfig:
              $ref: '#/components/schemas/InspectionRunFrozenConfig'
              description: Run 创建时冻结的分析语义投影（名称/检查说明/单位/初始报告要求）；仅计划 Run 携带，重分析弹框默认要求与其同源。
    InspectionAnalysisStatus:
      type: object
      required: [id, state]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        state:
          type: string
          enum: [Queued, Assigned, Running, Cancelling, Succeeded, Failed, Cancelled, Interrupted]
        terminationReason:
          type: string
          maxLength: 128
          description: Runtime 以受控枚举提交的非秘密终止原因；只在失败或中断等终态投影。
    InspectionReanalysisRequest:
      allOf:
        - $ref: '#/components/schemas/CommandRequest'
        - type: object
          properties:
            reportInstructions:
              description: 报告要求三态——字段缺省继承 Run 冻结的初始报告要求；空串为本次分析显式无要求（清除）；非空文本为仅本次覆盖。覆盖只对本次生成的报告版本生效，绝不改写旧证据或旧报告的含义。
              type: string
              maxLength: 4000
    InspectionRunFrozenConfig:
      type: object
      description: Run 创建时从计划复制的不可变分析语义；origin 触发器保证不可变，重采证原样复制。
      properties:
        displayName:
          description: 冻结的计划显示名。
          type: string
        checkDescription:
          type: [string, 'null']
          maxLength: 2000
        metricUnit:
          type: [string, 'null']
          maxLength: 100
        reportInstructions:
          type: [string, 'null']
          maxLength: 4000
    CheckResultSummary:
      oneOf:
        - type: object
          required: [checkKey, status, evidenceId]
          additionalProperties: false
          properties:
            checkKey:
              $ref: '#/components/schemas/StableKey'
            status:
              const: ok
            evidenceId:
              $ref: '#/components/schemas/LocatorId'
        - type: object
          required: [checkKey, status, gapReason]
          additionalProperties: false
          properties:
            checkKey:
              $ref: '#/components/schemas/StableKey'
            status:
              type: string
              enum: [error, gap]
            gapReason:
              type: string
              enum: [runtime_unavailable, query_failed, partial_response, no_data, cancelled, interrupted]
        - type: object
          required: [checkKey, status]
          additionalProperties: false
          properties:
            checkKey:
              $ref: '#/components/schemas/StableKey'
            status:
              const: cancelling
      description: ok 必须且只能携带 Evidence locator；error/gap 必须且只能携带缺口原因；cancelling 表示 Runtime 尚未确认物理停止。
    ReportSummary:
      type: object
      required: [version, createdAt, modelId]
      properties:
        version:
          type: integer
          minimum: 1
        modelId:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ReportDetail:
      type: object
      required: [id, runId, version, evidenceDigest, evidenceIds, modelId, content, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        runId:
          $ref: '#/components/schemas/LocatorId'
        version:
          type: integer
          minimum: 1
        evidenceDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        evidenceIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/LocatorId'
          description: 本报告精确绑定的不可变 Evidence 集；每项可由 getEvidence 读取。
        modelId:
          type: string
        content:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        reportInstructions:
          description: 该版本分析实际生效的报告要求（Attempt 不可变覆盖优先，Run 冻结初始要求回退；两者都缺失时缺省）。
          type: [string, 'null']
          maxLength: 4000
    ManualRunRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [planKey]
          properties:
            planKey:
              $ref: '#/components/schemas/StableKey'
    KnowledgeBrowseResult:
      type: object
      additionalProperties: false
      required: [mode, items]
      properties:
        mode:
          type: string
          const: browse
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSummary'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    KnowledgeQueryResult:
      type: object
      additionalProperties: false
      required: [mode, exactTextMatches, semanticMatches]
      properties:
        mode:
          type: string
          const: query
        exactTextMatches:
          type: array
          description: FTS5 原始排序；不得与 semanticScore 合成总分。
          items:
            $ref: '#/components/schemas/KnowledgeSearchHit'
        semanticMatches:
          type: array
          description: cosine 原始排序；同一 Knowledge 可同时出现在两组，前端只显示一次并标出双重依据。
          items:
            $ref: '#/components/schemas/KnowledgeSearchHit'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
          description: query 模式复合游标，同时绑定 q/筛选/索引 generation 与 exactTextMatches、semanticMatches 两个通道各自的排序方向、最后 score 和 Knowledge locator；任一通道未耗尽即返回。客户端按 Knowledge locator 跨页幂等合并，同一对象可累积文本与语义两种依据；两个通道都耗尽时省略。
    KnowledgeSearchHit:
      type: object
      additionalProperties: false
      required: [knowledge, score]
      properties:
        knowledge:
          $ref: '#/components/schemas/KnowledgeSummary'
        score:
          type: number
          description: 所在通道的原始分数；两个通道的值不可比较或加权。
        indexState:
          type: string
          enum: [ready, stale, rebuilding]
          description: 仅语义通道可返回；它是相对当前 EmbeddingGeneration 的派生状态。
    KnowledgeSummary:
      type: object
      required: [id, title, currentVersionId, currentVersionSeq, eligible, rowVersion]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        title:
          type: string
        currentVersionId:
          $ref: '#/components/schemas/LocatorId'
        currentVersionSeq:
          type: integer
          minimum: 1
        eligible:
          type: boolean
          description: current ∧ 未停用 ∧ 来源有效 ∧ 未 exit（DATA-KNOWLEDGE-002）。
        rowVersion:
          type: integer
          minimum: 1
          description: 创建修订 Candidate 时与 expectedCurrentVersionId 一起保护 current 指针。
    KnowledgeDetail:
      allOf:
        - $ref: '#/components/schemas/KnowledgeSummary'
        - type: object
          required: [versionCount]
          properties:
            versionCount:
              type: integer
              minimum: 1
              description: 版本总数；历史经 listKnowledgeVersions 游标分页读取（HTTP-PAGE-005）。
    KnowledgeVersionSummary:
      type: object
      required: [id, versionSeq, title, sourceCandidateId, embeddingState, createdAt, eligible, retrievalStateRowVersion]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        versionSeq:
          type: integer
          minimum: 1
        title:
          type: string
        sourceCandidateId:
          $ref: '#/components/schemas/LocatorId'
        embeddingState:
          type: string
          enum: [not_configured, pending, ready, failed, stale, rebuilding]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        eligible:
          type: boolean
        retrievalStateRowVersion:
          type: integer
          minimum: 1
          description: knowledge_version_retrieval_state 投影的并发前提（stop-reuse 命令使用，HTTP-COMMAND-002）；不可误称为不可变 KnowledgeVersion 行版本。
    KnowledgeVersionDetail:
      type: object
      required: [id, versionSeq, title, body, sourceCandidateId, createdAt, eligible, retrievalStateRowVersion, embeddingState]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        versionSeq:
          type: integer
          minimum: 1
        title:
          type: string
        body:
          type: string
        scope:
          type: object
          additionalProperties: true
        conditions:
          type: object
          additionalProperties: true
        limitations:
          type: object
          additionalProperties: true
        sourceCandidateId:
          $ref: '#/components/schemas/LocatorId'
          description: 产生本版本的已确认 Candidate；由此可追溯到不可变诊断来源或前一 KnowledgeVersion。
        exitedAt:
          $ref: '#/components/schemas/Timestamp'
        exitReason:
          type: string
          enum: [source_rejected, stopped]
        embeddingState:
          type: string
          enum: [not_configured, pending, ready, failed, stale, rebuilding]
          description: 相对当前 EmbeddingGeneration 的派生索引状态；不成为知识资格第二权威。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        eligible:
          type: boolean
        retrievalStateRowVersion:
          type: integer
          minimum: 1
          description: knowledge_version_retrieval_state 投影的并发前提（stop-reuse 命令使用，HTTP-COMMAND-002）；不可误称为不可变 KnowledgeVersion 行版本。
    ImportBatchRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [text]
          properties:
            text:
              type: string
              minLength: 1
              description: 用户主动粘贴的原文（Source Material）。
    ImportBatchSummary:
      type: object
      required: [id, state, rowVersion, generation, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        state:
          type: string
          enum: [Processing, AwaitingConfirmation, Failed, Completed, Cancelled]
        rowVersion:
          type: integer
          minimum: 1
        generation:
          type: integer
          minimum: 1
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ImportBatchDetail:
      allOf:
        - $ref: '#/components/schemas/ImportBatchSummary'
        - type: object
          required: [candidates]
          properties:
            candidates:
              type: array
              items:
                $ref: '#/components/schemas/CandidateSummary'
    CandidateSummary:
      type: object
      required: [id, sourceType, sourceId, state, rowVersion, generation, draftRevision]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        sourceType:
          type: string
          enum: [initial_analysis_output, inspection_report, investigation_message, source_material, knowledge_version]
        sourceId:
          $ref: '#/components/schemas/LocatorId'
        state:
          type: string
          enum: [AwaitingConfirmation, Confirmed, Excluded, Superseded, SourceInvalid]
        rowVersion:
          type: integer
          minimum: 1
        generation:
          type: integer
          minimum: 1
        draftRevision:
          type: integer
          minimum: 0
        draftTitle:
          type: string
        draftBody:
          type: string
        draftScope:
          type: object
          additionalProperties: true
          description: 适用范围草稿投影（UI-KNOWLEDGE-003）；确认时随草稿写入不可变版本的 scope。
        targetKnowledgeId:
          $ref: '#/components/schemas/LocatorId'
          description: 仅 knowledge_version 修订 Candidate 在确认前后携带，指向将追加版本的 Reusable Knowledge。
        confirmedKnowledgeId:
          $ref: '#/components/schemas/LocatorId'
    CandidateDetail:
      allOf:
        - $ref: '#/components/schemas/CandidateSummary'
        - type: object
          required: [originalSuggestion]
          properties:
            originalSuggestion:
              type: object
              additionalProperties: true
              description: 模型原始建议的不可变结构化投影；用户只编辑 draft 字段。
    CreateKnowledgeRevisionRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/ExpectedRowVersion'
        - type: object
          required: [expectedCurrentVersionId]
          properties:
            expectedCurrentVersionId:
              $ref: '#/components/schemas/LocatorId'
              description: 必须等于 Reusable Knowledge 当前指针；与 expectedRowVersion 同时比较。
    CandidateDraftEditRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [expectedRevision]
          properties:
            expectedRevision:
              type: integer
              minimum: 0
              description: stale revision 冲突（DATA-KNOWLEDGE-004）。
            title:
              type: string
            body:
              type: string
            scope:
              type: object
              additionalProperties: true
              description: 适用范围草稿（UI-KNOWLEDGE-003、DATA-KNOWLEDGE-001）；空对象表示清除范围。确认时随草稿写入不可变版本。
          anyOf:
            - required: [title]
            - required: [body]
            - required: [scope]
      description: 至少提供一个草稿变更字段（anyOf 强制），防止无变化编辑。
    ConfirmCandidateRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [expectedRevision]
          properties:
            expectedRevision:
              type: integer
              minimum: 0
    ConfirmCandidatesRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              minItems: 1
              items:
                type: object
                required: [candidateId, expectedRevision]
                properties:
                  candidateId:
                    $ref: '#/components/schemas/LocatorId'
                  expectedRevision:
                    type: integer
                    minimum: 0
    FeedbackRequest:
      type: object
      required: [targetType, targetId, value]
      properties:
        targetType:
          type: string
          enum: [initial_analysis_output, inspection_report, investigation_message]
        targetId:
          $ref: '#/components/schemas/LocatorId'
        value:
          type: string
          enum: [adopted, executed, verified_effective, rejected]
        note:
          type: string
          maxLength: 4096
          description: 可选的人类说明；任何反馈值都不强制填写。
    FeedbackSummary:
      type: object
      required: [id, targetType, targetId, value, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        targetType:
          type: string
          enum: [initial_analysis_output, inspection_report, investigation_message]
        targetId:
          $ref: '#/components/schemas/LocatorId'
        value:
          type: string
          enum: [adopted, executed, verified_effective, rejected]
        note:
          type: string
          maxLength: 4096
        createdBy:
          $ref: '#/components/schemas/LocatorId'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    FeedbackTimeline:
      type: object
      required: [items]
      properties:
        latestValue:
          type: string
          enum: [adopted, executed, verified_effective, rejected]
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackSummary'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
    ConnectionSummary:
      oneOf:
        - $ref: '#/components/schemas/PrometheusConnectionSummary'
        - $ref: '#/components/schemas/ThanosConnectionSummary'
        - $ref: '#/components/schemas/ModelProviderConnectionSummary'
      description: 连接响应按 type 封闭：外层 type 与 config 变体由同一对象强制一致，客户端不会读到相互矛盾的 type/config 组合（HTTP-COMMAND-010）。
    PrometheusConnectionSummary:
      type: object
      required: [name, type, enabled, rowVersion, config]
      properties:
        lastProbe:
          $ref: '#/components/schemas/ConnectionLastProbe'
        name:
          $ref: '#/components/schemas/StableKey'
        type:
          type: string
          const: prometheus
        enabled:
          type: boolean
        rowVersion:
          type: integer
          minimum: 1
        revalidationRequired:
          type: boolean
        currentRevisionId:
          $ref: '#/components/schemas/LocatorId'
        currentCredentialGenerationId:
          $ref: '#/components/schemas/LocatorId'
        config:
          $ref: '#/components/schemas/PrometheusConnectionNonSecret'
    ThanosConnectionSummary:
      type: object
      required: [name, type, enabled, rowVersion, config]
      properties:
        lastProbe:
          $ref: '#/components/schemas/ConnectionLastProbe'
        name:
          $ref: '#/components/schemas/StableKey'
        type:
          type: string
          const: thanos
        enabled:
          type: boolean
        rowVersion:
          type: integer
          minimum: 1
          description: 连接行并发前提（enable/disable/rotate 命令使用，HTTP-COMMAND-002）。
        revalidationRequired:
          type: boolean
        currentRevisionId:
          $ref: '#/components/schemas/LocatorId'
        currentCredentialGenerationId:
          $ref: '#/components/schemas/LocatorId'
        config:
          $ref: '#/components/schemas/ThanosConnectionNonSecret'
    ModelProviderConnectionSummary:
      type: object
      required: [name, type, enabled, rowVersion, config]
      properties:
        lastProbe:
          $ref: '#/components/schemas/ConnectionLastProbe'
        name:
          $ref: '#/components/schemas/StableKey'
        type:
          type: string
          const: model_provider
        enabled:
          type: boolean
        rowVersion:
          type: integer
          minimum: 1
        revalidationRequired:
          type: boolean
        currentRevisionId:
          $ref: '#/components/schemas/LocatorId'
        currentCredentialGenerationId:
          $ref: '#/components/schemas/LocatorId'
        config:
          $ref: '#/components/schemas/ModelProviderConnectionNonSecret'
        enableQualificationProbeResultId:
          $ref: '#/components/schemas/LocatorId'
          description: 由当前 enabled rowVersion 对应的 immutable enable-qualification event 派生；不是可写的 current/latest qualification 指针。disabled 时缺失。
        enableQualificationProbeResult:
          $ref: '#/components/schemas/ConnectionProbeResult'
          description: 服务端按同一 immutable enable event 解析的 typed result；不得隐式选择最新成功 probe。
    ConnectionLastProbe:
      type: object
      required: [id, outcome, finishedAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        outcome:
          type: string
          enum: [passed, failed, cancelled, interrupted]
        finishedAt:
          type: string
          format: date-time
    ConnectionProbeResult:
      type: object
      required: [id, attemptId, connectionType, connectionRevisionId, credentialGenerationId, rootBindingRevision, actionSetId, actionSetVersion, probeContractDigest, outcome, resultDigest, startedAt, finishedAt, details]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        attemptId:
          $ref: '#/components/schemas/LocatorId'
        connectionType:
          type: string
          enum: [model_provider, prometheus, thanos]
        connectionRevisionId:
          $ref: '#/components/schemas/LocatorId'
        credentialGenerationId:
          $ref: '#/components/schemas/LocatorId'
        rootBindingRevision:
          type: integer
          minimum: 1
        actionSetId:
          type: string
        actionSetVersion:
          type: integer
          minimum: 1
        probeContractDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        outcome:
          type: string
          enum: [passed, failed, cancelled, interrupted]
        resultDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        startedAt:
          $ref: '#/components/schemas/Timestamp'
        finishedAt:
          $ref: '#/components/schemas/Timestamp'
        details:
          oneOf:
            - $ref: '#/components/schemas/ModelProviderConnectionProbeDetails'
            - $ref: '#/components/schemas/PrometheusConnectionProbeDetails'
            - $ref: '#/components/schemas/ThanosConnectionProbeDetails'
      description: connectionType 与 details 变体必须一致；该闭合由服务端 typed child 表与 JSON Schema fixtures 共同校验。
    PrometheusConnectionProbeDetails:
      type: object
      required: [kind, query, responseType, sampleCount, sampleValue]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: prometheus
        query:
          type: string
          const: vector(1)
        responseType:
          type: string
          const: vector
        sampleCount:
          type: integer
          const: 1
        sampleValue:
          type: string
    ThanosConnectionProbeDetails:
      type: object
      required: [kind, query, responseType, sampleCount, sampleValue]
      additionalProperties: false
      properties:
        kind:
          type: string
          const: thanos
        query:
          type: string
          const: vector(1)
        responseType:
          type: string
          const: vector
        sampleCount:
          type: integer
          const: 1
        sampleValue:
          type: string
    ModelProviderConnectionProbeDetails:
      type: object
      additionalProperties: false
      required: [kind, probeAttemptId, chatModelId, embeddingModelId, supportsStreaming, supportsNativeTools, supportsParallelToolCalls, supportsCancel, supportsUsage, supportsRequestId, supportsEmbeddings, contextBudgetTokens, maxOutputTokens, testedAt]
      properties:
        kind:
          type: string
          const: model_provider
        probeAttemptId:
          $ref: '#/components/schemas/LocatorId'
        chatModelId:
          type: string
        embeddingModelId:
          type: string
        supportsStreaming:
          type: boolean
        supportsNativeTools:
          type: boolean
        supportsParallelToolCalls:
          type: boolean
        supportsCancel:
          type: boolean
        supportsUsage:
          type: boolean
        supportsRequestId:
          type: boolean
        contextBudgetTokens:
          type: integer
          minimum: 1
        maxOutputTokens:
          type: integer
          minimum: 1
        supportsEmbeddings:
          type: boolean
        embeddingDimensions:
          type: integer
          minimum: 1
        testedAt:
          $ref: '#/components/schemas/Timestamp'
      allOf:
        - if:
            properties:
              supportsEmbeddings:
                const: true
          then:
            properties:
              embeddingDimensions: {}
            required: [embeddingDimensions]
          else:
            properties:
              embeddingDimensions: false
    ConnectionDetail:
      allOf:
        - $ref: '#/components/schemas/ConnectionSummary'
        - type: object
          required: [revisionCount, generationCount]
          properties:
            revisionCount:
              type: integer
              minimum: 0
              description: revision 总数；历史经 listConnectionRevisions 游标分页读取（HTTP-PAGE-005）。
            generationCount:
              type: integer
              minimum: 0
              description: generation 总数；历史经 listCredentialGenerations 游标分页读取（HTTP-PAGE-005）。
            activeProbeAttempt:
              $ref: '#/components/schemas/AttemptSummary'
              description: 当前 Connection 的 active connection_probe Attempt；无 active probe 时省略，供刷新后恢复等待/取消入口。
    RevisionSummary:
      type: object
      required: [id, revisionSeq, config, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        revisionSeq:
          type: integer
          minimum: 1
        config:
          oneOf:
            - $ref: '#/components/schemas/PrometheusConnectionNonSecret'
            - $ref: '#/components/schemas/ThanosConnectionNonSecret'
            - $ref: '#/components/schemas/ModelProviderConnectionNonSecret'
          description: 该 revision 的服务端生成类型化非秘密投影（DATA-CONN-005）；不得包含秘密。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    GenerationSummary:
      type: object
      required: [id, generationSeq, createdAt]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        generationSeq:
          type: integer
          minimum: 1
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        createdBy:
          $ref: '#/components/schemas/LocatorId'
          description: 创建者用户 locator（可选，非秘密）。
      description: 凭据 generation 的非秘密标识投影；密文与内部元数据永不下发、永不返回（DATA-CONN-001/004）。
    PrometheusConnectionNonSecret:
      type: object
      required: [type, baseUrl, authType]
      additionalProperties: false
      properties:
        type:
          type: string
          const: prometheus
        baseUrl:
          type: string
          format: uri
          description: Prometheus HTTP API base URL.
        tlsCaPem:
          type: string
          description: Custom CA PEM (non-secret).
        tlsServerName:
          type: string
          description: TLS ServerName override (non-secret).
        tlsSkipVerify:
          type: boolean
          description: Explicit TLS verification override (non-secret).
        authType:
          type: string
          enum: [none, basic, bearer]
        username:
          type: string
          description: HTTP Basic username (non-secret; present only for basic auth).
    ThanosConnectionNonSecret:
      type: object
      required: [type, baseUrl, authType]
      additionalProperties: false
      properties:
        type:
          type: string
          const: thanos
        baseUrl:
          type: string
          format: uri
          description: Thanos Query 入口 URL（实现 Prometheus HTTP v1 API）。
        tlsCaPem:
          type: string
          description: 自定义 CA 的 PEM 正文（非秘密）。
        tlsServerName:
          type: string
          description: TLS ServerName 覆盖（非秘密）。
        tlsSkipVerify:
          type: boolean
          description: 跳过 TLS 校验（仅 Admin 明确接受风险时设置；非秘密）。
        authType:
          type: string
          enum: [none, basic, bearer]
        username:
          type: string
          description: HTTP Basic Auth 用户名（非秘密）。
    ModelProviderConnectionNonSecret:
      type: object
      required: [type, baseUrl, chatModelId, embeddingModelId]
      additionalProperties: false
      properties:
        type:
          type: string
          const: model_provider
        baseUrl:
          type: string
          format: uri
          description: OpenAI-compatible endpoint 基 URL。
        chatModelId:
          type: string
          minLength: 1
          description: Admin 从 /v1/models 选择或在列表/metadata 不可用时手工填写的对话模型 ID；仅真实 probe 可证明能力。
        embeddingModelId:
          type: string
          minLength: 1
          description: Admin 从 /v1/models 选择或手工填写的嵌入模型 ID；能力与向量维度只由真实 probe 证明。
        contextBudgetTokens:
          type: integer
          minimum: 1
          description: 优先由 provider metadata 自动发现；metadata 不足时由 Admin 补充，并由 probe 验证可工作。
        maxOutputTokens:
          type: integer
          minimum: 1
          description: 优先由 provider metadata 自动发现；metadata 不足时由 Admin 补充。
    PrometheusConnectionInput:
      type: object
      required: [type, baseUrl, authType]
      additionalProperties: false
      properties:
        type:
          type: string
          const: prometheus
        baseUrl:
          type: string
          format: uri
        tlsCaPem:
          type: string
        tlsServerName:
          type: string
        tlsSkipVerify:
          type: boolean
        authType:
          type: string
          enum: [none, basic, bearer]
        username:
          type: string
        password:
          type: string
          description: HTTP Basic password (secret; request-only).
        bearerToken:
          type: string
          description: HTTP Bearer token (secret; request-only).
    ThanosConnectionInput:
      type: object
      required: [type, baseUrl, authType]
      additionalProperties: false
      properties:
        type:
          type: string
          const: thanos
        baseUrl:
          type: string
          format: uri
        tlsCaPem:
          type: string
        tlsServerName:
          type: string
        tlsSkipVerify:
          type: boolean
        authType:
          type: string
          enum: [none, basic, bearer]
        username:
          type: string
        password:
          type: string
          description: HTTP Basic Auth password (secret; request-only).
        bearerToken:
          type: string
          description: HTTP Bearer token (secret; request-only).
    ModelProviderConnectionInput:
      type: object
      required: [type, baseUrl, chatModelId, embeddingModelId]
      additionalProperties: false
      properties:
        type:
          type: string
          const: model_provider
        baseUrl:
          type: string
          format: uri
        chatModelId:
          type: string
          minLength: 1
        embeddingModelId:
          type: string
          minLength: 1
        contextBudgetTokens:
          type: integer
          minimum: 1
        maxOutputTokens:
          type: integer
          minimum: 1
        apiKey:
          type: string
          description: API key（秘密；仅请求内存，服务端加密为 CredentialGeneration 后丢弃）。
    DiscoverProviderModelsRequest:
      type: object
      additionalProperties: false
      required: [baseUrl]
      properties:
        baseUrl:
          type: string
          format: uri
        apiKey:
          type: string
          description: 仅用于本次上游 /v1/models 请求；不持久化。
    ProviderModelDiscoveryResult:
      type: object
      additionalProperties: false
      required: [available, items]
      properties:
        available:
          type: boolean
        items:
          type: array
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id:
                type: string
                minLength: 1
              metadata:
                type: object
                additionalProperties: true
                description: 上游原样返回的非秘密辅助 metadata；不得被当作已验证 capability。
        detail:
          type: string
          description: available=false 时供 Admin 理解发现失败；不得包含秘密或原始响应正文。
    ConnectionInput:
      oneOf:
        - $ref: '#/components/schemas/PrometheusConnectionInput'
        - $ref: '#/components/schemas/ThanosConnectionInput'
        - $ref: '#/components/schemas/ModelProviderConnectionInput'
      description: "按 type 封闭的判别联合（additionalProperties 为 false）：非秘密配置字段与秘密字段在同一变体内声明，未知字段与跨类型字段被拒绝（DATA-CONN-005）。"
    CreateConnectionRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [name, connection]
          properties:
            name:
              $ref: '#/components/schemas/StableKey'
            connection:
              $ref: '#/components/schemas/ConnectionInput'
    RotateConnectionRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/ExpectedRowVersion'
        - type: object
          required: [connection]
          properties:
            connection:
              $ref: '#/components/schemas/ConnectionInput'
              description: 新 revision/generation 的完整配置；expectedRowVersion 取当前 ConnectionSummary.rowVersion。
    AlertSourceSummary:
      type: object
      required: [key, protocol, enabled, createdAt, rowVersion]
      properties:
        key:
          $ref: '#/components/schemas/StableKey'
        protocol:
          type: string
          enum: [alertmanager]
        enabled:
          type: boolean
        rowVersion:
          type: integer
          minimum: 1
          description: 来源行并发前提（enable/disable 命令使用，HTTP-COMMAND-002）。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        disabledAt:
          $ref: '#/components/schemas/Timestamp'
        latestValidEventAt:
          $ref: '#/components/schemas/Timestamp'
          description: 最近一次正常 Alert Observation 的 Quoin 提交时间。缺失表示等待首条有效事件；静默不表示故障。
    AlertmanagerReceiverConfig:
      type: object
      required: [publicReceiverUrl]
      additionalProperties: false
      properties:
        publicReceiverUrl:
          type: string
          format: uri
          pattern: '^https://.*/stele/webhook/alertmanager$'
          description: 由部署配置冻结的 Stele 公共 URL，不接受请求 Host 推导。
    AlertSourceDetail:
      allOf:
        - $ref: '#/components/schemas/AlertSourceSummary'
        - type: object
          required: [credentialCount]
          properties:
            credentialCount:
              type: integer
              minimum: 0
              description: 凭据总数；历史经 listAlertSourceCredentials 游标分页读取（HTTP-PAGE-005）。
    CredentialSummary:
      type: object
      required: [id, state, rowVersion, createdAt]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        state:
          type: string
          enum: [Active, PendingRetirement, Retired]
        rowVersion:
          type: integer
          minimum: 1
          description: 吊销命令并发前提与响应版本（DATA-ALERT-009）。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        supersedesCredentialId:
          $ref: '#/components/schemas/LocatorId'
          description: 本 generation 轮换取代的旧凭据；首个成功 Delivery 后旧凭据进入 PendingRetirement。
        firstUsedAt:
          $ref: '#/components/schemas/Timestamp'
        pendingRetirementAt:
          $ref: '#/components/schemas/Timestamp'
        retiredAt:
          $ref: '#/components/schemas/Timestamp'
      allOf:
        - if:
            properties:
              state:
                const: PendingRetirement
            required: [state]
          then:
            required: [pendingRetirementAt]
            properties:
              retiredAt: false
        - if:
            properties:
              state:
                const: Active
            required: [state]
          then:
            properties:
              pendingRetirementAt: false
              retiredAt: false
        - if:
            properties:
              state:
                const: Retired
            required: [state]
          then:
            required: [retiredAt]
    CreateAlertSourceRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [key, protocol]
          properties:
            key:
              $ref: '#/components/schemas/StableKey'
            protocol:
              type: string
              enum: [alertmanager]
    AlertSourceCredentialMetadata:
      type: object
      required: [sourceKey, credentialId, revealAvailable]
      additionalProperties: false
      properties:
        sourceKey:
          $ref: '#/components/schemas/StableKey'
        credentialId:
          $ref: '#/components/schemas/LocatorId'
        revealAvailable:
          type: boolean
          description: 当前命令结果是否仍有可读取 handle；同 Session 同 clientCommandId 重放时，原 handle 在 60 秒内且未消费仍为 true，否则为 false（SEC-REVEAL-003）。
        revealHandle:
          type: string
          minLength: 32
          maxLength: 256
          description: 不透明、内存 60 秒、绑定发起 Session、单次成功消费的 reveal 句柄；仅 revealAvailable=true 时存在；不落盘（SEC-REVEAL-*）。
      allOf:
        - if:
            properties:
              revealAvailable:
                const: true
            required: [revealAvailable]
          then:
            properties:
              revealHandle: {}
            required: [revealHandle]
          else:
            properties:
              revealHandle: false
    RevealCredentialRequest:
      type: object
      required: [revealHandle]
      additionalProperties: false
      properties:
        revealHandle:
          type: string
          minLength: 32
          maxLength: 256
          description: 创建/轮换命令返回的 60 秒同 Session 一次性句柄；不接受 source/credential ID（SEC-REVEAL-*）。
    RevealCredentialResult:
      type: object
      required: [credentialId, bearerToken]
      additionalProperties: false
      properties:
        credentialId:
          $ref: '#/components/schemas/LocatorId'
        bearerToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 32-byte 高熵 Bearer 的 base64url 无填充文本；仅此一次返回；数据库只存 digest，禁止进入日志、审计或命令结果（SEC-REVEAL-*）。
    RetireCredentialRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/ExpectedRowVersion'
    BackupRetentionHealth:
      type: object
      additionalProperties: false
      required: [lastAttemptAt, lastFailureAt, errorDetail]
      properties:
        lastAttemptAt: { oneOf: [ { $ref: '#/components/schemas/Timestamp' }, { type: 'null' } ] }
        lastFailureAt: { oneOf: [ { $ref: '#/components/schemas/Timestamp' }, { type: 'null' } ] }
        errorDetail: { type: [string, 'null'], maxLength: 4096 }
    BackupSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - stage
        - triggerKind
        - executionMode
        - scheduledFor
        - rowVersion
        - createdAt
        - updatedAt
        - startedAt
        - completedAt
        - dbSha256
        - manifestSha256
        - artifactCount
        - sizeBytes
        - errorCode
        - retryable
        - errorDetail
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        stage:
          type: string
          enum: [queued, preflight, database_snapshot, artifact_copy, manifest_publish, completed]
          description: 当前或失败时最后持久阶段；只允许按 OPS-BACKUP-003 前进。
        triggerKind:
          type: string
          enum: [manual, scheduled, upgrade]
        executionMode:
          type: string
          enum: [online, offline]
          description: Web/scheduler/upgrade 创建 online；停机部署 helper 创建 offline。
        scheduledFor:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: 仅 scheduled 非空的 UTC 计划边界；用于停机 catch-up 幂等。
        rowVersion:
          type: integer
          minimum: 1
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        startedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        completedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        dbSha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        manifestSha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        artifactCount:
          type: [integer, 'null']
          minimum: 0
        sizeBytes:
          type: integer
          minimum: 0
          readOnly: true
          description: 成功备份的 archive-set 成员字节总和（manifest.json、quoin.db 与 manifest 列出的 Artifact，排除 tar framing）；未完成或失败 Run 为 0。
        errorCode:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        retryable:
          type: [boolean, 'null']
        errorDetail:
          type: [string, 'null']
          minLength: 1
          maxLength: 4096
      allOf:
        - if:
            properties:
              triggerKind: { const: scheduled }
            required: [triggerKind]
          then:
            properties:
              executionMode: { const: online }
              scheduledFor: { $ref: '#/components/schemas/Timestamp' }
          else:
            properties:
              scheduledFor: { type: 'null' }
        - if:
            properties:
              executionMode: { const: offline }
            required: [executionMode]
          then:
            properties:
              triggerKind: { const: manual }
        - if:
            properties:
              status: { const: queued }
            required: [status]
          then:
            properties:
              stage: { const: queued }
              startedAt: { type: 'null' }
              completedAt: { type: 'null' }
              dbSha256: { type: 'null' }
              manifestSha256: { type: 'null' }
              artifactCount: { type: 'null' }
              sizeBytes: { const: 0 }
              errorCode: { type: 'null' }
              retryable: { type: 'null' }
              errorDetail: { type: 'null' }
        - if:
            properties:
              status: { const: running }
            required: [status]
          then:
            properties:
              stage: { enum: [preflight, database_snapshot, artifact_copy, manifest_publish] }
              startedAt: { $ref: '#/components/schemas/Timestamp' }
              completedAt: { type: 'null' }
              dbSha256: { type: 'null' }
              manifestSha256: { type: 'null' }
              artifactCount: { type: 'null' }
              sizeBytes: { const: 0 }
              errorCode: { type: 'null' }
              retryable: { type: 'null' }
              errorDetail: { type: 'null' }
        - if:
            properties:
              status: { const: succeeded }
            required: [status]
          then:
            properties:
              stage: { const: completed }
              startedAt: { $ref: '#/components/schemas/Timestamp' }
              completedAt: { $ref: '#/components/schemas/Timestamp' }
              dbSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
              manifestSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
              artifactCount: { type: integer, minimum: 0 }
              sizeBytes: { type: integer, minimum: 1 }
              errorCode: { type: 'null' }
              retryable: { type: 'null' }
              errorDetail: { type: 'null' }
        - if:
            properties:
              status: { const: failed }
            required: [status]
          then:
            properties:
              stage: { enum: [queued, preflight, database_snapshot, artifact_copy, manifest_publish] }
              completedAt: { $ref: '#/components/schemas/Timestamp' }
              dbSha256: { type: 'null' }
              manifestSha256: { type: 'null' }
              artifactCount: { type: 'null' }
              sizeBytes: { const: 0 }
              errorCode: { type: string, minLength: 1, maxLength: 128 }
              retryable: { type: boolean }
              errorDetail: { type: string, minLength: 1, maxLength: 4096 }
    BackupSettings:
      type: object
      required: [enabled, timezone, backupTarget, retentionCount, rowVersion]
      properties:
        enabled:
          type: boolean
        scheduleCron:
          type: string
          description: 缺省表示仅手动触发。
        timezone:
          type: string
        backupTarget:
          type: string
          minLength: 1
          readOnly: true
          description: Quoin 进程可见的独立备份挂载目标；不得为宿主机路径。
        retentionCount:
          type: integer
          minimum: 1
        rowVersion:
          type: integer
          minimum: 1
          description: 设置行并发前提（updateBackupSettings 使用，HTTP-COMMAND-002）。
    BackupSettingsUpdate:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/ExpectedRowVersion'
        - type: object
          properties:
            enabled:
              type: boolean
            scheduleCron:
              type: [string, 'null']
              description: null 表示清除定时（仅手动触发）。
            timezone:
              type: string
            retentionCount:
              type: integer
              minimum: 1
          anyOf:
            - required: [enabled]
            - required: [scheduleCron]
            - required: [timezone]
            - required: [retentionCount]
      description: 至少提供一个设置字段（anyOf 强制），防止无变化更新；expectedRowVersion 取当前 BackupSettings.rowVersion。
    ArtifactRetentionSettings:
      type: object
      additionalProperties: false
      required: [generatedRetentionDays, rowVersion]
      properties:
        generatedRetentionDays:
          type: integer
          minimum: 1
          description: 创建生成型 Artifact 时计算固定 expiresAt 使用的天数；默认 90。
        rowVersion:
          type: integer
          minimum: 1
    ArtifactRetentionSettingsUpdate:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/ExpectedRowVersion'
        - type: object
          required: [generatedRetentionDays]
          properties:
            generatedRetentionDays:
              type: integer
              minimum: 1
      description: expectedRowVersion 取当前 ArtifactRetentionSettings.rowVersion；只影响此后创建的生成型 Artifact。
    TextAttachmentSummary:
      type: object
      additionalProperties: false
      required: [id, artifactId, originalFilename, mediaType, sizeBytes, digest, bodyExpired, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        artifactId:
          $ref: '#/components/schemas/LocatorId'
        originalFilename:
          type: string
          minLength: 1
          maxLength: 512
          description: multipart 原始 basename 的转义显示值；不得解释为路径。
        mediaType:
          type: string
          const: text/plain
        sizeBytes:
          type: integer
          minimum: 0
          description: 实际正文大小；允许范围由部署的消息级附件边界决定，Schema 不硬编码默认值。
        digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        bodyExpired:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    EvidenceDetail:
      type: object
      additionalProperties: false
      required: [id, targetType, targetId, params, observedAt, integrity, producer, connections, body, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        targetType:
          type: string
          minLength: 1
          maxLength: 128
        targetId:
          $ref: '#/components/schemas/LocatorId'
        params:
          description: 采集时冻结的类型化参数 JSON；不得包含连接凭据。
        observedAt:
          $ref: '#/components/schemas/Timestamp'
        integrity:
          type: string
          enum: [complete, incomplete]
        warnings:
          description: 采集器返回的有界结构化 warnings JSON。
        errors:
          description: 采集器返回的有界结构化 errors JSON。
        producer:
          $ref: '#/components/schemas/EvidenceProducer'
        connections:
          type: array
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [key, type]
            properties:
              key:
                $ref: '#/components/schemas/StableKey'
              type:
                type: string
                enum: [thanos, model_provider]
          description: 从 Tool Call grant 机械派生的非秘密连接逻辑名；无连接时为空数组。
        body:
          $ref: '#/components/schemas/EvidenceBody'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    EvidenceProducer:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind:
              const: quoin_local
        - type: object
          additionalProperties: false
          required: [kind, attemptId, toolCallId, toolName, toolVersion]
          properties:
            kind:
              const: plinth_tool
            attemptId:
              $ref: '#/components/schemas/LocatorId'
            toolCallId:
              $ref: '#/components/schemas/LocatorId'
            toolName:
              type: string
              minLength: 1
              maxLength: 200
            toolVersion:
              type: string
              minLength: 1
              maxLength: 200
        - type: object
          additionalProperties: false
          required: [kind, attemptId]
          properties:
            kind:
              const: plinth_promql
            attemptId:
              $ref: '#/components/schemas/LocatorId'
    EvidenceBody:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, value]
          properties:
            kind:
              const: inline_json
            value: {}
        - type: object
          additionalProperties: false
          required: [kind, artifact]
          properties:
            kind:
              const: artifact
            artifact:
              $ref: '#/components/schemas/ArtifactSummary'
    ArtifactSummary:
      type: object
      required: [id, kind, sensitive, retentionKind, ownerType, ownerId, sizeBytes, sha256, bodyExpired, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        kind:
          type: string
          enum: [attachment, screenshot, trace, tool_result, report_file, verification_bundle, verification_attachment]
        sensitive:
          type: boolean
        retentionKind:
          type: string
          enum: [long_term, generated]
        ownerType:
          type: string
          enum: [investigation_message, evidence, tool_call, inspection_report, backup, source_material, verification_invocation]
          description: 逻辑所有者类型；与 ownerId 的权威表由 DATA-ARTIFACT-003 机械闭合。
        ownerId:
          $ref: '#/components/schemas/LocatorId'
        sizeBytes:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        bodyExpired:
          type: boolean
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    AuditEventSummary:
      type: object
      required: [id, actorType, actorId, action, outcome, createdAt]
      description: 一条审计事件；correlationId 仅在合并前历史为空，phase 缺省为 execute。
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        correlationId:
          type: string
          description: 跨请求/跨阶段关联 ID；同一命令的访问、准入、执行与结果事件共享。
        actorType:
          type: string
          enum: [user, service, system]
        actorId:
          $ref: '#/components/schemas/LocatorId'
        action:
          type: string
        outcome:
          type: string
          enum: [success, failure, rejected, unknown]
        phase:
          type: string
          description: 记录阶段（如 access/execute，协调阶段扩展随合并落地）；无更细阶段时为 execute。
        clientCommandId:
          type: string
        requestId:
          type: string
          description: 产生该事件的 HTTP 请求 ID（无请求来源时为空）。
        domainRefType:
          type: string
        domainRefId:
          $ref: '#/components/schemas/LocatorId'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    AuditCleanupStatus:
      type: object
      description: 最近一次保留清理运行的结果；null 表示从未运行。
      properties:
        lastRunAt:
          type: [string, 'null']
          format: date-time
        lastSuccessCutoffAt:
          type: [string, 'null']
          format: date-time
          description: 最近一次成功运行实际清理到的边界。
        lastSuccessDeletedCount:
          type: [integer, 'null']
          minimum: 0
        lastFailureAt:
          type: [string, 'null']
          format: date-time
        lastErrorCode:
          type: [string, 'null']
          description: 稳定映射码（如 cleanup_failed/cancelled）；原始驱动或内部错误永不外发。
    AuditSettings:
      type: object
      required: [retentionMonths, minRetentionMonths, rowVersion]
      properties:
        retentionMonths:
          type: integer
          minimum: 6
        minRetentionMonths:
          type: integer
          minimum: 6
          description: 设计下限（当前恒为 6）；服务端仍是唯一权威。
        rowVersion:
          type: integer
          minimum: 1
          description: 乐观并发前提（HTTP-COMMAND-002）。
        updatedAt:
          type: [string, 'null']
          format: date-time
        updatedBy:
          type: [string, 'null']
          description: 最近修改者描述（如 admin:<locator>）；从未修改为 null。
        cleanup:
          oneOf:
            - $ref: '#/components/schemas/AuditCleanupStatus'
            - type: 'null'
    AuditSettingsPatchRequest:
      type: object
      required: [retentionMonths, expectedRowVersion, clientCommandId]
      properties:
        retentionMonths:
          type: integer
          minimum: 6
        cleanupEnabled:
          type: boolean
          description: 省略时保持当前清理开关不变。
        expectedRowVersion:
          type: integer
          minimum: 1
        clientCommandId:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
    AuditSettingsPreviewRequest:
      type: object
      required: [retentionMonths]
      properties:
        retentionMonths:
          type: integer
          minimum: 6
    AuditSettingsPreview:
      type: object
      required: [retentionMonths, currentRetentionMonths, shortening, estimatedExpirableEvents, estimatedExpirableCorrelations]
      description: 保留变更的影响预估；估算值只是决策辅助，绝不构成删除承诺。
      properties:
        retentionMonths:
          type: integer
          minimum: 6
        currentRetentionMonths:
          type: integer
          minimum: 6
        shortening:
          type: boolean
        cutoffAt:
          type: [string, 'null']
          format: date-time
          description: 该边界之前记录的事件在变更落地后可过期；不是删除承诺。
        estimatedExpirableEvents:
          type: integer
          minimum: 0
        estimatedExpirableCorrelations:
          type: integer
          minimum: 0
    AlertChangeEvent:
      type: object
      required: [seq, type, occurrenceId, rowVersion]
      properties:
        seq:
          $ref: '#/components/schemas/ChangeSeq'
          description: "alert_change_seq（与 SSE id: 行一致）；事件中恒 ≥1。"
        type:
          type: string
          enum: [created, state_changed]
        occurrenceId:
          $ref: '#/components/schemas/LocatorId'
        rowVersion:
          type: integer
          minimum: 1
    ResyncRequiredEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: resync_required