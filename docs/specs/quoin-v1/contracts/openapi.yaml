openapi: 3.1.0
info:
  title: Quoin v1 API
  version: 1.0.0-draft
  description: |
    Quoin v1 HTTP 与实时 API 的唯一机器权威（SPEC-VERSION-002 要求 /api/v1）。
    语义、跨请求事务、认证/会话、错误分类、回放/resync、上传下载与取消 fence
    由 docs/specs/quoin-v1/http-api.md（CATEGORY=HTTP）承载；
    本文件只承载路由、方法、字段、状态码与可机械表达的 HTTP 契约。
    领域语义权威为 CONTEXT.md；持久化语义权威为 persistence.md 与 contracts/sql/schema.sql。
servers:
  - url: /
security:
  - sessionCookie: []
x-quoin-security:
  publicOriginSource: deployment-config
  forwardedHeadersTrustedOnlyFromConfiguredProxyCidrs: true
  sessionCookie:
    name: __Host-quoin-session
    rawBytes: 32
    persistedForm: sha256-digest-only
    secure: true
    httpOnly: true
    sameSite: Lax
    path: /
    domainAttribute: forbidden
    acceptedTransport: cookie-only
  flowCookie:
    name: __Host-quoin-flow
    rawBytes: 32
    persistedForm: sha256-digest-only
    secure: true
    httpOnly: true
    sameSite: Lax
    path: /
    domainAttribute: forbidden
    acceptedTransport: cookie-only
    issuedBy: [startAuthentication, startContactChange]
    ttl: initialization 30m; login second-factor 15m
    sessionAcceptance: never（Session 认证绝不读取 auth_flows）
  csrf:
    unsafeCookieRequestMissingOriginAndFetchMetadata: reject
    loginMissingOriginAndFetchMetadata: reject
    loginAllowedWithoutOriginFetchSite: same-origin
    websocketOrigin: exact-public-origin
  protectedResponseHeaders:
    xContentTypeOptions: nosniff
    referrerPolicy: no-referrer
    contentSecurityPolicyOwner: quoin-central-policy
    hstsOwner: tls-termination-layer
  reveal:
    rawSecretBytes: 32
    handleTtlSeconds: 60
    consumption: same-session-once
    persistence: forbidden
  rootKey:
    source: read-only-file
    bytes: 32
    aead: AES-256-GCM
    nonceBytes: 12
  maintenanceDefault: deny
  sensitiveDownloadBearerUrl: forbidden
  description: 安全跨协议语义由 security.md 拥有；这些值用于机器校验默认拒绝边界（SEC-CSRF-*、SEC-MAINT-*、SEC-DOWNLOAD-*）。
tags:
  - name: auth
    description: 认证流程（登录/初始化/恢复）、登出、当前用户、密码与 Session 管理
  - name: admin
    description: Admin 用户与审计管理
  - name: maintenance
    description: 恢复、升级与根密钥 rebind 的隔离状态和安全退出
  - name: alerts
    description: 告警列表、详情、初步分析与接入问题
  - name: investigations
    description: 调查对话、附件、Undo 与执行尝试
  - name: inspections
    description: 巡检运行、报告与分析
  - name: knowledge
    description: 知识浏览、导入批次、候选确认与反馈
  - name: config
    description: 业务系统 YAML、Label Contract 与观测资源
  - name: adminops
    description: 连接、模型供应商、告警源、Runtime、备份与凭据管理
  - name: files
    description: Artifact 与来源材料的上传下载
  - name: realtime
    description: SSE 变更流
paths:
  /api/v1/inspections/plans:
    get:
      tags:
      - inspections
      operationId: listPluginInspectionPlans
      responses:
        '200':
          description: 实际持久化的结果。
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PluginInspectionPlan'
                  nextCursor:
                    $ref: '#/components/schemas/Cursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      summary: 独立巡检计划列表
    post:
      tags:
      - inspections
      operationId: createPluginInspectionPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginInspectionPlanInput'
      responses:
        '201':
          description: 实际持久化的结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInspectionPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: 创建独立巡检计划
  /api/v1/inspections/plans/{planKey}:
    parameters:
    - name: planKey
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - inspections
      operationId: getPluginInspectionPlan
      responses:
        '200':
          description: 实际持久化的结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInspectionPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: 读取独立巡检计划
    put:
      tags:
      - inspections
      operationId: updatePluginInspectionPlan
      description: 更新必须携带 expectedRowVersion 和 clientCommandId。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/PluginInspectionPlanInput'
              - type: object
                required:
                - expectedRowVersion
      responses:
        '200':
          description: 实际持久化的结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInspectionPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: 更新独立巡检计划
  /api/v1/business-views:
    get:
      tags:
      - adminops
      operationId: listBusinessViews
      description: 所有完整登录会话可读取筛选列表；Operator 仅获得 viewKey/displayName，其他字段为零值；详情与写操作仍仅 Admin。
      responses:
        '200':
          description: 实际持久化的结果。
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BusinessView'
                  nextCursor:
                    $ref: '#/components/schemas/Cursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      summary: 可选业务视图列表
    post:
      tags:
      - adminops
      operationId: createBusinessView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessViewInput'
      responses:
        '201':
          description: 实际持久化的结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: 创建业务视图
  /api/v1/business-views/{viewKey}:
    parameters:
    - name: viewKey
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - adminops
      operationId: getBusinessView
      responses:
        '200':
          description: 实际持久化的结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: 读取业务视图
    put:
      tags:
      - adminops
      operationId: updateBusinessView
      description: 更新必须携带 expectedRowVersion 和 clientCommandId；viewKey 由路径唯一携带，请求体不重复。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessViewRequest'
      responses:
        '200':
          description: 实际持久化的结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: 更新业务视图
  /api/v1/enrichment-rules:
    get:
      tags:
      - adminops
      operationId: listEnrichmentRules
      responses:
        '200':
          description: 实际持久化的结果。
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnrichmentRule'
                  nextCursor:
                    $ref: '#/components/schemas/Cursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      summary: 富化规则列表（ADR-0012）
    post:
      tags:
      - adminops
      operationId: createEnrichmentRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrichmentRuleInput'
      responses:
        '201':
          description: 实际持久化的结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichmentRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      summary: 创建富化规则
  /api/v1/enrichment-rules/{ruleKey}:
    parameters:
    - name: ruleKey
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - adminops
      operationId: getEnrichmentRule
      responses:
        '200':
          description: 实际持久化的结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichmentRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: 读取富化规则
    put:
      tags:
      - adminops
      operationId: updateEnrichmentRule
      description: 更新必须携带 expectedRowVersion 和 clientCommandId；ruleKey 由路径唯一携带，请求体不重复。规则永不删除——退役 = enabled=0，key 不复用；更新不回写任何已冻结的首观测富化文档。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnrichmentRuleRequest'
      responses:
        '200':
          description: 实际持久化的结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichmentRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: 更新富化规则
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: loginWithPassword
      x-quoin-maintenance-access: allowed
      x-quoin-csrf-mode: pre-auth-same-origin
      x-quoin-cache-control: no-store
      summary: 单步本地登录（应急通道）
      description: |
        密码校验与完整会话签发在同一事务内完成（ADR-0010）：成功即 Set-Cookie 写入
        __Host-quoin-session 并返回用户投影；外部（OIDC）账号与已过期的初始管理员
        密码被确定性拒绝。登录成功与失败各落一行 auth.login.local 审计。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录完成；Set-Cookie 写入 __Host-quoin-session（Secure HttpOnly SameSite=Lax Path=/）。passwordChangeRequired=true 的会话受限，须先完成 PUT /auth/password。
          headers:
            Set-Cookie:
              description: 32-byte opaque session bearer；必须包含 Secure、HttpOnly、SameSite=Lax、Path=/，不得包含 Domain。
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 初始管理员密码已过期（initial_password_expired），须运维执行 quoin admin recover。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/config:
    get:
      tags: [auth]
      operationId: readAuthConfig
      x-quoin-maintenance-access: allowed
      x-quoin-cache-control: no-store
      summary: 公开登录通道投影
      description: |
        登录页的配置驱动渲染来源（ADR-0010）：本地通道的启用/可见状态与 OIDC
        按钮显示名/图标。不携带任何敏感配置——client_secret 与 secretsFile
        路径永不出现。
      security: []
      responses:
        '200':
          description: 登录通道投影。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/oidc/login:
    get:
      tags: [auth]
      operationId: beginOIDCLogin
      x-quoin-maintenance-access: allowed
      summary: 发起 OIDC 授权码跳转
      description: |
        生成 state/nonce/PKCE S256 并以 HMAC 签名的短时 __Host-quoin-oidc-state
        cookie 携带往返凭据，302 到 IdP 授权端点；return_to 仅接受站内相对路径。
        IdP 不可达时 302 回 /login?error=idp_unavailable。
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          schema:
            type: string
          description: 登录完成后的站内回跳路径；非站内相对路径一律回退到 /。
      responses:
        '302':
          description: 跳转到 IdP 授权端点（或失败时 /login?error=<码>）。
  /api/v1/auth/oidc/callback:
    get:
      tags: [auth]
      operationId: completeOIDCLogin
      x-quoin-maintenance-access: allowed
      summary: OIDC 回调：换 code、验 ID Token、签发会话
      description: |
        后端完成 code 换 token（PKCE verifier）、ID Token 校验（iss/aud/exp/nonce）
        与 identities(issuer,subject) 解析或 JIT 建档；token 用后即弃。成功 302 到
        return_to 并写入 __Host-quoin-session；失败 302 到 /login?error=<稳定错误码>
        （state_invalid/account_disabled/idp_unavailable/access_denied/login_rejected）。
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: 成功回跳 return_to（写会话 cookie）；失败回跳 /login?error=<码>（清理 state cookie）。
  /api/v1/auth/activity:
    post:
      tags: [auth]
      operationId: touchSessionActivity
      x-quoin-maintenance-access: allowed
      x-quoin-cache-control: no-store
      summary: 续期当前 Session 的活动窗口
      description: 有节流（距上次活动不足 30 分钟时静默无操作）；idle 续期永不越过绝对上限。SSE 心跳与后台轮询不得调用。
      responses:
        '204':
          description: 活动已记录（或处于节流窗口内无操作）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/contacts:
    get:
      tags: [auth]
      operationId: listOwnContacts
      x-quoin-cache-control: no-store
      summary: 当前用户的收码联系方式（掩码投影）
      description: 任何已完成初始化的登录用户可读自己的收码渠道列表；明文目标永不出服务器，更换仍走 contact-change（管理员自助）或管理员代改（操作员）。
      responses:
        '200':
          description: 当前用户的掩码联系方式列表。
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthFlowContact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      x-quoin-maintenance-access: allowed
      x-quoin-cache-control: no-store
      summary: 登出并撤销当前 Session
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '204':
          description: 当前 Session 已撤销；Set-Cookie 清除 __Host-quoin-session。
          headers:
            Set-Cookie:
              description: 清除 __Host-quoin-session（Max-Age=0；保持 Secure、HttpOnly、SameSite=Lax、Path=/ 且无 Domain）。
              schema:
                type: string
            Clear-Site-Data:
              description: 清除当前 Origin 的 cache、cookies 与 storage；不得包含 executionContexts。
              schema:
                type: string
                const: '"cache", "cookies", "storage"'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
            Pragma:
              $ref: '#/components/headers/NoCachePragma'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      x-quoin-maintenance-access: allowed
      x-quoin-cache-control: no-store
      summary: 当前用户与强制改密状态
      description: 受限 Session（password_change_required=1）唯一允许的读操作之一（HTTP-AUTH-006）。
      responses:
        '200':
          description: 当前用户信息。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/password:
    put:
      tags: [auth]
      operationId: changeOwnPassword
      x-quoin-maintenance-access: allowed
      x-quoin-cache-control: no-store
      summary: 修改当前用户密码
      description: 成功改密在同一事务清除 password_change_required（DATA-AUTH-001）；撤销除当前外的其他 Session 并更新当前 Session revision（CONTEXT「本地账号认证」）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: 密码已修改，强制改密标志已清除。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/sessions:
    get:
      tags: [auth]
      operationId: listOwnSessions
      x-quoin-cache-control: no-store
      summary: 列出当前用户的全部 Session
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: 当前用户的 Session 分页列表。
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionInfo'
                  nextCursor:
                    $ref: '#/components/schemas/Cursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/sessions/{sessionId}/revoke:
    post:
      tags: [auth]
      operationId: revokeOwnSession
      x-quoin-cache-control: no-store
      summary: 撤销当前用户的其他 Session（不得撤销当前 Session）
      parameters:
