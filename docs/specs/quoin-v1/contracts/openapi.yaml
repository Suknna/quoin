      summary: 轮换告警源 Bearer（Admin；两段式：先建新凭据元数据，再经一次性 reveal 显示 Bearer）
      description: 轮换期最多短期并存新旧两个有效凭据；吊销旧凭据必须在新凭据确认使用后（CONTEXT「告警源凭据投影」）。响应只含非秘密元数据；首次实时响应携带内存短生命周期、单次使用的 revealHandle，由 `revealAlertSourceCredential` 一次性换取 raw Bearer（HTTP-COMMAND-008）。命令重放返回 revealAvailable=false 且无 handle，绝不重新创建凭据。
      parameters:
        - $ref: '#/components/parameters/SourceKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
