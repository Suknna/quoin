                  type: integer
                  minimum: 1
                  description: 显式目标 Label Contract 版本（label_contracts.version）；候选版本校验不静默使用当前契约（DATA-CONFIG-003）。
                journeyCatalogDigest:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                  description: 可选；提供时必须等于 Quoin 嵌入的 Journey Catalog digest，否则 422；未提供时记录嵌入 digest（DATA-CONFIG-008）。
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '409':
          $ref: '#/components/responses/Conflict'
