      description: Quoin 生成 32-byte 高熵 Bearer 并只保存 digest。命令响应只含非秘密元数据；revealAvailable=true 时携带固定 60 秒、同 Session、单次成功消费的 revealHandle，由 `revealAlertSourceCredential` 换取 raw Bearer。同 Session 以相同 clientCommandId 重放时，仍有效且未消费则返回同一 handle，否则 revealAvailable=false；绝不重新创建凭据（SEC-REVEAL-*）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertSourceRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: 来源与首个凭据已创建；首次实时响应可能携带 revealHandle（revealAvailable=true）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSourceCredentialMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
