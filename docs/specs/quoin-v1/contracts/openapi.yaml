          required: true
          schema:
            $ref: '#/components/schemas/LocatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedCommandRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
