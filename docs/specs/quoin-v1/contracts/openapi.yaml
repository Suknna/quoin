      summary: 流式上传文本附件到 staging（multipart；正文作为 Artifact）
      description: 每条消息最多一个附件；正文须有效 UTF-8、无 NUL、默认 ≤10 MiB；文件名只是审计元数据（DATA-ATTACH-001）。上传结果由后续 send-message 原子消费（HTTP-FILE-001/002）。
      parameters:
        - $ref: '#/components/parameters/InvestigationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, clientCommandId]
              properties:
                file:
                  type: string
                  format: binary
                  description: 纯文本附件（不依赖扩展名判断内容）。
                clientCommandId:
                  type: string
                  minLength: 8
                  maxLength: 128
                  pattern: '^[A-Za-z0-9_-]+$'
                  description: 客户端生成的幂等命令 ID（HTTP-COMMAND-001）。
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '201':
          description: staging Artifact 已登记。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
