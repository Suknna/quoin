      description: 最多并存两个可认证 generation；新凭据首个成功 Delivery 会把旧凭据机械标记 PendingRetirement，只有 Admin 显式退休，系统不设 TTL。响应的 60 秒同 Session reveal handle 与命令重放遵循 SEC-REVEAL-*，绝不重新创建凭据。
      parameters:
