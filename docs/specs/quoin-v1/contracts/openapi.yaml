  responses:
    BadRequest:
      description: 请求语法错误（400）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    Unauthorized:
      description: 未认证或 Session 无效（401）；统一失败信息，不区分用户不存在/密码错误/禁用。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    Forbidden:
      description: 权限不足或受限 Session（403）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    NotFound:
      description: 资源不存在（404）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    Conflict:
      description: 版本/幂等/active 冲突（409）；冲突信息包含当前对象与版本（HTTP-ERROR-004）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ConflictErrorModel'
    Gone:
      description: 资源已过期或回放游标不再可用（410）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    PayloadTooLarge:
      description: 超过请求体/文件大小上限（413）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    UnsupportedMedia:
      description: 不支持的媒体类型（415）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    Unprocessable:
      description: 语法有效但领域/校验失败（422）；field_errors 逐项给出路径、原因与修复提示。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    RateLimited:
      description: 部署级速率限制（429）。
      headers:
        Retry-After:
          description: 重试等待时间（HTTP 日期或延迟秒数；HTTP-ERROR-006）。
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    InternalError:
      description: 已受理操作的强制 Artifact/profile 提交失败（500；code=artifact_commit_failed）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    ServiceUnavailable:
      description: 服务不可用/维护中（503）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
  schemas:
    LocatorId:
      type: string
      description: 64-bit 技术 locator 的十进制字符串表示（DATA-IDENT-002）；词法范围限定为有符号 64-bit 正整数 1..9223372036854775807（SQLite INTEGER / Go / Proto int64 上限），无前导零，超出 JS 安全整数仍必须按字符串处理。
      pattern: '^(([1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-7]))$'
      example: '9223372036854775807'
    NullableLocatorId:
      anyOf:
        - $ref: '#/components/schemas/LocatorId'
        - type: 'null'
      description: 可空 locator；null 表示“当前无该对象”（如新调查无 head、首次发布无当前已发布版本）。JSON Schema 2020-12 表达，不使用已废弃的 nullable 关键字。
    ChangeSeq:
      type: string
      description: 单调递增序列（alert_change_log.id / task_change_log.id）的十进制字符串表示；"0" 表示日志为空（空库/无任务），事件中的 seq 恒 ≥1；词法范围限定为有符号 64-bit 非负整数 0..9223372036854775807。超出 JS 安全整数仍必须按字符串处理（HTTP-SCOPE-002）。
      pattern: '^(0|([1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-7]))$'
      example: '0'
    StableKey:
      type: string
      minLength: 1
      maxLength: 200
      description: 用户维护的稳定 key（业务系统 key、连接名、告警源 key 等）。
    Cursor:
      type: string
      description: 不透明分页游标；绑定过滤器与排序（跨排序/过滤变化无效，HTTP-PAGE-001）。快照列表（listAlerts/getTaskSnapshot）的游标额外绑定首页 snapshotSeq、由服务端签名并带短有效期，过期返回 410（resource_expired），客户端重新从首页读取（HTTP-PAGE-006）。
    Timestamp:
      type: string
      format: date-time
      description: RFC3339 UTC 时间（如 2026-08-13T02:00:00.123456789Z）。
    CommandBase:
      type: object
      required: [clientCommandId]
      properties:
        clientCommandId:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
          description: 客户端生成、用户不可见的幂等命令 ID；按 (principal, client_command_id) 唯一（HTTP-COMMAND-001）。
    ExpectedRowVersion:
      type: object
      required: [expectedRowVersion]
      properties:
        expectedRowVersion:
          type: integer
          minimum: 1
          description: 修改当前状态/current 指针命令的并发前提；包含在请求摘要中（HTTP-COMMAND-002）。
    CommandRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
    VersionedCommandRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/ExpectedRowVersion'
      description: 修改当前状态/current 指针但非取消语义的领域命令（HTTP-COMMAND-002）。
    CancelRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/ExpectedRowVersion'
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 200
        password:
          type: string
          minLength: 15
          maxLength: 128
          description: 15–128 Unicode 字符（NFC 规范化后校验）；弱密码检查与有界冷却由部署层执行。
    UserSummary:
      type: object
      required: [id, username, displayName, role, enabled, authRevision, rowVersion, passwordChangeRequired]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, operator]
        enabled:
          type: boolean
        authRevision:
          type: integer
          minimum: 1
          description: 账号变更裁决依据（DATA-TX-002）；与 rowVersion 相互独立：authRevision 由账号变更事务递增，rowVersion 由任何用户行 UPDATE 恰好递增 1。
        rowVersion:
          type: integer
          minimum: 1
          description: 用户行并发前提（HTTP-COMMAND-002）；与 authRevision 独立，任何 UPDATE 恰好递增 1（DATA-AUTH-004）。
        passwordChangeRequired:
          type: boolean
          description: 受限 Session 依据（DATA-AUTH-001/002）。
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 15
          maxLength: 128
        newPassword:
          type: string
          minLength: 15
          maxLength: 128
          description: 15–128 Unicode 字符；成功改密在同一事务清除强制改密标志并撤销其他 Session。
    SessionInfo:
      type: object
      required: [id, createdAt, lastActiveAt, idleExpiresAt, absoluteExpiresAt, current]
      properties:
        id:
          $ref: '#/components/schemas/LocatorId'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastActiveAt:
          $ref: '#/components/schemas/Timestamp'
        idleExpiresAt:
          $ref: '#/components/schemas/Timestamp'
        absoluteExpiresAt:
          $ref: '#/components/schemas/Timestamp'
        current:
          type: boolean
          description: 是否为当前请求使用的 Session。
    CreateUserRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - type: object
          required: [username, displayName, role, password]
          properties:
            username:
              type: string
              maxLength: 200
            displayName:
              type: string
              maxLength: 200
            role:
              type: string
              enum: [admin, operator]
            password:
              type: string
              minLength: 15
              maxLength: 128
              description: 15–128 Unicode 字符。
    UpdateUserRequest:
      allOf:
        - $ref: '#/components/schemas/CommandBase'
        - $ref: '#/components/schemas/ExpectedRowVersion'
        - type: object
          properties:
            displayName:
              type: string
              maxLength: 200
            enabled:
              type: boolean
            role:
              type: string
              enum: [admin, operator]
          anyOf:
            - required: [displayName]
            - required: [enabled]
            - required: [role]
      description: 至少提供一个变更字段（anyOf 强制）；expectedRowVersion 取当前 UserSummary.rowVersion（与 authRevision 独立）；禁用/降级最后一个有效 Admin 冲突（DATA-TX-014）。
    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 15
          maxLength: 128
          description: 临时密码；重置后 password_change_required=1 并要求首次登录修改（CONTEXT「管理员离线恢复」）。
    ResetPasswordPayload:
      type: object
      required: [user, revokedSessionCount]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        revokedSessionCount:
          type: integer
          minimum: 0
          description: 本事务从有效变为撤销的 Session 数；所有旧 Session 即使并发请求已读到 bearer，也会因 authRevision 不匹配而认证失败。
    SessionRevocationPayload:
      type: object
      required: [revokedSessionCount]
      properties:
        revokedSessionCount:
          type: integer
          minimum: 0
          description: 本事务从有效变为撤销的 Session 数。
    ErrorModel:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: 稳定机器错误码（HTTP-ERROR-002）。
        message:
          type: string
          description: 面向人的普通语言错误说明（先说明影响与恢复方式，不暴露内部细节）。
        requestId:
          type: string
          description: 本次请求的关联 ID（供排查）。
        retryable:
          type: boolean
          description: 使用同一 client_command_id 重试是否安全（HTTP-ERROR-005）。
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    ConflictErrorModel:
      allOf:
        - $ref: '#/components/schemas/ErrorModel'
        - type: object
          required: [conflict]
          properties:
            conflict:
              oneOf:
                - $ref: '#/components/schemas/CommandIdReuseConflict'
                - $ref: '#/components/schemas/RowVersionConflict'
                - $ref: '#/components/schemas/HeadConflict'
                - $ref: '#/components/schemas/CurrentPointerConflict'
                - $ref: '#/components/schemas/RuntimeSlotConflict'
                - $ref: '#/components/schemas/IdentityBusyConflict'
                - $ref: '#/components/schemas/AuthenticationRequiredConflict'
      description: 409 冲突响应的专用包络：conflict 块按 code 判别联合（HTTP-ERROR-004/007）。
    FieldError:
      type: object
      required: [path, reason]
      properties:
        path:
          type: string
          description: 字段路径（如 config.discoveries[0].identityLabels）。
        reason:
          type: string
        remediation:
          type: string
          description: 可操作修复提示。
    CommandIdReuseConflict:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          const: command_id_reused
          description: 相同 client_command_id 但不同请求摘要（HTTP-COMMAND-003）；纯追加命令可能无结果对象，因此不强制 objectType/objectId/版本字段。
        clientCommandId:
          type: string
          description: 冲突的命令 ID。
        objectType:
          type: string
          description: 原命令结果对象类型（无结果对象时省略）。
        objectId:
          $ref: '#/components/schemas/LocatorId'
        detail:
          type: string
          description: 人类可读冲突说明（HTTP-ERROR-004）。
    RowVersionConflict:
      type: object
      required: [code, objectType, objectId, rowVersion]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [row_version_conflict, active_conflict]
        objectType:
          type: string
        objectId:
          $ref: '#/components/schemas/LocatorId'
        rowVersion:
          type: integer
          description: 当前权威 row_version（供客户端重试回填）。
        detail:
          type: string
          description: 人类可读冲突说明（HTTP-ERROR-004）。
      not:
        properties:
          objectType:
            const: runtime_slot
        required: [objectType]
      description: 通用聚合 row_version/active 冲突；objectType 为 runtime_slot 的冲突必须使用 RuntimeSlotConflict（slot 是稳定 key 而非数字 locator）。
    RuntimeSlotConflict:
      type: object
      required: [code, objectType, slot, rowVersion]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [row_version_conflict, active_conflict]
        objectType:
          type: string
          const: runtime_slot
        slot:
          type: string
          enum: [plinth, lintel]
          description: 冲突的 Runtime slot 稳定 key（替代通用 objectId，HTTP-ERROR-004）。
        rowVersion:
          type: integer
          description: 当前权威 runtime_slots.row_version（供客户端重试回填）。
        detail:
          type: string
          description: 人类可读冲突说明（HTTP-ERROR-004）。
    IdentityBusyConflict:
      type: object
      required: [code, identityId, browserOperationId, operationKind, occupiedSince]
      additionalProperties: false
      properties:
        code:
          type: string
          const: identity_busy
        identityId:
          $ref: '#/components/schemas/LocatorId'
        browserOperationId:
          $ref: '#/components/schemas/LocatorId'
        operationKind:
          type: string
          enum: [manual_login, authentication_probe, journey, exploration]
        occupiedSince:
          $ref: '#/components/schemas/Timestamp'
        detail:
          type: string
    AuthenticationRequiredConflict:
      type: object
      required: [code, identityId, currentRevisionId, currentProfileGenerationId]
      additionalProperties: false
      properties:
        code:
          type: string
          const: authentication_required
        identityId:
          $ref: '#/components/schemas/LocatorId'
        currentRevisionId:
          $ref: '#/components/schemas/LocatorId'
        currentProfileGenerationId:
          $ref: '#/components/schemas/NullableLocatorId'
        detail:
          type: string
    HeadConflict:
      type: object
      required: [code, objectType, objectId, headMessageId]
      additionalProperties: false
      properties:
        code:
          type: string
          const: head_conflict
        objectType:
          type: string
        objectId:
          $ref: '#/components/schemas/LocatorId'
        headMessageId:
          $ref: '#/components/schemas/NullableLocatorId'
          description: 当前 head 消息 locator；null 表示当前无 head（调查已撤回全部消息）。
        detail:
          type: string
          description: 人类可读冲突说明（HTTP-ERROR-004）。
    CurrentPointerConflict:
      type: object
      required: [code, objectType, objectId, currentVersionId]
      additionalProperties: false
      properties:
        code:
          type: string
          const: current_pointer_conflict
        objectType:
          type: string
        objectId:
          $ref: '#/components/schemas/LocatorId'
        currentVersionId:
          $ref: '#/components/schemas/NullableLocatorId'
          description: 当前已发布配置版本/当前激活契约 locator；null 表示当前无该指针目标（首次发布前）。
        detail:
          type: string
          description: 人类可读冲突说明（HTTP-ERROR-004）。
    SetupResponse:
      type: object
      required: [items, alertingAvailable, inspectionAvailable]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SetupItem'
        alertingAvailable:
          type: boolean
        inspectionAvailable:
          type: boolean
    SetupItem:
      type: object
      required: [id, label, state]
      properties:
        id:
          type: string
          description: 稳定项目 ID（如 model-provider、thanos-connection、kubernetes-connection、plinth、lintel、label-contract、business-system、browser-identity、alert-source、backup-target）。
        label:
          type: string
        state:
          type: string
          enum: [ready, missing, pending, error]
        dependencies:
          type: array
          items:
            type: string
        action:
          type: string
          description: 直接修复入口（路由或操作引用）。
    RuntimeSlot:
      type: object
      required: [slot, state, currentGeneration, rowVersion, connected]
      additionalProperties: false
      properties:
        slot:
          type: string
          enum: [plinth, lintel]
        state:
          type: string
          enum: [unregistered, registered, revoked]
          description: 持久注册/凭据状态（DATA-RUNTIME-001）；registered 表示 current 指针非空且指向本 slot 未退休凭据，不代表当前在线。
        currentGeneration:
          type: integer
          minimum: 0
          description: 从 runtime_slots.current_credential_id 指向的 runtime_credentials.generation 投影（指针是唯一权威，DATA-RUNTIME-001）；0 = 无 current 指针。
        pendingGeneration:
          type: integer
          minimum: 1
          description: 从 runtime_slots.pending_credential_id 指向的 runtime_credentials.generation 投影；两阶段轮换中待确认的 generation（仅 registered 且轮换期间存在；DATA-RUNTIME-002）。
        rowVersion:
          type: integer
          minimum: 1
          description: 注册/替换/轮换命令并发前提与响应版本（HTTP-COMMAND-002）。
        connected:
          type: boolean
          description: 瞬时连接投影（内存，非持久权威）：控制流当前是否在线。必填；false 时不得携带 bootId/connectionEpoch/lastSeenAt。
        bootId:
          type: string
          description: 瞬时连接投影：当前控制流 Runtime boot ID（仅 connected=true 时存在）。
        connectionEpoch:
          type: integer
          minimum: 1
          description: 瞬时连接投影：当前控制流递增 connection epoch（仅 connected=true 时存在）。
        lastSeenAt:
          $ref: '#/components/schemas/Timestamp'
          description: 瞬时连接投影：最近心跳时间（内存，非持久权威；仅 connected=true 时存在）。
      allOf:
        - if:
            properties:
              state:
                const: registered
            required: [state]
          then:
            properties:
              currentGeneration:
                minimum: 1
        - if:
            properties:
              state:
                enum: [unregistered, revoked]
            required: [state]
          then:
            properties:
              currentGeneration:
                const: 0
              pendingGeneration: false
        - if:
            properties:
              connected:
                const: true
            required: [connected]
          then:
            properties:
              bootId: {}
              connectionEpoch: {}
              lastSeenAt: {}
            required: [bootId, connectionEpoch, lastSeenAt]
        - if:
            properties:
              connected:
                const: false
            required: [connected]
          then:
            properties:
              bootId: false
              connectionEpoch: false
              lastSeenAt: false
    RuntimeSlotReplacement:
      type: object
      required: [slot, state, currentGeneration, rowVersion, registrationTokenAvailable]
      additionalProperties: false
      properties:
        slot:
          type: string
          enum: [plinth, lintel]
        state:
          type: string
          const: revoked
          description: 替换后 slot 恒为 revoked，等待新 Runtime 用注册令牌注册（DATA-RUNTIME-001）。
        currentGeneration:
          type: integer
          const: 0
          description: 替换后 current/pending 指针皆空，恒为 0。
        rowVersion:
          type: integer
          minimum: 1
        registrationTokenAvailable:
          type: boolean
          description: 仅首次实时响应为 true（同次请求后立即生成内存 revealHandle）；命令重放恒为 false（HTTP-COMMAND-012）。
        registrationTokenHandle:
          type: string
          description: 不透明、内存中短生命周期、单次使用的 reveal 句柄；仅 registrationTokenAvailable=true 时存在；不落盘（SQLite/日志/审计/Artifact/命令结果均禁止）（HTTP-COMMAND-012）。
      allOf:
        - if:
            properties:
              registrationTokenAvailable:
                const: true
            required: [registrationTokenAvailable]
          then:
            properties:
              registrationTokenHandle: {}
            required: [registrationTokenHandle]
          else:
            properties:
              registrationTokenHandle: false
    RuntimeRegistrationTokenRevealRequest:
      type: object
      required: [registrationTokenHandle]
      additionalProperties: false
      properties:
        registrationTokenHandle:
          type: string
          description: replaceRuntimeSlot 首次实时响应返回的一次性句柄；不接受 slot 本身（HTTP-COMMAND-012）。
    RuntimeRegistrationTokenRevealResult:
      type: object
      required: [slot, generation, registrationToken]
      additionalProperties: false
      properties:
        slot:
          type: string
          enum: [plinth, lintel]
          description: handle 绑定的 slot（reveal 路由无 slot 路径参数，slot 由 handle 携带）。
        generation:
          type: integer
          minimum: 1
          description: 注册令牌绑定的 credential generation；Register 请求必须回显同一值（HTTP-COMMAND-012、RUNTIME-REG-002）。
        registrationToken:
          type: string
          description: 一次性注册令牌（32 随机字节 base64url 无填充文本）；仅此一次返回，绑定 slot 与 generation，内存短生命周期；不进入日志、审计或命令结果（HTTP-COMMAND-012、RUNTIME-AUTH-006）。
