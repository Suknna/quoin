    post:
      tags: [adminops]
      operationId: retireAlertSourceCredential
      summary: 吊销告警源凭据（Admin；Active -> Retired）
      description: |
        领域写命令（HTTP-COMMAND-009）：携带 clientCommandId 与 expectedRowVersion（DATA-ALERT-009）。
        仅允许 Active -> Retired：同一事务写入 retiredAt 并递增凭据 rowVersion；凭据必须属于路径中的
        sourceKey（跨来源 404）。相同命令 ID 重放返回原结果（HTTP-COMMAND-003）；新命令针对已 Retired
        凭据返回 409（row_version_conflict）。吊销与 Delivery 按 DATA-TX-003 提交顺序裁决。
      parameters:
        - $ref: '#/components/parameters/SourceKey'
        - $ref: '#/components/parameters/CredentialId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetireCredentialRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: 凭据已吊销；返回当前权威 CredentialSummary（rowVersion 已递增）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/alert-sources/credentials/reveal:
    post:
      tags: [adminops]
      operationId: revealAlertSourceCredential
      summary: 一次性显示新建凭据的 Bearer（Admin；消费单次 reveal handle）
      description: |
        非领域写命令（HTTP-COMMAND-008）：不携带 clientCommandId；只接受创建/轮换命令
        首次实时响应中返回的内存短生命周期、单次使用的 revealHandle，不接受 source/credential ID。
        handle 与 raw Bearer 均不落盘（SQLite、client_commands、日志、审计、Artifact、响应快照均禁止）；
        handle 无效、已消费或过期返回 410；会话无效 401；角色不足 403。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevealCredentialRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: 一次性返回 raw Bearer；消费后 handle 立即失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealCredentialResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          $ref: '#/components/responses/Gone'
