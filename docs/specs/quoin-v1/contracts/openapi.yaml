      tags: [adminops]
      operationId: revealAlertSourceCredential
      x-quoin-maintenance-access: trust-rebuild
      summary: 一次性显示新建凭据的 Bearer（Admin；消费单次 reveal handle）
      description: |
         非领域写命令（HTTP-COMMAND-008）：不携带 clientCommandId；只接受创建/轮换命令返回的
         内存 60 秒、同 Session、单次成功消费 revealHandle，不接受 source/credential ID。消费前重验
         当前 Session 与 Admin，并先写不含 handle/raw 的 Audit Event。handle 与 raw Bearer 均不落盘；
         handle 无效、已消费或过期返回 410；会话无效 401；角色不足 403（SEC-REVEAL-*）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevealCredentialRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: 一次性返回 raw Bearer；消费后 handle 立即失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealCredentialResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          $ref: '#/components/responses/Gone'
