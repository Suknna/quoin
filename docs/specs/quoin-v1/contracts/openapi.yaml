  /api/v1/alerts:
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: 告警快照列表（含 snapshot_seq 与 row_version；游标绑定快照 seq）
      description: |
        默认只返回 Firing；Resolved 通过 state 过滤。普通列表不包含 IdentityConflict 等接入问题（CONTEXT「告警列表与详情」）。
        快照契约（HTTP-PAGE-006/HTTP-SSE-001）：snapshotSeq 取当前最大 alert_change_log.id（最新行由触发器保留，DATA-SSE-009；当前最大
        alert_change_log.id，DATA-SSE-009）；首响应生成服务端签名的短有效期游标（绑定首页 snapshotSeq 与键集位置），
        后续页回传同一 snapshotSeq，客户端以首页 snapshotSeq 建立 SSE（after）——分页期间的变化由事件回放补齐，无漏更新；
        游标过期返回 410（resource_expired），客户端重新从首页读取。
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [Firing, Resolved]
        - name: viewKey
          in: query
          description: 按冻结的视图关联过滤（ADR-0012）：occurrence 命中该视图的任一冻结关联行即入选；设置后平台内部故障不并入列表。
          schema:
            $ref: '#/components/schemas/StableKey'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '410':
          $ref: '#/components/responses/Gone'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: 告警快照。
          content:
