  /api/v1/maintenance/upgrade/prepare:
    post:
      tags: [maintenance]
      operationId: prepareUpgrade
      x-quoin-maintenance-access: upgrade-prepare
      x-external-dependency: true
      summary: 进入升级维护并调和到可安全停机（Admin）
      description: |
        幂等版本化命令。首次调用在单个事务中进入 reason=Upgrade 的 maintenance、阻止新业务工作并创建当前 revision
        的非空确定性清单。后台调和器持续把 active Attempt 项投影为 Blocking；全部活动工作结束后，
        自动创建并完整验证一个升级前 Backup Run，成功才把 BackupPreflight 标为 Safe。失败保留维护状态和失败 Backup Run；
        Admin 修复原因后用新 clientCommandId 重试本操作。维护期间仅本操作、getMaintenanceState、exitMaintenance 和明确标记
        upgrade-drain 的取消命令可用；不存在强制跳过备份或活动工作 fence 的参数。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedCommandRequest'
      responses:
        '202':
          description: 已进入或继续 Upgrade 调和；调用方轮询 getMaintenanceState，全部项目 Safe 后才能停机。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/maintenance/exit:
    post:
      tags: [maintenance]
      operationId: exitMaintenance
      x-quoin-maintenance-access: allowed
      summary: 验证全部安全条件并退出维护（Admin）
      description: 幂等领域写命令；同一事务重验当前 Admin、expectedRowVersion 与 reason 对应的非空清单；active revision 在进入后到退出前冻结。不存在 force/skip（SEC-MAINT-003..005）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExitMaintenanceRequest'
      responses:
        '200':
          description: 已退出维护。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
