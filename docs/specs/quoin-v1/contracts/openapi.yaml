openapi: 3.1.0
info:
  title: Quoin v1 API
  version: 1.0.0-draft
  description: |
    Quoin v1 HTTP 与实时 API 的唯一机器权威（SPEC-VERSION-002 要求 /api/v1）。
    语义、跨请求事务、认证/会话、错误分类、回放/resync、上传下载、取消 fence、
    noVNC 升级关系与兼容性由 docs/specs/quoin-v1/http-api.md（CATEGORY=HTTP）承载；
    本文件只承载路由、方法、字段、状态码与可机械表达的 HTTP 契约。
    领域语义权威为 CONTEXT.md；持久化语义权威为 persistence.md 与 contracts/sql/schema.sql。
servers:
  - url: /
security:
  - sessionCookie: []
tags:
  - name: auth
    description: 登录、登出、当前用户、密码与 Session 管理
  - name: admin
    description: Admin 用户与审计管理
  - name: setup
    description: 首次设置与就绪状态
  - name: alerts
    description: 告警列表、详情、初步分析与接入问题
  - name: investigations
    description: 调查对话、附件、Undo 与执行尝试
  - name: inspections
    description: 巡检运行、报告与分析
  - name: knowledge
    description: 知识浏览、导入批次、候选确认与反馈
  - name: config
    description: 业务系统 YAML、Label Contract、浏览器身份与观测资源
  - name: adminops
    description: 连接、模型供应商、告警源、Runtime、备份与凭据管理
  - name: files
    description: Artifact 与来源材料的上传下载
  - name: realtime
    description: SSE 变更流
paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      x-external-dependency: true
      summary: 登录并签发 Session Cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功；Set-Cookie 写入 __Host-quoin-session（Secure HttpOnly SameSite=Lax Path=/）。
          headers:
            Set-Cookie:
              description: 32-byte opaque session bearer 的 Cookie；raw bearer 不进入任何持久存储或日志（DATA-AUTH-003）。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 登出并撤销当前 Session
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '204':
          description: 当前 Session 已撤销；Set-Cookie 清除 __Host-quoin-session。
          headers:
            Set-Cookie:
              description: 清除 __Host-quoin-session（Max-Age=0）。
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: 当前用户与强制改密状态
      description: 受限 Session（password_change_required=1）唯一允许的读操作之一（HTTP-AUTH-006）。
      responses:
        '200':
          description: 当前用户信息。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/password:
    put:
      tags: [auth]
      operationId: changeOwnPassword
      summary: 修改当前用户密码
      description: 成功改密在同一事务清除 password_change_required（DATA-AUTH-001）；撤销除当前外的其他 Session 并更新当前 Session revision（CONTEXT「本地账号认证」）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: 密码已修改，强制改密标志已清除。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/sessions:
    get:
      tags: [auth]
      operationId: listOwnSessions
      summary: 列出当前用户的全部 Session
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: 当前用户的 Session 分页列表。
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionInfo'
                  nextCursor:
                    $ref: '#/components/schemas/Cursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/sessions/{sessionId}/revoke:
    post:
      tags: [auth]
      operationId: revokeOwnSession
      summary: 撤销当前用户的其他 Session（不得撤销当前 Session）
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '204':
          description: 目标 Session 已撤销；其 SSE/WebSocket 立即关闭。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: 列出用户（Admin）
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 用户分页列表。
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSummary'
                  nextCursor:
                    $ref: '#/components/schemas/Cursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      operationId: createUser
      summary: 创建用户（Admin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: 用户已创建。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/admin/users/{userId}:
    patch:
      tags: [admin]
      operationId: updateUser
      summary: 更新用户显示名/启用状态/角色（Admin）
      description: 禁用或降级最后一个有效 Admin 必须冲突（DATA-TX-014）；账号变更事务递增 auth_revision 并撤销该用户全部 Session（CONTEXT「本地账号认证」）。
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: 更新后的用户。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/admin/users/{userId}/reset-password:
    post:
      tags: [admin]
      operationId: resetUserPassword
      summary: Admin 重置用户密码（置位强制改密并撤销全部 Session）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandBase'
                - $ref: '#/components/schemas/ExpectedRowVersion'
                - $ref: '#/components/schemas/ResetPasswordRequest'
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          description: 密码已重置；password_change_required=1；响应只在 auth_revision 递增且该用户此前全部有效 Session 已撤销后返回。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordPayload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/admin/users/{userId}/revoke-sessions:
    post:
      tags: [admin]
      operationId: revokeUserSessions
      summary: 撤销某用户全部 Session（Admin）
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          description: 该用户全部 Session 已撤销；对应 SSE/WebSocket 立即关闭。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevocationPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/audit-events:
    get:
      tags: [admin]
      operationId: listAuditEvents
      summary: 审计事件列表（全部登录用户可读）
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: actorType
          in: query
          schema:
            type: string
            enum: [user, service, system]
        - name: action
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: to
          in: query
          schema:
            $ref: '#/components/schemas/Timestamp'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: 追加型审计事件列表（按提交时间倒序）。
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEventSummary'
                  nextCursor:
                    $ref: '#/components/schemas/Cursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/setup:
    get:
      tags: [setup]
      operationId: getSetupStatus
      summary: 依赖驱动的首次设置清单与能力就绪状态
      description: 从权威状态派生；Admin 看到全部项目，Operator 只看到需要 Operator 处理的项目（CONTEXT「首次设置投影」）。
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: 设置清单。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/runtime:
    get:
      tags: [setup]
      operationId: getRuntimeStatus
      summary: Plinth/Lintel Runtime slot 状态
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: 两个固定 Runtime slot 的状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/runtime-slots/{slot}/replace:
    post:
      tags: [adminops]
      operationId: replaceRuntimeSlot
      x-external-dependency: true
      summary: 替换 Runtime slot（Admin；状态卷丢失时重建，不创建第二个 Runtime）
      description: |
        幂等领域写命令（携带 clientCommandId + expectedRowVersion，HTTP-COMMAND-010）：同一事务先确认
        fence（DATA-RUNTIME-001b：目标 slot 无绑定该 slot 的 active Execution Attempt（Assigned/Running/Cancelling），
        且 lintel 另无任何 active Browser Operation（非终态，或虽终态但 `stopConfirmedAt` 仍为空）），否则返回 409 active_conflict 且不得先行吊销；通过后
        单条 UPDATE 把 slot 置为 revoked 并清空 current/pending 凭据指针（AFTER 触发器 trg_runtime_slots_replace_retire_all
        自动 retire 该 slot 全部未退休凭据；被引用行在指针清空前禁止手动 retire，DATA-RUNTIME-001/002），同时生成内存短生命周期、
        单次使用的一次性注册令牌 reveal handle（HTTP-COMMAND-012）。响应只含非秘密元数据；首次实时响应可能
         携带 registrationTokenHandle（registrationTokenAvailable=true），由 `revealRuntimeRegistrationToken`
         一次性换取 raw 注册令牌（绑定 slot 与该 slot 下一个 credential generation）；命令重放返回
         registrationTokenAvailable=false 且无 handle，绝不重新生成。
        长期服务 token 只经已认证 gRPC 控制面下发/轮换（runtime-protocol.md），不进入 HTTP 响应。
      parameters:
        - $ref: '#/components/parameters/RuntimeSlot'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedCommandRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: slot 已进入替换流程；首次实时响应可能携带 registrationTokenHandle。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSlotReplacement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/runtime-slots/registration-token/reveal:
    post:
      tags: [adminops]
      operationId: revealRuntimeRegistrationToken
      summary: 一次性显示 Runtime 注册令牌（Admin；消费单次 reveal handle）
      description: |
        非领域写命令（HTTP-COMMAND-012）：不携带 clientCommandId；路由无 slot 路径参数，只接受
        replaceRuntimeSlot 首次实时响应返回的内存短生命周期、单次使用的 registrationTokenHandle，
        不接受 slot 本身。handle 与 raw 注册令牌均不落盘（SQLite、client_commands、日志、审计、
        Artifact、响应快照均禁止）；handle 无效、已消费或过期返回 410；会话无效 401；角色不足 403。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeRegistrationTokenRevealRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: 一次性返回 raw 注册令牌；消费后 handle 立即失效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeRegistrationTokenRevealResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          $ref: '#/components/responses/Gone'
  /api/v1/alerts:
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: 告警快照列表（含 snapshot_seq 与 row_version；游标绑定快照 seq）
      description: |
        默认只返回 Firing；Resolved 通过 state 过滤。普通列表不包含 IdentityConflict 等接入问题（CONTEXT「告警列表与详情」）。
        快照契约（HTTP-PAGE-006/HTTP-SSE-001）：snapshotSeq 取当前最大 alert_change_log.id（最新行由触发器保留，DATA-SSE-009；当前最大
        alert_change_log.id，DATA-SSE-009）；首响应生成服务端签名的短有效期游标（绑定首页 snapshotSeq 与键集位置），
        后续页回传同一 snapshotSeq，客户端以首页 snapshotSeq 建立 SSE（after）——分页期间的变化由事件回放补齐，无漏更新；
        游标过期返回 410（resource_expired），客户端重新从首页读取。
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [Firing, Resolved]
        - name: businessSystemKey
          in: query
          schema:
            $ref: '#/components/schemas/StableKey'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '410':
          $ref: '#/components/responses/Gone'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: 告警快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/alerts/{occurrenceId}:
    get:
      tags: [alerts]
      operationId: getAlertOccurrence
      summary: 告警详情（labels、Delivery 时间线、观测、匹配资源、分析与调查）
      description: Occurrence resolved 后仍可读取并明确标记已恢复（CONTEXT「告警列表与详情」）。
      parameters:
        - $ref: '#/components/parameters/OccurrenceId'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: 告警详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertOccurrenceDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/alerts/{occurrenceId}/matched-resources:
    get:
      tags: [alerts]
      operationId: listAlertMatchedResources
      summary: 当前 Label Contract 下匹配的 Observed Resource 候选（游标分页；可为零个或多个）
      description: 这是从当前完整 labels 与已发布配置机械计算的可重建投影，不是历史身份事实；不得任意选一个候选冒充唯一匹配。游标绑定当前 Label Contract 与相关已发布配置版本，版本变化后继续翻页返回 410 resource_expired（CONTEXT「告警与 Observed Resource 关联」）。
      parameters:
        - $ref: '#/components/parameters/OccurrenceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 匹配候选分页列表。
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ObservedResourceSummary'
                  nextCursor:
                    $ref: '#/components/schemas/Cursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
  /api/v1/alerts/{occurrenceId}/observations:
    get:
      tags: [alerts]
      operationId: listAlertObservations
      summary: Occurrence 观测时间线（不可变追加；游标分页，按 committedAt 倒序）
      parameters:
        - $ref: '#/components/parameters/OccurrenceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: 观测分页列表（每次送达一条不可变观测）。
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ObservationSummary'
                  nextCursor:
                    $ref: '#/components/schemas/Cursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/alerts/{occurrenceId}/investigations:
    get:
      tags: [alerts]
      operationId: listOccurrenceInvestigations
      summary: 关联该 Occurrence 的调查列表（游标分页）
      parameters:
        - $ref: '#/components/parameters/OccurrenceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: 关联调查分页列表。
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InvestigationSummary'
                  nextCursor:
                    $ref: '#/components/schemas/Cursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
