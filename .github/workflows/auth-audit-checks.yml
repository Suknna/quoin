name: auth-audit-checks

on:
  pull_request:
  push:
    branches: ['main', 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests, machine contracts and architecture
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Authentication, execution and lifecycle races
        run: make auth-audit-race
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API contract
        run: |
          pnpm --dir web generate:api
          git diff --exit-code -- web/src/api/generated/types.ts
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web lint
      - run: pnpm --dir web test
      - run: pnpm --dir web build
