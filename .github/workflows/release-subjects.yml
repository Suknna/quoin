name: Release Quoin

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      registry: ${{ steps.release.outputs.registry }}
    steps:
      - id: release
        env:
          VERSION: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use vX.Y.Z SemVer; got $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify source
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: go test ./... -count=1
      - run: go vet ./...
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web lint
      - run: pnpm --dir web test
      - run: pnpm --dir web build

  build:
    name: Build ${{ matrix.arch }} images
    needs: [prepare, verify]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      REGISTRY: ${{ needs.prepare.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish application images
        run: |
          set -euo pipefail
          for component in frontend quoin plinth stele; do
            args=(
              docker buildx build
              --platform "linux/${{ matrix.arch }}"
              --load
              --file "deploy/images/$component/Dockerfile"
              --tag "$REGISTRY/$component:$VERSION-${{ matrix.arch }}"
            )
            if [ "$component" != frontend ]; then
              args+=(--build-arg "RELEASE_VERSION=$VERSION")
            fi
            args+=(.)
            "${args[@]}"
            docker push "$REGISTRY/$component:$VERSION-${{ matrix.arch }}"
          done
      - name: Assemble offline Docker image package
        run: |
          set -euo pipefail
          caddy="caddy:2.10.2-alpine"
          for component in frontend quoin plinth stele; do
            docker tag "$REGISTRY/$component:$VERSION-${{ matrix.arch }}" "quoin/$component:$VERSION"
          done
          docker pull --platform "linux/${{ matrix.arch }}" "$caddy"
          docker image save --output "quoin-$VERSION-linux-${{ matrix.arch }}-images.tar" \
            "quoin/frontend:$VERSION" \
            "quoin/quoin:$VERSION" \
            "quoin/plinth:$VERSION" \
            "quoin/stele:$VERSION" \
            "$caddy"
          sha256sum "quoin-$VERSION-linux-${{ matrix.arch }}-images.tar" \
            > "quoin-$VERSION-linux-${{ matrix.arch }}-images.tar.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-images-${{ matrix.arch }}
          path: quoin-${{ env.VERSION }}-linux-${{ matrix.arch }}-images.tar*
          if-no-files-found: error

  publish:
    name: Publish multi-architecture images and release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      REGISTRY: ${{ needs.prepare.outputs.registry }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture image tags
        run: |
          set -euo pipefail
          for component in frontend quoin plinth stele; do
            docker buildx imagetools create \
              --tag "$REGISTRY/$component:$VERSION" \
              "$REGISTRY/$component:$VERSION-amd64" \
              "$REGISTRY/$component:$VERSION-arm64"
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: offline-images-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release with simple automatic notes
        run: |
          set -euo pipefail
          cat > release-intro.md <<EOF
          ## Quoin $VERSION

          这是 Quoin 的首个公开版本。请下载与部署主机架构相符的离线镜像包，并在导入前校验 SHA-256 文件。

          包含 frontend、quoin、plinth、stele 四个应用镜像及部署所需的 Caddy 镜像。部署步骤见仓库的《部署参考》。
          EOF
          gh release create "$VERSION" release-assets/* \
            --title "Quoin $VERSION" \
            --notes-file release-intro.md \
            --generate-notes
