# This is the human-maintained source for the independent frontend's stock
# Caddy configuration. The image build converts its Caddyfile value to Caddy's
# native JSON, so runtime needs no adapter or custom server binary.
caddyfile: |
  :8080 {
    # The entry proxy owns API dispatch. A separate handler prevents a proxy
    # routing fault from converting an API error into a successful SPA document.
    handle /api {
      respond 404
    }
    handle /api/* {
      respond 404
    }

    handle {
      root * /srv
      header {
        Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
        Referrer-Policy "no-referrer"
        X-Content-Type-Options "nosniff"
      }

      # SPA fallbacks are documents, not immutable resources. Applying this
      # before try_files covers both /index.html and deep-route HTML.
      @documents not path /assets/*
      header @documents Cache-Control "no-cache"
      @assets path /assets/*
      header @assets Cache-Control "public, max-age=31536000, immutable"

      # A pathname without a static file is a client route and must survive a
      # direct navigation or refresh.
      try_files {path} /index.html
      file_server
    }
  }
